[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstep-gateway-protocol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/workstep_gateway_protocol"]

[dependency-groups]
dev = ["pytest>=8.0"]
