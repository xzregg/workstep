[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstep-webrtc-signal"
version = "0.1.0"
description = "Reusable database-free WebRTC signaling hub and async UDP STUN server"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "workstep-gateway-protocol",
]

[tool.uv.sources]
workstep-gateway-protocol = { path = "../gateway-protocol", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/workstep_webrtc_signal"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
