<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkStep 预览示例</title>
  <style>
    :root { --bg:#0f1115; --card:#171b22; --fg:#e6e8ee; --dim:#9aa4b2; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .sub { color: var(--dim); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid #262c36; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .row { display:flex; gap:16px; }
    .row .card { flex:1; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; background:rgba(79,140,255,.15); color:var(--accent); font-size:12px; }
    button { padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; cursor:pointer; }
    button.ghost { background:transparent; color:var(--dim); border-color:#2b3340; }
    #out { color: var(--accent); margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WorkStep 消息预览示例</h1>
    <p class="sub">这是一段可直接在浏览器打开的静态 HTML，用于验证消息渲染能力。</p>
    <div class="row">
      <div class="card">
        <span class="pill">卡片 A</span>
        <p style="color:var(--dim);margin:12px 0 0">带样式与图标的展示区。</p>
      </div>
      <div class="card">
        <span class="pill">卡片 B</span>
        <p style="color:var(--dim);margin:12px 0 0">点击按钮触发交互反馈。</p>
        <button id="go">点我</button>
        <button class="ghost">次要</button>
        <div id="out"></div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', () => {
      document.getElementById('out').textContent = '已触发 → 交互可用';
    });
  </script>
</body>
</html>
