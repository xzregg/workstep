<div id="quick-button-settings-prototype" aria-label="快捷按钮设置">
  <style>
    #quick-button-settings-prototype{--s:light-dark(#fff,#20242b);--fg:light-dark(#232832,#f2f4f7);--fg2:light-dark(#586273,#b2bac7);--muted:light-dark(#727c8d,#97a1b1);--line:light-dark(#dfe4eb,#3b4451);--line2:light-dark(#edf0f4,#303843);--soft:light-dark(#f5f7fa,#29303a);--a:light-dark(#336fd4,#80adff);--abg:light-dark(#eaf1ff,#25385c);--danger:light-dark(#c43434,#ff9d9d);color-scheme:light dark;color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#quick-button-settings-prototype *{box-sizing:border-box}.panel{padding:20px;background:var(--s);border:1px solid var(--line);border-radius:12px;max-width:850px;margin:auto}.hint{margin:0 0 16px;color:var(--muted);font-size:12px}.content{display:flex;gap:18px;align-items:stretch;min-height:330px}.list{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding-right:14px;border-right:1px solid var(--line2)}.shortcut,.add{width:100%;min-height:38px;padding:7px 10px;border-radius:8px;background:var(--s);color:var(--fg2);font:inherit;font-size:12px;text-align:left}.shortcut{border:1px solid var(--line)}.shortcut.active{border-color:var(--a);background:var(--abg);color:var(--a);font-weight:600}.shortcut small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:400}.add{border:0;color:var(--fg2)}.detail{flex:1;min-width:0}.field{margin-bottom:12px}.label{display:block;margin-bottom:5px;color:var(--fg2);font-size:12px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:var(--s);color:var(--fg);font:inherit}.textarea{height:105px;resize:none}.check{display:flex;align-items:center;gap:7px;color:var(--fg2);font-size:12px}.check input{width:16px;height:16px;margin:0}.help{margin:0;color:var(--muted);font-size:12px}.subform{display:none}.subform.show{display:block}.action-card{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.action-card strong{font-weight:600}.path{margin:8px 0;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.footer{display:flex;gap:10px;align-items:center;margin-top:18px}.primary{border:0;border-radius:7px;padding:8px 13px;background:var(--a);color:white;font:inherit}.ghost{border:0;background:transparent;color:var(--danger);font:inherit;padding:8px}.saved{color:var(--muted);font-size:12px}@media(max-width:600px){.panel{padding:14px}.content{display:block}.list{width:100%;border-right:0;border-bottom:1px solid var(--line2);padding:0 0 12px;margin-bottom:14px;display:flex;flex-direction:row;overflow:auto}.shortcut,.add{min-width:145px}}
  </style>
  <section class="panel">
    <p class="hint">显示在输入框上方的快捷指令。拖动左侧按钮调整显示顺序。</p>
    <div class="content">
      <div class="list" aria-label="快捷按钮列表"><button class="shortcut" type="button">生成实现<small>提示词 · 立即发送</small></button><button class="shortcut" type="button">研发分支<small>展示</small></button><button class="shortcut active" type="button">新快捷按钮<small>未设置类型</small></button><button class="add" id="add" type="button">＋ 添加快捷按钮</button></div>
      <div class="detail">
        <label class="field"><span class="label">类型</span><select class="select" id="type"><option value="">请选择类型</option><option value="prompt">提示词</option><option value="display">展示</option><option value="action">动作</option></select></label>
        <div class="subform" id="prompt-form"><label class="field"><span class="label">按钮标题</span><input class="input" value="生成实现"></label><label class="field"><span class="label">提示词</span><textarea class="textarea">请根据当前项目目标完成实现。</textarea></label><label class="check"><input type="checkbox" checked>点击后立即发送</label><p class="help" style="margin-top:9px">关闭后仅填入输入框，用户可修改后再发送。</p></div>
        <div class="subform" id="display-form"><label class="field"><span class="label">显示标题</span><input class="input" value="研发分支：feature/login"></label><p class="help">展示类型没有文本；标题支持安全 HTML。</p></div>
        <div class="subform" id="action-form"><label class="field"><span class="label">Action 作用范围</span><select class="select"><option>项目 Actions</option><option>研发流程 Actions</option></select></label><div class="action-card"><strong>⚡ 重启开发服务</strong><div class="path">.workstep/actions/restart-dev/action.json</div><label class="check"><input type="checkbox" checked>显示在输入框的快捷按钮中</label></div><p class="help" style="margin-top:9px">脚本与运行方式由 Actions 清单维护；这里仅设置显示范围和标题。</p></div>
        <div class="footer" id="footer" hidden><button class="primary" id="save" type="button">保存</button><button class="ghost" type="button">删除</button><span class="saved" id="saved"></span></div>
      </div>
    </div>
  </section>
  <script>
    const root=document.getElementById('quick-button-settings-prototype'),type=root.querySelector('#type'),footer=root.querySelector('#footer'),saved=root.querySelector('#saved');
    function update(){root.querySelectorAll('.subform').forEach(item=>item.classList.remove('show'));const value=type.value;if(value){root.querySelector('#'+value+'-form').classList.add('show');footer.hidden=false;}else footer.hidden=true;saved.textContent='';}
    type.addEventListener('change',update);
    root.querySelector('#add').addEventListener('click',()=>{type.value='';update();});
    root.querySelector('#save').addEventListener('click',()=>{saved.textContent='快捷按钮已保存';});
  </script>
</div>
