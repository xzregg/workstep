    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      modelContent: null,
      privateContent: null,
      ...parsedState,

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      openExternal,

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                if (data.ok === true) {

        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

        &lt;div class=&quot;diagram-node blue&quot;&gt;&lt;strong&gt;解析脚本文件&lt;/strong&gt;&lt;span&gt;校验相对路径与 Action 根目录&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node blue&quot;&gt;&lt;strong&gt;准备运行环境&lt;/strong&gt;&lt;span&gt;任务目录、变量、Worktree 映射&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node blue&quot;&gt;&lt;strong&gt;启动进程组&lt;/strong&gt;&lt;span&gt;异步读取 stdout / stderr&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node&quot;&gt;&lt;strong&gt;实时更新回复&lt;/strong&gt;&lt;span&gt;运行状态、日志和时长&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node green&quot;&gt;&lt;strong&gt;脚本正常退出&lt;/strong&gt;&lt;span&gt;成功或失败，记录退出码&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node red&quot;&gt;&lt;strong&gt;用户点击停止&lt;/strong&gt;&lt;span&gt;消息进入“正在停止”&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;diagram-node red&quot;&gt;&lt;strong&gt;终止整个进程组&lt;/strong&gt;&lt;span&gt;SIGTERM，超时后 SIGKILL&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;overlay&quot; data-overlay=&quot;picker&quot; hidden&gt;
      &lt;section class=&quot;dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;选择 Action 脚本&quot;&gt;
        &lt;header class=&quot;dialog-head&quot;&gt;&lt;div&gt;&lt;b&gt;选择 Action 脚本&lt;/b&gt;&lt;small data-picker-root&gt;.workstep/actions/restart-services/&lt;/small&gt;&lt;/div&gt;&lt;button class=&quot;secondary&quot; type=&quot;button&quot; data-close-overlay&gt;关闭&lt;/button&gt;&lt;/header&gt;
        &lt;div class=&quot;dialog-body browser-body&quot;&gt;
          &lt;div class=&quot;tree&quot;&gt;&lt;div class=&quot;tree-row&quot;&gt;▾ restart-services&lt;/div&gt;&lt;div class=&quot;tree-row active&quot;&gt;　▾ scripts&lt;/div&gt;&lt;div class=&quot;tree-row&quot;&gt;　　assets&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;files&quot;&gt;
            &lt;button class=&quot;file-item selected&quot; type=&quot;button&quot; data-picker-file=&quot;scripts/restart-services.sh&quot;&gt;&lt;b&gt;restart-services.sh&lt;/b&gt;&lt;span&gt;Shell&lt;/span&gt;&lt;span&gt;1.8 KB&lt;/span&gt;&lt;/button&gt;
            &lt;button class=&quot;file-item&quot; type=&quot;button&quot; data-picker-file=&quot;scripts/stop-services.sh&quot;&gt;&lt;b&gt;stop-services.sh&lt;/b&gt;&lt;span&gt;Shell&lt;/span&gt;&lt;span&gt;0.9 KB&lt;/span&gt;&lt;/button&gt;
            &lt;button class=&quot;file-item&quot; type=&quot;button&quot; data-picker-file=&quot;scripts/check-health.py&quot;&gt;&lt;b&gt;check-health.py&lt;/b&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;1.2 KB&lt;/span&gt;&lt;/button&gt;

    &lt;div class=&quot;overlay&quot; data-overlay=&quot;preview&quot; hidden&gt;
      &lt;section class=&quot;dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;脚本文件预览&quot;&gt;
        &lt;header class=&quot;dialog-head&quot;&gt;&lt;div&gt;&lt;b data-preview-name&gt;restart-services.sh&lt;/b&gt;&lt;small data-preview-path&gt;.workstep/actions/restart-services/scripts/restart-services.sh&lt;/small&gt;&lt;/div&gt;&lt;button class=&quot;secondary&quot; type=&quot;button&quot; data-close-overlay&gt;关闭&lt;/button&gt;&lt;/header&gt;
        &lt;div class=&quot;dialog-body&quot;&gt;&lt;pre class=&quot;preview-code&quot; data-preview-code&gt;#!/usr/bin/env bash
set -euo pipefail

worktrees_file=&quot;${WORKSTEP_WORKTREES_FILE}&quot;
backend_dir=&quot;$(jq -r &#x27;.worktrees[] | select(.repository_id == &quot;repo-backend&quot;) | .path&#x27; &quot;$worktrees_file&quot;)&quot;
web_dir=&quot;$(jq -r &#x27;.worktrees[] | select(.repository_id == &quot;repo-web&quot;) | .path&#x27; &quot;$worktrees_file&quot;)&quot;

cleanup() {
  kill &quot;$backend_pid&quot; &quot;$web_pid&quot; 2&amp;gt;/dev/null || true
}
trap cleanup TERM INT EXIT

(cd &quot;$backend_dir&quot; &amp;amp;&amp;amp; ./scripts/start.sh) &amp;amp;
backend_pid=$!
(cd &quot;$web_dir&quot; &amp;amp;&amp;amp; yarn dev) &amp;amp;
web_pid=$!
wait&lt;/pre&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;overlay&quot; data-overlay=&quot;confirm&quot; hidden&gt;
      &lt;section class=&quot;dialog confirm-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;确认执行 Action&quot;&gt;
        &lt;header class=&quot;dialog-head&quot;&gt;&lt;div&gt;&lt;b&gt;确认执行“重启服务”？&lt;/b&gt;&lt;small&gt;该 Action 将在当前任务环境中运行脚本。&lt;/small&gt;&lt;/div&gt;&lt;/header&gt;
        &lt;div class=&quot;dialog-body&quot;&gt;&lt;div class=&quot;confirm-summary&quot;&gt;&lt;div&gt;&lt;b&gt;脚本：&lt;/b&gt;scripts/restart-services.sh&lt;/div&gt;&lt;div&gt;&lt;b&gt;执行目录：&lt;/b&gt;流程任务目录&lt;/div&gt;&lt;div&gt;&lt;b&gt;任务：&lt;/b&gt;实现登录功能 #1023&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;footer class=&quot;dialog-foot&quot;&gt;&lt;button class=&quot;secondary&quot; type=&quot;button&quot; data-close-overlay&gt;取消&lt;/button&gt;&lt;button class=&quot;primary&quot; type=&quot;button&quot; data-confirm-run&gt;确认执行&lt;/button&gt;&lt;/footer&gt;
      &lt;/section&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;workstep-action-prototype&#x27;);
      const screens = [...root.querySelectorAll(&#x27;[data-panel]&#x27;)];
      const tabs = [...root.querySelectorAll(&#x27;[data-screen]&#x27;)];
      const state = { density: &#x27;compact&#x27;, stopStyle: &#x27;outline&#x27; };

      const fieldMarkup = (kind, title, scope) =&gt; {
        if (kind === &#x27;prompt&#x27;) return `&lt;label class=&quot;field&quot;&gt;&lt;span&gt;标题&lt;/span&gt;&lt;input class=&quot;input&quot; value=&quot;${title || &#x27;继续分析&#x27;}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;field&quot;&gt;&lt;span&gt;文本&lt;/span&gt;&lt;textarea class=&quot;textarea&quot;&gt;请结合当前任务和已有结果继续分析。&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; checked&gt;立即发送&lt;/label&gt;`;
        if (kind === &#x27;display&#x27;) return `&lt;label class=&quot;field&quot;&gt;&lt;span&gt;标题（安全 HTML）&lt;/span&gt;&lt;input class=&quot;input&quot; value=&quot;&lt;strong&gt;${title || &#x27;研发工具&#x27;}&lt;/strong&gt;&quot;&gt;&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;展示类型没有消息文本，点击后不会发送消息。&lt;/p&gt;`;
        if (kind === &#x27;action&#x27;) {
          const workflow = scope === &#x27;stage&#x27;;
          return `&lt;label class=&quot;field&quot;&gt;&lt;span&gt;标题&lt;/span&gt;&lt;input class=&quot;input&quot; value=&quot;${title || &#x27;重启服务&#x27;}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;field&quot;&gt;&lt;span&gt;Action&lt;/span&gt;&lt;input class=&quot;input&quot; value=&quot;restart-services&quot;&gt;&lt;/label&gt;&lt;label class=&quot;field&quot;&gt;&lt;span&gt;脚本文件&lt;/span&gt;&lt;div class=&quot;file-row&quot;&gt;&lt;input class=&quot;input script-path&quot; value=&quot;scripts/restart-services.sh&quot; readonly&gt;&lt;button class=&quot;secondary&quot; type=&quot;button&quot; data-select-script&gt;选择…&lt;/button&gt;&lt;button class=&quot;secondary&quot; type=&quot;button&quot; data-preview-script&gt;预览&lt;/button&gt;&lt;/div&gt;&lt;/label&gt;&lt;label class=&quot;field&quot;&gt;&lt;span&gt;执行目录&lt;/span&gt;&lt;select class=&quot;select&quot;&gt;&lt;option${workflow ? &#x27;&#x27; : &#x27; selected&#x27;}&gt;项目目录&lt;/option&gt;&lt;option${workflow ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;流程任务目录&lt;/option&gt;&lt;option&gt;Git 工作区（脚本选择）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;require-confirm&quot; checked&gt;执行前需要用户确认&lt;/label&gt;&lt;div class=&quot;path&quot;&gt;Action 目录：${workflow ? &#x27;.workstep/artifacts/wf-dev/actions/restart-services/&#x27; : &#x27;.workstep/actions/restart-services/&#x27;}&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;脚本路径相对于 Action 目录保存；Git 工作区模式从 WORKSTEP_WORKTREES_FILE 读取当前任务的仓库路径。&lt;/p&gt;`;
        }
        return &#x27;&lt;p class=&quot;hint&quot;&gt;请先选择快捷按钮类型。&lt;/p&gt;&#x27;;
      };

      function setScreen(name) {
        tabs.forEach((tab) =&gt; tab.classList.toggle(&#x27;active&#x27;, tab.dataset.screen === name));
        screens.forEach((screen) =&gt; screen.classList.toggle(&#x27;active&#x27;, screen.dataset.panel === name));
      }
      tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; setScreen(tab.dataset.screen)));

      root.querySelectorAll(&#x27;.editor-form&#x27;).forEach((form) =&gt; {
        const scope = form.closest(&#x27;[data-panel]&#x27;).dataset.panel === &#x27;stage&#x27; ? &#x27;stage&#x27; : &#x27;project&#x27;;
        const select = form.querySelector(&#x27;.kind-select&#x27;);
        const fields = form.querySelector(&#x27;.conditional-fields&#x27;);
        let currentTitle = scope === &#x27;stage&#x27; ? &#x27;重启服务&#x27; : &#x27;重启全部服务&#x27;;
        const renderFields = () =&gt; { fields.innerHTML = fieldMarkup(select.value, currentTitle, scope); };
        renderFields();
        select.addEventListener(&#x27;change&#x27;, renderFields);
        form.closest(&#x27;.split-editor, .mini-editor&#x27;).querySelectorAll(&#x27;.list-item[data-kind]&#x27;).forEach((item) =&gt; {
          item.addEventListener(&#x27;click&#x27;, () =&gt; {
            item.parentElement.querySelectorAll(&#x27;.list-item&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;active&#x27;));
            item.classList.add(&#x27;active&#x27;);
            currentTitle = item.dataset.title;
            select.value = item.dataset.kind;
            renderFields();
          });
        });
        const save = form.querySelector(&#x27;.primary&#x27;);
        if (save) save.addEventListener(&#x27;click&#x27;, () =&gt; {
          const status = form.querySelector(&#x27;.save-state&#x27;);
          if (status) status.textContent = &#x27;已保存&#x27;;
        });
      });

      const overlays = [...root.querySelectorAll(&#x27;[data-overlay]&#x27;)];
      const picker = root.querySelector(&#x27;[data-overlay=&quot;picker&quot;]&#x27;);
      const preview = root.querySelector(&#x27;[data-overlay=&quot;preview&quot;]&#x27;);
      const confirm = root.querySelector(&#x27;[data-overlay=&quot;confirm&quot;]&#x27;);
      let pickerInput = null;
      let selectedScript = &#x27;scripts/restart-services.sh&#x27;;
      const openOverlay = (overlay) =&gt; { overlays.forEach((item) =&gt; { item.hidden = item !== overlay; }); };
      const closeOverlays = () =&gt; { overlays.forEach((item) =&gt; { item.hidden = true; }); };
      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const target = event.target.closest(&#x27;button&#x27;);
        if (!target) return;
        if (target.matches(&#x27;[data-close-overlay]&#x27;)) closeOverlays();
        if (target.matches(&#x27;[data-select-script]&#x27;)) {
          pickerInput = target.closest(&#x27;.file-row&#x27;).querySelector(&#x27;.script-path&#x27;);
          const workflow = target.closest(&#x27;[data-panel]&#x27;).dataset.panel === &#x27;stage&#x27;;
          picker.querySelector(&#x27;[data-picker-root]&#x27;).textContent = workflow ? &#x27;.workstep/artifacts/wf-dev/actions/restart-services/&#x27; : &#x27;.workstep/actions/restart-services/&#x27;;
          openOverlay(picker);
        }
        if (target.matches(&#x27;[data-picker-file]&#x27;)) {
          picker.querySelectorAll(&#x27;[data-picker-file]&#x27;).forEach((item) =&gt; item.classList.remove(&#x27;selected&#x27;));
          target.classList.add(&#x27;selected&#x27;);
          selectedScript = target.dataset.pickerFile;
          picker.querySelector(&#x27;[data-picker-selection]&#x27;).textContent = `已选择 ${selectedScript}`;
        }
        if (target.matches(&#x27;[data-picker-confirm]&#x27;)) {
          if (pickerInput) pickerInput.value = selectedScript;
          closeOverlays();
        }
        if (target.matches(&#x27;[data-preview-script]&#x27;)) {
          const input = target.closest(&#x27;.file-row&#x27;).querySelector(&#x27;.script-path&#x27;);
          const workflow = target.closest(&#x27;[data-panel]&#x27;).dataset.panel === &#x27;stage&#x27;;
          const base = workflow ? &#x27;.workstep/artifacts/wf-dev/actions/restart-services/&#x27; : &#x27;.workstep/actions/restart-services/&#x27;;
          preview.querySelector(&#x27;[data-preview-name]&#x27;).textContent = input.value.split(&#x27;/&#x27;).pop();
          preview.querySelector(&#x27;[data-preview-path]&#x27;).textContent = base + input.value;
          const previewCode = preview.querySelector(&#x27;[data-preview-code]&#x27;);
          if (input.value.endsWith(&#x27;stop-services.sh&#x27;)) {
            previewCode.textContent = &#x27;#!/usr/bin/env bash\nset -euo pipefail\n\npkill -TERM -P &quot;${WORKSTEP_ACTION_RUN_ID}&quot; 2&gt;/dev/null || true\necho &quot;services stopped&quot;&#x27;;
          } else if (input.value.endsWith(&#x27;check-health.py&#x27;)) {
            previewCode.textContent = &#x27;import os\nimport json\n\nwith open(os.environ[&quot;WORKSTEP_WORKTREES_FILE&quot;], encoding=&quot;utf-8&quot;) as stream:\n    worktrees = json.load(stream)[&quot;worktrees&quot;]\n\nprint(f&quot;checking {len(worktrees)} worktrees&quot;)&#x27;;
          } else {
            previewCode.textContent = &#x27;#!/usr/bin/env bash\nset -euo pipefail\n\nworktrees_file=&quot;${WORKSTEP_WORKTREES_FILE}&quot;\nbackend_dir=&quot;$(jq -r \&#x27;.worktrees[] | select(.repository_id == &quot;repo-backend&quot;) | .path\&#x27; &quot;$worktrees_file&quot;)&quot;\nweb_dir=&quot;$(jq -r \&#x27;.worktrees[] | select(.repository_id == &quot;repo-web&quot;) | .path\&#x27; &quot;$worktrees_file&quot;)&quot;\n\ncleanup() {\n  kill &quot;$backend_pid&quot; &quot;$web_pid&quot; 2&gt;/dev/null || true\n}\ntrap cleanup TERM INT EXIT\n\n(cd &quot;$backend_dir&quot; &amp;&amp; ./scripts/start.sh) &amp;\nbackend_pid=$!\n(cd &quot;$web_dir&quot; &amp;&amp; yarn dev) &amp;\nweb_pid=$!\nwait&#x27;;
          }
          openOverlay(preview);
        }
      });

      const stop = root.querySelector(&#x27;[data-stop]&#x27;);
      const restart = root.querySelector(&#x27;[data-restart]&#x27;);
      const spinner = root.querySelector(&#x27;[data-spinner]&#x27;);
      const runTitle = root.querySelector(&#x27;[data-run-title]&#x27;);
      const runStatus = root.querySelector(&#x27;[data-run-status]&#x27;);
      const output = root.querySelector(&#x27;[data-output]&#x27;);
      stop.addEventListener(&#x27;click&#x27;, () =&gt; {
        stop.disabled = true;
        stop.textContent = &#x27;正在停止…&#x27;;
        runStatus.textContent = &#x27;正在终止脚本及其子进程&#x27;;
        window.setTimeout(() =&gt; {
          spinner.classList.add(&#x27;stopped&#x27;);
          runTitle.textContent = &#x27;已停止：重启服务&#x27;;
          runStatus.textContent = &#x27;由用户停止 · 已运行 14 秒&#x27;;
          output.textContent += &#x27;\n[action] received SIGTERM\n[action] stopped&#x27;;
          stop.hidden = true;
          restart.disabled = false;
          restart.textContent = &#x27;▶ 重启服务&#x27;;
        }, 650);
      });
      const startRun = () =&gt; {
        closeOverlays();
        spinner.classList.remove(&#x27;stopped&#x27;);
        runTitle.textContent = &#x27;正在运行：重启服务&#x27;;
        runStatus.textContent = &#x27;刚刚启动&#x27;;
        output.textContent = &#x27;[action] resolving worktrees.json\n[backend] starting...\n[web] starting...&#x27;;
        stop.hidden = false;
        stop.disabled = false;
        stop.textContent = &#x27;■ 停止&#x27;;
        restart.disabled = true;
        restart.textContent = &#x27;◌ 重启服务 · 执行中&#x27;;
      };
      restart.addEventListener(&#x27;click&#x27;, () =&gt; openOverlay(confirm));
      root.querySelector(&#x27;[data-confirm-run]&#x27;).addEventListener(&#x27;click&#x27;, startRun);

      function renderTweaks() {
        root.style.setProperty(&#x27;--prototype-gap&#x27;, state.density === &#x27;compact&#x27; ? &#x27;8px&#x27; : &#x27;14px&#x27;);
        stop.style.background = state.stopStyle === &#x27;filled&#x27; ? &#x27;var(--ws-red-soft)&#x27; : &#x27;transparent&#x27;;
      }
      renderTweaks();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: renderTweaks });
        tweak.addSelect(state, &#x27;density&#x27;, { label: &#x27;界面密度&#x27;, options: [{ label: &#x27;紧凑&#x27;, value: &#x27;compact&#x27; }, { label: &#x27;舒展&#x27;, value: &#x27;comfortable&#x27; }] });
        tweak.addSelect(state, &#x27;stopStyle&#x27;, { label: &#x27;停止按钮&#x27;, options: [{ label: &#x27;描边&#x27;, value: &#x27;outline&#x27; }, { label: &#x27;浅色填充&#x27;, value: &#x27;filled&#x27; }] });
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
