<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 B · 右侧图标切换 + 按步骤分组表格</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f5f5f7; --fg:#1d1d1f; --fg-2:#424245;
    --muted:#6e6e73; --meta:#86868b; --border:#d2d2d7; --border-soft:#eeeef0;
    --accent:#0071e3; --accent-light:#e6f0ff;
    --status-ready:#86868b; --status-running:#0071e3; --status-paused:#eab308;
    --status-done:#16a34a; --status-failed:#dc2626; --status-retrying:#d97706;
    --radius-sm:10px; --radius-md:12px; --radius-pill:999px;
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }

  /* ── 顶栏 ── */
  .topbar { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
  .topbar h1 { font-size:15px; margin:0; font-weight:600; }
  .topbar .project { color:var(--meta); font-size:13px; }
  .search { position:relative; }
  .search input { width:220px; height:32px; border:1px solid var(--border); border-radius:var(--radius-pill); background:var(--surface); padding:0 14px 0 32px; font-size:13px; outline:none; }
  .search input:focus { border-color:var(--accent); background:#fff; }
  .search input:focus { border-color:var(--accent); }
  .search::before { content:"🔍"; position:absolute; left:11px; top:8px; font-size:12px; opacity:.5; }
  .search input { padding:0 14px 0 32px; height:32px; border:1px solid var(--border); border-radius:var(--radius-pill); background:var(--surface); font-size:13px; outline:none; }
  .search input:focus { border-color:var(--accent); background:#fff; }

  /* ── 方案 B 核心:图标切换器(右上角)── */
  .view-toggle { margin-left:auto; display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-pill); padding:2px; gap:2px; background:var(--bg); }
  .view-toggle button { border:0; background:transparent; width:32px; height:28px; border-radius:var(--radius-pill); cursor:pointer; display:grid; place-items:center; color:var(--meta); transition:all .15s; position:relative; }
  .view-toggle button.active { background:var(--accent); color:#fff; }
  .view-toggle svg { width:15px; height:15px; }
  /* tooltip:按钮本体无文字,悬停时在下方弹出深色气泡 */
  .view-toggle button::after { content:attr(data-tip); position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#1d1d1f; color:#fff; font-size:11px; line-height:1.4; padding:3px 8px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:10; }
  .view-toggle button:hover::after { opacity:1; }

  main { flex:1; overflow:hidden; display:flex; flex-direction:column; }

  /* 泳道视图 */
  .lanes { flex:1; display:flex; overflow-x:auto; overflow-y:hidden; padding:16px 16px 16px 0; }
  .lane { min-width:260px; max-width:320px; flex-shrink:0; background:var(--surface); border-radius:var(--radius-md); display:flex; flex-direction:column; margin-right:12px; overflow:hidden; }
  .lane-head { padding:12px 14px 8px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  .lane-head .dot { width:8px; height:8px; border-radius:50%; }
  .lane-head .count { color:var(--meta); font-weight:400; }
  .lane-head .add { margin-left:auto; border:0; background:transparent; color:var(--accent); font-size:12px; cursor:pointer; }
  .lane-body { flex:1; overflow-y:auto; padding:4px 10px 10px; display:flex; flex-direction:column; gap:8px; min-height:120px; }
  .card { background:#fff; border-radius:var(--radius-sm); padding:10px 12px; border-left:3px solid var(--status-ready); cursor:grab; }
  .card .title { font-size:13px; font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--meta); }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border-radius:var(--radius-pill); font-size:11px; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }

  /* 表格视图(按步骤分组)*/
  .table-wrap { flex:1; overflow:auto; padding:16px 20px 24px; }
  .group { border:1px solid var(--border-soft); border-radius:var(--radius-md); margin-bottom:14px; overflow:hidden; }
  .group-head { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border-soft); font-size:13px; font-weight:600; border-left:3px solid transparent; }
  .group-head .dot { width:8px; height:8px; border-radius:50%; }
  .group-head .count { color:var(--meta); font-weight:400; font-size:12px; }
  .group-head .collapse { margin-left:auto; border:0; background:transparent; color:var(--meta); cursor:pointer; font-size:12px; }
  .group table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  .group table col.c-task { width:38%; } .group table col.c-status { width:15%; }
  .group table col.c-creator { width:14%; } .group table col.c-dur { width:15%; } .group table col.c-upd { width:18%; }
  .group thead th { position:sticky; top:0; background:var(--bg); text-align:left; font-size:11px; font-weight:600; color:var(--meta); padding:6px 14px; }
  .group tbody td { padding:9px 14px; border-top:1px solid var(--border-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group tbody tr { cursor:pointer; }
  .group tbody tr:hover { background:var(--accent-light); }
  .cell-task { font-weight:600; }
  .num { color:var(--meta); font-variant-numeric:tabular-nums; }
  .empty-group { padding:18px 14px; font-size:12px; color:var(--meta); }

  /* 底部说明 */
  .notes { flex-shrink:0; border-top:1px solid var(--border-soft); background:var(--surface); padding:12px 20px; font-size:12px; color:var(--muted); }
  .notes b { color:var(--fg-2); }
  .notes .pros { color:var(--status-done); } .notes .cons { color:var(--status-failed); }
</style>
</head>
<body>

<div class="topbar">
  <h1>任务看板</h1>
  <span class="project">电商后台重构</span>
  <div class="search"><input placeholder="搜索任务…" /></div>
  <div class="view-toggle" role="group" aria-label="切换视图">
    <button id="vt-lane" class="active" data-tip="泳道" aria-label="泳道视图">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="1.5" y="2" width="4" height="12" rx="1"/><rect x="6.5" y="2" width="4" height="8" rx="1"/><rect x="11.5" y="2" width="4" height="10" rx="1"/>
      </svg>
    </button>
    <button id="vt-table" data-tip="表格" aria-label="表格视图">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="1.5" y1="6.2" x2="14.5" y2="6.2"/><line x1="1.5" y1="9.8" x2="14.5" y2="9.8"/>
      </svg>
    </button>
  </div>
</div>

<main>
  <div class="lanes" id="view-lane"></div>
  <div class="table-wrap" id="view-table" style="display:none"></div>
</main>

<div class="notes">
  <b>方案 B · 右上角图标切换 + 按步骤分组表格</b> — 切换器为「列图标 / 行图标」双按钮,放在顶栏最右;表格模式按步骤分组(组头 = 彩色圆点 + 步骤名 + 数量,可折叠),组内为任务行,延续泳道的颜色语言。<br />
  <span class="pros">✓ 视图间过渡自然,步骤维度与颜色系统完整保留;组头可折叠,一屏纵览全流程</span>
  <span class="cons" style="margin-left:12px">✗ 分组布局实现较重(组头/折叠/跨组排序需单独设计);步骤多时纵向占用高</span>
</div>

<script>
const STEPS = [
  { key:'req',      label:'需求',   color:'#0071e3' },
  { key:'ui',       label:'UI 设计', color:'#7c3aed' },
  { key:'frontend', label:'前端',   color:'#059669' },
  { key:'backend',  label:'后端',   color:'#d97706' },
  { key:'test',     label:'测试',   color:'#dc2626' },
  { key:'deploy',   label:'部署',   color:'#16a34a' },
];
const STATUS = {
  ready:{ label:'未开始', color:'var(--status-ready)' },
  running:{ label:'进行中', color:'var(--status-running)' },
  paused:{ label:'已暂停', color:'var(--status-paused)' },
  done:{ label:'已完成', color:'var(--status-done)' },
  failed:{ label:'失败', color:'var(--status-failed)' },
  retrying:{ label:'重试中', color:'var(--status-retrying)' },
};
const TASKS = [
  { title:'订单列表筛选条件持久化', step:'frontend', status:'running',  creator:'林一', dur:'1h 24m', upd:'10:42' },
  { title:'订单导出接口分页修复',   step:'backend',  status:'running',  creator:'陈默', dur:'48m',    upd:'10:38' },
  { title:'退款流程状态机设计',     step:'req',      status:'done',     creator:'王珊', dur:'2h 05m', upd:'09:56' },
  { title:'优惠券叠加规则文档',     step:'req',      status:'running',  creator:'王珊', dur:'36m',    upd:'10:45' },
  { title:'订单详情页改版高保真',   step:'ui',       status:'paused',   creator:'赵可', dur:'1h 10m', upd:'08:30' },
  { title:'商品卡片暗色模式适配',   step:'ui',       status:'done',     creator:'赵可', dur:'55m',    upd:'07:58' },
  { title:'购物车响应式重构',       step:'frontend', status:'failed',   creator:'林一', dur:'2h 41m', upd:'09:12' },
  { title:'支付回调幂等处理',       step:'backend',  status:'done',     creator:'陈默', dur:'1h 02m', upd:'06:47' },
  { title:'库存扣减并发压测',       step:'test',     status:'running',  creator:'周航', dur:'1h 55m', upd:'10:51' },
  { title:'订单模块回归用例',       step:'test',     status:'ready',    creator:'周航', dur:'—',      upd:'昨天' },
  { title:'灰度发布策略配置',       step:'deploy',   status:'running',  creator:'郑好', dur:'23m',    upd:'10:55' },
  { title:'容器镜像瘦身',           step:'deploy',   status:'done',     creator:'郑好', dur:'1h 30m', upd:'昨天' },
  { title:'订单搜索联想',           step:'frontend', status:'ready',    creator:'林一', dur:'—',      upd:'昨天' },
  { title:'订单导出大文件流式返回', step:'backend',  status:'retrying', creator:'陈默', dur:'41m',    upd:'10:20' },
];
const badge = s => { const st = STATUS[s]; return `<span class="badge" style="color:${st.color};background:color-mix(in oklab, ${st.color}, transparent 88%)">${st.label}</span>`; };

/* ── 泳道视图 ── */
function renderLanes() {
  document.getElementById('view-lane').innerHTML = STEPS.map(st => {
    const ts = TASKS.filter(t => t.step === st.key);
    return `<div class="lane">
      <div class="lane-head"><span class="dot" style="background:${st.color}"></span>${st.label}<span class="count">(${ts.length})</span><button class="add">+ 添加</button></div>
      <div class="lane-body">${ts.map(t => `
        <div class="card" style="border-left-color:${STATUS[t.status].color}">
          <div class="title">${t.title}</div>
          <div class="meta">${badge(t.status)}<span>${t.creator}</span><span>${t.dur}</span></div>
        </div>`).join('') || '<div style="font-size:11px;color:var(--meta);text-align:center;padding:16px 0">暂无任务</div>'}
      </div>
    </div>`;
  }).join('');
}

/* ── 表格视图(按步骤分组,可折叠)── */
const collapsed = new Set();
function renderTable() {
  document.getElementById('view-table').innerHTML = STEPS.map(st => {
    const ts = TASKS.filter(t => t.step === st.key);
    const isCollapsed = collapsed.has(st.key);
    return `<div class="group">
      <div class="group-head" style="border-left-color:${st.color}">
        <span class="dot" style="background:${st.color}"></span>${st.label}<span class="count">${ts.length} 个任务</span>
        <button class="collapse" data-step="${st.key}">${isCollapsed ? '展开 ▾' : '折叠 ▴'}</button>
      </div>
      ${isCollapsed ? '' : ts.length ? `<table>
        <colgroup><col class="c-task"/><col class="c-status"/><col class="c-creator"/><col class="c-dur"/><col class="c-upd"/></colgroup>
        <thead><tr><th>任务</th><th>状态</th><th>创建人</th><th>耗时</th><th>更新时间</th></tr></thead>
        <tbody>${ts.map(t => `<tr>
          <td class="cell-task">${t.title}</td>
          <td>${badge(t.status)}</td>
          <td>${t.creator}</td>
          <td class="num">${t.dur}</td>
          <td class="num">${t.upd}</td>
        </tr>`).join('')}</tbody>
      </table>` : '<div class="empty-group">暂无任务</div>'}
    </div>`;
  }).join('');
  document.querySelectorAll('#view-table .collapse').forEach(btn =>
    btn.onclick = () => { collapsed.has(btn.dataset.step) ? collapsed.delete(btn.dataset.step) : collapsed.add(btn.dataset.step); renderTable(); });
}

/* ── 切换 + 持久化 ── */
function setMode(mode, persist = true) {
  document.getElementById('view-lane').style.display  = mode === 'lane'  ? '' : 'none';
  document.getElementById('view-table').style.display = mode === 'table' ? '' : 'none';
  document.getElementById('vt-lane').classList.toggle('active', mode === 'lane');
  document.getElementById('vt-table').classList.toggle('active', mode === 'table');
  if (persist) localStorage.setItem('board-view-b', mode);
}
document.getElementById('vt-lane').onclick  = () => setMode('lane');
document.getElementById('vt-table').onclick = () => setMode('table');
setMode(localStorage.getItem('board-view-b') || 'lane', false);
renderLanes(); renderTable();
</script>
</body>
</html>
