<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作流编排 — FlowCraft</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f6f6f7;
  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;
  --border: #e5e5e7;
  --border-soft: #eeeef0;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --success: #16a34a;
  --warn: #eab308;
  --danger: #dc2626;
  --status-ready: #3b82f6;
  --status-running: #16a34a;
  --status-paused: #eab308;
  --status-stopped: #dc2626;
  --font-display: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 980px;
  --elev-raised: 0 12px 32px rgba(0,0,0,0.08);
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);
  --motion-fast: 150ms;
  --ease: cubic-bezier(0.28, 0, 0.22, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--fg);
  background: var(--surface);
  line-height: 1.47;
  overflow: hidden;
  height: 100vh;
}

/* ── Sidebar (Codex/macOS style) ─── */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-nav {
  padding: 12px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-bottom: 1px solid var(--border-soft);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--motion-fast);
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
}
.nav-item:hover { background: var(--surface); }
.nav-item svg { flex-shrink: 0; color: var(--fg-2); }

.sidebar-section {
  padding: 14px 14px 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--meta);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-section .btn-icon {
  width: 20px;
  height: 20px;
  padding: 0;
  color: var(--meta);
}
.sidebar-section .btn-icon:hover {
  color: var(--accent);
  background: var(--surface);
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 8px;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.project-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all var(--motion-fast);
  font-size: 14px;
  color: var(--fg-2);
  margin-bottom: 2px;
  border: 1.5px solid transparent;
}
.project-item:hover { background: var(--surface); }
.project-item.active {
  background: var(--surface);
  color: var(--fg);
  border-color: #e8a87c;
  font-weight: 500;
}
.project-item svg { flex-shrink: 0; color: var(--meta); }
.project-item.active svg { color: var(--accent); }
.project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-empty {
  padding: 6px 12px 6px 42px;
  font-size: 13px;
  color: var(--meta);
  font-style: italic;
}

.conv-item {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--motion-fast);
  font-size: 13px;
  color: var(--fg-2);
  margin-bottom: 2px;
}
.conv-item:hover { background: var(--surface); }
.conv-item.active { background: var(--surface); color: var(--fg); font-weight: 500; }
.conv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-time { font-size: 12px; color: var(--meta); flex-shrink: 0; margin-left: 8px; }

.sidebar-footer {
  margin: 8px 12px 12px;
  padding: 8px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: pointer;
  color: var(--meta);
  font-size: 12px;
  transition: all var(--motion-fast);
  background: transparent;
  width: calc(100% - 24px);
  font-family: var(--font-body);
}
.sidebar-footer:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Main ─── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: 48px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
}
.topbar-brand svg { color: var(--accent); }
.topbar-sep { width: 1px; height: 18px; background: var(--border); }
.topbar-name { font-size: 13px; color: var(--fg-2); }
.topbar-spacer { flex: 1; }
.topbar-stage {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.topbar-stage-label {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-weight: 500;
}

.btn {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  cursor: pointer;
  border: none;
  transition: all var(--motion-fast) var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--fg-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface); color: var(--fg); }
.btn-icon {
  width: 28px; height: 28px; padding: 0;
  justify-content: center; border-radius: 50%;
  background: transparent; color: var(--muted); border: none; cursor: pointer;
}
.btn-icon:hover { background: var(--surface); color: var(--fg); }

/* ── Kanban ─── */
.kanban {
  flex: 1;
  display: flex;
  gap: 0;
  overflow-x: auto;
  padding: 16px 16px 16px 0;
}
.kanban::-webkit-scrollbar { height: 5px; }
.kanban::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.lane {
  min-width: 260px;
  max-width: 320px;
  flex: 1;
  background: var(--surface);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  margin-right: 12px;
  overflow: hidden;
}
.lane-header {
  padding: 12px 14px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.lane-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 8px;
}
.lane-count { font-size: 12px; font-weight: 400; color: var(--meta); }
.lane-actions { display: flex; gap: 2px; }

.lane-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 120px;
}
.lane-body::-webkit-scrollbar { width: 4px; }
.lane-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.lane-body.drag-over {
  background: color-mix(in oklab, var(--accent), transparent 94%);
  border-radius: var(--radius-sm);
}

/* ─── Cards ─── */
.card {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: grab;
  transition: box-shadow var(--motion-fast);
  border-left: 3px solid var(--status-ready);
}
.card:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.card.dragging { opacity: 0.4; }
.card[data-status="ready"] { border-left-color: var(--status-ready); }
.card[data-status="running"] { border-left-color: var(--status-running); }
.card[data-status="paused"] { border-left-color: var(--status-paused); }
.card[data-status="stopped"] { border-left-color: var(--status-stopped); }
.card-status {
  display: inline-block; font-size: 11px; font-weight: 500;
  padding: 1px 6px; border-radius: 4px; cursor: pointer;
  line-height: 1.6;
}
.card-status[data-s="ready"] { background: color-mix(in oklab, var(--status-ready), transparent 85%); color: var(--status-ready); }
.card-status[data-s="running"] { background: color-mix(in oklab, var(--status-running), transparent 85%); color: var(--status-running); }
.card-status[data-s="paused"] { background: color-mix(in oklab, var(--status-paused), transparent 85%); color: var(--status-paused); }
.card-status[data-s="stopped"] { background: color-mix(in oklab, var(--status-stopped), transparent 85%); color: var(--status-stopped); }

/* Stage color by left border */
.card[data-stage="req"] { border-left-color: var(--stage-req); }
.card[data-stage="ui"] { border-left-color: var(--stage-ui); }
.card[data-stage="dev"] { border-left-color: var(--stage-dev); }
.card[data-stage="test"] { border-left-color: var(--stage-test); }
.card[data-stage="done"] { border-left-color: var(--stage-done); }

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
  margin-bottom: 3px;
}
.card-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
  margin-bottom: 8px;
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-stage {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  font-weight: 500;
  background: var(--surface);
  color: var(--muted);
}
/* ponytail: stage colors applied inline from steps.json */

.card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--motion-fast); }
.card:hover .card-actions { opacity: 1; }

.add-card-btn {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 8px;
  text-align: center;
  cursor: pointer;
  color: var(--meta);
  font-size: 12px;
  transition: all var(--motion-fast);
  background: transparent;
  width: 100%;
  font-family: var(--font-body);
  margin-top: 4px;
}
.add-card-btn:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 96%); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg);
  border-radius: var(--radius-md);
  box-shadow: var(--elev-raised), 0 0 0 1px var(--border-soft);
  width: 440px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.modal-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 12px 18px; border-top: 1px solid var(--border-soft); display: flex; justify-content: flex-end; gap: 8px; }
.modal-body label { display: block; font-size: 12px; font-weight: 600; color: var(--fg-2); margin-bottom: 4px; margin-top: 10px; }
.modal-body label:first-child { margin-top: 0; }
.modal-body input, .modal-body select {
  width: 100%; height: 32px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body); color: var(--fg); outline: none;
}
.modal-body input:focus, .modal-body select:focus { border-color: var(--accent); }

/* ── Canvas Editor (Dify-style) ── */
.canvas-editor {
  position: fixed; inset: 0; z-index: 300;
  background: var(--surface);
  display: none;
  flex-direction: column;
}
.canvas-editor.open { display: flex; }
.canvas-toolbar {
  height: 48px; background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
.canvas-toolbar-title { font-weight: 600; font-size: 14px; flex: 1; }
.canvas-container {
  flex: 1; position: relative; overflow: hidden;
}
.canvas-board {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
}
.canvas-nodes {
  position: absolute; inset: 0;
}
.canvas-svg {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 1;
}
.canvas-svg path {
  stroke: var(--border);
  stroke-width: 2;
  fill: none;
  pointer-events: stroke;
  cursor: pointer;
}
.canvas-svg path:hover { stroke: var(--accent); }
.canvas-node {
  position: absolute;
  width: 220px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: move;
  user-select: none;
  z-index: 2;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.canvas-node:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.canvas-node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 75%); }
.canvas-node-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600;
}
.canvas-node-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.canvas-node-body {
  padding: 10px 12px;
  font-size: 12px; color: var(--muted);
}
.canvas-node-ports {
  padding: 8px 12px;
  border-top: 1px solid var(--border-soft);
  display: flex; flex-direction: column; gap: 4px;
}
.canvas-port {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--fg-2);
}
.canvas-port-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--border);
  cursor: crosshair;
}
.canvas-port-dot.output { margin-left: auto; }
.canvas-port-dot:hover { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.canvas-port-dot.connecting { background: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.canvas-node-config {
  padding: 8px 12px;
  border-top: 1px solid var(--border-soft);
  font-size: 11px; color: var(--meta);
}
.canvas-add-btn {
  position: absolute; bottom: 24px; right: 24px;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,113,227,0.3);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  transition: transform 0.15s;
}
.canvas-add-btn:hover { transform: scale(1.08); }
.canvas-node-panel {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 320px; background: var(--bg);
  border-left: 1px solid var(--border-soft);
  box-shadow: -4px 0 16px rgba(0,0,0,0.06);
  display: none; flex-direction: column;
  z-index: 20;
}
.canvas-node-panel.open { display: flex; }
.canvas-node-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
}
.canvas-node-panel-title { font-weight: 600; font-size: 14px; }
.canvas-node-panel-body {
  flex: 1; overflow-y: auto; padding: 14px 16px;
}
.canvas-node-panel-body label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--fg-2); margin-bottom: 4px; margin-top: 12px;
}
.canvas-node-panel-body label:first-child { margin-top: 0; }
.canvas-node-panel-body input,
.canvas-node-panel-body textarea,
.canvas-node-panel-body select {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body); color: var(--fg); outline: none;
  resize: vertical;
}
.canvas-node-panel-body input:focus,
.canvas-node-panel-body textarea:focus,
.canvas-node-panel-body select:focus { border-color: var(--accent); }
.canvas-node-panel-body textarea { min-height: 80px; }
.canvas-io-list { display: flex; flex-direction: column; gap: 6px; }
.canvas-io-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.canvas-io-item input { flex: 1; padding: 4px 6px; font-size: 12px; }
.canvas-io-remove {
  width: 18px; height: 18px;
  border: none; background: transparent;
  color: var(--danger); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.canvas-io-add {
  padding: 6px; border: 1px dashed var(--border);
  border-radius: var(--radius-sm); text-align: center;
  cursor: pointer; font-size: 11px; color: var(--meta);
  background: transparent;
}
.canvas-io-add:hover { border-color: var(--accent); color: var(--accent); }

/* ─── New Panel ─── */
.new-panel {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 360px; background: var(--bg);
  border-left: 1px solid var(--border-soft);
  box-shadow: -4px 0 16px rgba(0,0,0,0.12);
  display: flex; flex-direction: column;
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 0.3s ease;
}
.new-panel.open { transform: translateX(0); }
.new-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
}
.new-panel-title { font-weight: 600; font-size: 14px; }
.new-panel-body {
  flex: 1; padding: 16px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}
.new-panel-body label { font-size: 12px; font-weight: 500; color: var(--muted); }
.new-panel-body input,
.new-panel-body textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-body);
  background: var(--bg); color: var(--fg);
}
.new-panel-body input:focus,
.new-panel-body textarea:focus { border-color: var(--accent); outline: none; }
.new-panel-body textarea { flex: 1; min-height: 120px; resize: vertical; }
.new-panel-footer {
  padding: 12px 16px; border-top: 1px solid var(--border-soft);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .lane { min-width: 240px; }
}
</style>
</head>
<body>

<div class="app" style="display:flex;height:100vh;position:relative;overflow:hidden;">
  <!-- Sidebar (macOS/Codex style) -->
  <aside class="sidebar">
    <div class="sidebar-nav">
      <div class="nav-item" onclick="alert('搜索功能')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        搜索
      </div>
      <div class="nav-item" onclick="alert('插件功能')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        插件
      </div>
      <div class="nav-item" onclick="alert('自动化功能')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>

    <div class="sidebar-section">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="sidebar-list" id="projectList"></div>

    <div class="sidebar-section">对话</div>
    <div class="sidebar-list" id="convList" style="flex:none;max-height:40vh;"></div>

    <button class="sidebar-footer" onclick="newProject()">+ 新建项目</button>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="btn btn-ghost" onclick="window.location.href='canvas-editor.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        阶段编辑

      <button class="btn btn-primary" id="newBtn" onclick="openNewPanel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

      <label>标题</label>
      <input type="text" id="newTitle" placeholder="输入标题...">

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">

      <button class="btn-icon" onclick="closeEditModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="editBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="addEditRow()">+ 添加步骤</button>
      <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdits()">保存</button>
    </div>
  </div>
</div>

<!-- Canvas Editor (Dify-style) -->
<div class="canvas-editor" id="canvasEditor">
  <div class="canvas-toolbar">
    <button class="btn btn-ghost" onclick="closeCanvasEditor()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      返回
    </button>
    <span class="canvas-toolbar-title">阶段编辑器</span>
    <button class="btn btn-primary" onclick="saveCanvasEditor()">保存</button>
  </div>
  <div class="canvas-container">
    <div class="canvas-board">
      <svg class="canvas-svg" id="canvasSvg"></svg>
      <div class="canvas-nodes" id="canvasNodes"></div>
    </div>
    <button class="canvas-add-btn" onclick="addCanvasNode()" title="添加节点">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="canvas-node-panel" id="canvasNodePanel">
      <div class="canvas-node-panel-header">
        <span class="canvas-node-panel-title" id="canvasPanelTitle">节点配置</span>
        <button class="btn-icon" onclick="closeCanvasNodePanel()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="canvas-node-panel-body" id="canvasPanelBody"></div>
    </div>

<script>
// ─── Data ───
const projects = [
  { id: 'p1', name: '教育局数据上报', icon: 'folder', time: '今天' },
];
const conversations = [
  { id: 'c1', name: '@chrome file my expenses ...', time: '2 周' },
  { id: 'c2', name: '@chrome 打开百度', time: '2 周' },
  { id: 'c3', name: '打开百度', time: '2 周' },
  { id: 'c4', name: '?', time: '2 周' },
];

let stages = [];
let laneNames = [];

let cards = [
  { id: 1, title: '用户注册流程优化', desc: '优化注册流程，提升转化率', lane: 0, stage: 'req' },
  { id: 2, title: '支付模块重构', desc: '重构支付模块，支持多渠道', lane: 0, stage: 'ui' },
  { id: 3, title: '数据看板开发', desc: '开发实时数据看板', lane: 0, stage: 'frontend' },
  { id: 4, title: 'API 网关升级', desc: '升级 API 网关至 v2', lane: 0, stage: 'backend' },
  { id: 5, title: '性能压测', desc: '全链路性能压测与优化', lane: 0, stage: 'test' },
];
let nextId = 6;
let running = false, runTimer = null, runIndex = 0;
let activeProject = 'p1', activeConv = null;

// ── Sidebar ───
function renderSidebar() {
  const pl = document.getElementById('projectList');
  pl.innerHTML = projects.map(p => `
    <div class="project-item ${p.id === activeProject ? 'active' : ''}" onclick="selectProject('${p.id}')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="project-name">${p.name}</span>
    </div>
  `).join('');

  const cl = document.getElementById('convList');
  if (conversations.length === 0) {
    cl.innerHTML = '<div class="project-empty">暂无对话</div>';
  } else {
    cl.innerHTML = conversations.map(c => `
      <div class="conv-item ${c.id === activeConv ? 'active' : ''}" onclick="selectConv('${c.id}')">
        <span class="conv-name">${c.name}</span>
        <span class="conv-time">${c.time}</span>
      </div>
    `).join('');
  }
}

function selectProject(id) { activeProject = id; renderSidebar(); }
function selectConv(id) { activeConv = activeConv === id ? null : id; renderSidebar(); }
function newProject() {
  const name = prompt('项目名称：');
  if (name && name.trim()) {
    projects.unshift({ id: 'p' + Date.now(), name: name.trim(), icon: 'folder', time: '刚刚' });
    renderSidebar();
  }
}
function openDirectorySelector() {
  const path = prompt('输入目录路径：', '/Users/Projects/');
  if (path && path.trim()) {
    projects.unshift({ id: 'p' + Date.now(), name: path.trim().split('/').pop() || path.trim(), icon: 'folder', time: '刚刚', path: path.trim() });
    renderSidebar();
  }
}
function newConversation() {
  const name = prompt('对话名称：');
  if (name && name.trim()) {
    conversations.unshift({ id: 'c' + Date.now(), name: name.trim(), time: '刚刚' });
    renderSidebar();
  }
}

// ─── Kanban ───
function renderKanban() {
  const kb = document.getElementById('kanban');
  let h = '';
  for (let li = 0; li < laneNames.length; li++) {
    const laneCards = cards.filter(c => c.lane === li);
    h += `<div class="lane">`;
    h += `<div class="lane-header">`;
    h += `<div class="lane-title"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${stages[li]?.color || 'var(--muted)'};margin-right:6px;vertical-align:middle;"></span>${laneNames[li]} <span class="lane-count">(${laneCards.length})</span></div>`;
    h += `<div class="lane-actions">`;
    h += `<button class="btn-icon" title="添加" onclick="addCardToLane(${li})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`;
    h += `</div></div>`;
    h += `<div class="lane-body" data-lane="${li}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, ${li})">`;
    for (const c of laneCards) {
      const stage = stages.find(s => s.key === c.stage) || stages[0];
      h += `<div class="card" data-status="${c.status || 'ready'}" draggable="true" data-id="${c.id}" data-stage="${c.stage}" ondragstart="onDragStart(event, ${c.id})" ondragend="onDragEnd(event)">`;
      h += `<div class="card-title">${c.title} <span class="card-status" data-s="${c.status || 'ready'}" onclick="cycleCardStatus(event, ${c.id})">${statusLabel(c.status || 'ready')}</span></div>`;
      h += `<div class="card-desc">${c.desc}</div>`;
      h += `<div class="card-meta">`;
      h += `<span class="card-stage" style="background:color-mix(in oklab,${stage.color},transparent 90%);color:${stage.color}">${stage.label}</span>`;
      h += `<div class="card-actions">`;
      if (li < 2) h += `<button class="btn-icon" title="推进" onclick="advanceCard(${c.id})" style="opacity:1;color:var(--success)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`;
      if (li > 0) h += `<button class="btn-icon" title="回退" onclick="retreatCard(${c.id})" style="opacity:1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;
      h += `<button class="btn-icon" title="编辑" onclick="editCard(${c.id})" style="opacity:1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>`;
      h += `<button class="btn-icon" title="删除" onclick="deleteCard(${c.id})" style="opacity:1;color:var(--danger)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      h += `</div></div></div>`;
    }
    h += `<button class="add-card-btn" onclick="addCardToLane(${li})">+ 添加</button>`;
    h += `</div></div>`;
  }
  kb.innerHTML = h;
  updateStageLabel();
}

function updateStageLabel() {
  const running = cards.filter(c => c.lane === 1);
  const label = document.getElementById('stageLabel');
  if (running.length > 0) {
    const s = stages.find(st => st.key === running[0].stage);
    label.textContent = s ? s.label : '—';
    label.style.background = s ? `color-mix(in oklab, ${s.color}, transparent 85%)` : '';
    label.style.color = s ? s.color : '';
  } else {
    label.textContent = '—';
    label.style.background = '';
    label.style.color = '';
  }
}

// ─── Drag & Drop ───
let dragId = null;
function onDragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
function onDrop(e, lane) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragId !== null) { const c = cards.find(x => x.id === dragId); if (c) { c.lane = lane; renderKanban(); } }
  dragId = null;
}

// ─── Card Actions ───
function advanceCard(id) { const c = cards.find(x => x.id === id); if (c && c.lane < laneNames.length - 1) { c.lane++; renderKanban(); } }
function retreatCard(id) { const c = cards.find(x => x.id === id); if (c && c.lane > 0) { c.lane--; renderKanban(); } }
function addCardToLane(lane) {
  const title = prompt('标题：');
  if (title && title.trim()) {
    const desc = prompt('描述（可选）：') || '';
    const stageKey = stages[lane < stages.length ? lane : 0].key;
    cards.push({ id: nextId++, title: title.trim(), desc, lane, stage: stageKey });
    renderKanban();
  }
}
function editCard(id) {
  window.location.href = 'card-detail.html?id=' + id;
}
function deleteCard(id) { if (confirm('确定删除？')) { cards = cards.filter(c => c.id !== id); renderKanban(); } }

const cardStatuses = ['ready', 'running', 'paused', 'stopped'];
const statusLabels = { ready: '预备中', running: '开始', paused: '暂停', stopped: '停止' };
function statusLabel(s) { return statusLabels[s] || s; }
function cycleCardStatus(e, id) {
  e.stopPropagation();
  const c = cards.find(x => x.id === id);
  if (!c) return;
  const cur = c.status || 'ready';
  const next = cardStatuses[(cardStatuses.indexOf(cur) + 1) % cardStatuses.length];
  c.status = next;
  renderKanban();
}

// ─── Run / Stop ───
function toggleRun() { if (running) stopRun(); else startRun(); }
function startRun() {
  running = true;
  const btn = document.getElementById('runBtn');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 停止`;
  btn.style.background = 'var(--danger)';
  runIndex = 0;
  runNext();
}
function runNext() {
  if (!running) return;
  const pending = cards.filter(c => c.lane === 0);
  if (runIndex >= pending.length) { stopRun(); return; }
  const card = pending[runIndex];
  card.lane = 1;
  renderKanban();
  runTimer = setTimeout(() => {
    if (!running) return;
    card.lane = 2;
    renderKanban();
    runIndex++;
    runNext();
  }, 1200 + Math.random() * 1200);
}
function stopRun() {
  running = false;
  clearTimeout(runTimer);
  const btn = document.getElementById('runBtn');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 运行`;
  btn.style.background = '';
}

// ── Edit Modal ───
let editCards = [];
function openEditModal() { editCards = cards.map(c => ({ ...c })); renderEditBody(); document.getElementById('editModal').classList.add('open'); }
function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }
function renderEditBody() {
  const body = document.getElementById('editBody');
  let h = '';
  editCards.forEach((c, i) => {
    const stage = stages.find(s => s.key === c.stage) || stages[0];
    h += `<label>步骤 ${i + 1} · 阶段</label>`;
    h += `<select data-field="stage" data-index="${i}">${stages.map(s => `<option value="${s.key}" ${s.key === c.stage ? 'selected' : ''}>${s.label}</option>`).join('')}</select>`;
    h += `<label>标题</label>`;
    h += `<input type="text" value="${c.title}" data-field="title" data-index="${i}" placeholder="标题">`;
    h += `<label>描述</label>`;
    h += `<input type="text" value="${c.desc}" data-field="desc" data-index="${i}" placeholder="描述">`;
  });
  if (editCards.length === 0) h = '<p style="color:var(--meta);text-align:center;padding:16px 0;">暂无步骤</p>';
  body.innerHTML = h;
}
function addEditRow() { editCards.push({ id: nextId++, title: '', desc: '', lane: 0, stage: 'req' }); renderEditBody(); }
function saveEdits() {
  const inputs = document.querySelectorAll('#editBody input, #editBody select');
  inputs.forEach(el => {
    const idx = parseInt(el.dataset.index);
    const field = el.dataset.field;
    if (editCards[idx]) editCards[idx][field] = el.value;
  });
  cards = editCards.filter(c => c.title.trim()).map((c, i) => ({ ...c, lane: 0 }));
  closeEditModal();
  renderKanban();
}

// ── Canvas Editor (Dify-style) ──
let canvasNodes = [];
let canvasConnections = [];
let selectedCanvasNode = null;
let draggingCanvasNode = null;
let connectingFrom = null;
let nextCanvasNodeId = 1;

const nodeTypes = [
  { key: 'llm', label: 'LLM', icon: '🤖', color: '#0071e3' },
  { key: 'code', label: '代码', icon: '💻', color: '#7c3aed' },
  { key: 'knowledge', label: '知识库', icon: '📚', color: '#059669' },
  { key: 'condition', label: '条件', icon: '🔀', color: '#d97706' },
  { key: 'start', label: '开始', icon: '▶', color: '#16a34a' },
  { key: 'end', label: '结束', icon: '⏹', color: '#dc2626' },
];

function openCanvasEditor() {
  document.getElementById('canvasEditor').classList.add('open');
  if (canvasNodes.length === 0) {
    initDefaultCanvas();
  }
  renderCanvas();
}

function closeCanvasEditor() {
  document.getElementById('canvasEditor').classList.remove('open');
  closeCanvasNodePanel();
}

function initDefaultCanvas() {
  canvasNodes = [
    {
      id: nextCanvasNodeId++,
      type: 'start',
      x: 100, y: 200,
      title: '开始',
      prompt: '',
      inputs: [],
      outputs: [{ name: 'data', type: 'any' }],
    },
    {
      id: nextCanvasNodeId++,
      type: 'llm',
      x: 380, y: 200,
      title: 'LLM 处理',
      prompt: '你是一个智能助手，请帮助用户完成任务。',
      inputs: [{ name: 'input', type: 'string' }],
      outputs: [{ name: 'response', type: 'string' }],
    },
    {
      id: nextCanvasNodeId++,
      type: 'end',
      x: 660, y: 200,
      title: '结束',
      prompt: '',
      inputs: [{ name: 'result', type: 'any' }],
      outputs: [],
    },
  ];
  canvasConnections = [
    { from: canvasNodes[0].id, fromPort: 0, to: canvasNodes[1].id, toPort: 0 },
    { from: canvasNodes[1].id, fromPort: 0, to: canvasNodes[2].id, toPort: 0 },
  ];
}

function addCanvasNode() {
  const type = nodeTypes[0];
  canvasNodes.push({
    id: nextCanvasNodeId++,
    type: type.key,
    x: 100 + Math.random() * 200,
    y: 100 + Math.random() * 200,
    title: type.label,
    prompt: '',
    inputs: [{ name: 'input', type: 'any' }],
    outputs: [{ name: 'output', type: 'any' }],
  });
  renderCanvas();
}

function renderCanvas() {
  const container = document.getElementById('canvasNodes');
  let html = '';
  canvasNodes.forEach(node => {
    const type = nodeTypes.find(t => t.key === node.type) || nodeTypes[0];
    html += `<div class="canvas-node ${selectedCanvasNode === node.id ? 'selected' : ''}" data-id="${node.id}" style="left:${node.x}px;top:${node.y}px;" onmousedown="onCanvasNodeMouseDown(event, ${node.id})" ondblclick="openCanvasNodePanel(${node.id})">`;
    html += `<div class="canvas-node-header">`;
    html += `<div class="canvas-node-icon" style="background:${type.color}20;color:${type.color};">${type.icon}</div>`;
    html += `<span>${node.title}</span>`;
    html += `</div>`;
    if (node.prompt) {
      html += `<div class="canvas-node-body">${node.prompt.substring(0, 50)}${node.prompt.length > 50 ? '...' : ''}</div>`;
    }
    if (node.inputs.length > 0 || node.outputs.length > 0) {
      html += `<div class="canvas-node-ports">`;
      node.inputs.forEach((inp, i) => {
        html += `<div class="canvas-port"><div class="canvas-port-dot input" onmousedown="startConnect(event, ${node.id}, 'input', ${i})"></div>${inp.name}</div>`;
      });
      node.outputs.forEach((out, i) => {
        html += `<div class="canvas-port">${out.name}<div class="canvas-port-dot output" onmousedown="startConnect(event, ${node.id}, 'output', ${i})"></div></div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  container.innerHTML = html;
  renderCanvasConnections();
}

function renderCanvasConnections() {
  const svg = document.getElementById('canvasSvg');
  let html = '';
  canvasConnections.forEach((conn, idx) => {
    const fromNode = canvasNodes.find(n => n.id === conn.from);
    const toNode = canvasNodes.find(n => n.id === conn.to);
    if (!fromNode || !toNode) return;
    const fromEl = document.querySelector(`.canvas-node[data-id="${conn.from}"]`);
    const toEl = document.querySelector(`.canvas-node[data-id="${conn.to}"]`);
    if (!fromEl || !toEl) return;
    const fromPorts = fromEl.querySelectorAll('.canvas-port-dot.output');
    const toPorts = toEl.querySelectorAll('.canvas-port-dot.input');
    const fromPort = fromPorts[conn.fromPort] || fromPorts[0];
    const toPort = toPorts[conn.toPort] || toPorts[0];
    if (!fromPort || !toPort) return;
    const fromRect = fromPort.getBoundingClientRect();
    const toRect = toPort.getBoundingClientRect();
    const containerRect = svg.getBoundingClientRect();
    const x1 = fromRect.left + fromRect.width / 2 - containerRect.left;
    const y1 = fromRect.top + fromRect.height / 2 - containerRect.top;
    const x2 = toRect.left + toRect.width / 2 - containerRect.left;
    const y2 = toRect.top + toRect.height / 2 - containerRect.top;
    const dx = Math.abs(x2 - x1) * 0.5;
    const path = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    html += `<path d="${path}" ondblclick="deleteConnection(${idx})" />`;
  });
  svg.innerHTML = html;
}

function onCanvasNodeMouseDown(e, id) {
  if (e.target.classList.contains('canvas-port-dot')) return;
  e.stopPropagation();
  selectedCanvasNode = id;
  draggingCanvasNode = { id, startX: e.clientX, startY: e.clientY, origX: canvasNodes.find(n => n.id === id).x, origY: canvasNodes.find(n => n.id === id).y };
  document.addEventListener('mousemove', onCanvasNodeMouseMove);
  document.addEventListener('mouseup', onCanvasNodeMouseUp);
  renderCanvas();
}

function onCanvasNodeMouseMove(e) {
  if (!draggingCanvasNode) return;
  const node = canvasNodes.find(n => n.id === draggingCanvasNode.id);
  if (!node) return;
  node.x = draggingCanvasNode.origX + (e.clientX - draggingCanvasNode.startX);
  node.y = draggingCanvasNode.origY + (e.clientY - draggingCanvasNode.startY);
  renderCanvas();
}

function onCanvasNodeMouseUp() {
  draggingCanvasNode = null;
  document.removeEventListener('mousemove', onCanvasNodeMouseMove);
  document.removeEventListener('mouseup', onCanvasNodeMouseUp);
}

function startConnect(e, nodeId, portType, portIndex) {
  e.stopPropagation();
  e.preventDefault();
  if (connectingFrom) {
    if (connectingFrom.nodeId !== nodeId && connectingFrom.portType !== portType) {
      const from = connectingFrom.portType === 'output' ? connectingFrom : { nodeId, portType, portIndex };
      const to = connectingFrom.portType === 'output' ? { nodeId, portType, portIndex } : connectingFrom;
      canvasConnections.push({ from: from.nodeId, fromPort: from.portIndex, to: to.nodeId, toPort: to.portIndex });
      renderCanvas();
    }
    connectingFrom = null;
    document.querySelectorAll('.canvas-port-dot').forEach(el => el.classList.remove('connecting'));
  } else {
    connectingFrom = { nodeId, portType, portIndex };
    e.target.classList.add('connecting');
  }
}

function deleteConnection(idx) {
  canvasConnections.splice(idx, 1);
  renderCanvas();
}

function openCanvasNodePanel(id) {
  selectedCanvasNode = id;
  const node = canvasNodes.find(n => n.id === id);
  if (!node) return;
  const type = nodeTypes.find(t => t.key === node.type) || nodeTypes[0];
  document.getElementById('canvasPanelTitle').textContent = node.title + ' - ' + type.label;
  const body = document.getElementById('canvasPanelBody');
  let html = '';
  html += `<label>标题</label>`;
  html += `<input type="text" value="${node.title}" onchange="updateCanvasNode(${id}, 'title', this.value)">`;
  html += `<label>类型</label>`;
  html += `<select onchange="updateCanvasNode(${id}, 'type', this.value)">${nodeTypes.map(t => `<option value="${t.key}" ${t.key === node.type ? 'selected' : ''}>${t.icon} ${t.label}</option>`).join('')}</select>`;
  html += `<label>提示词</label>`;
  html += `<textarea onchange="updateCanvasNode(${id}, 'prompt', this.value)" placeholder="输入提示词...">${node.prompt}</textarea>`;
  html += `<label>输入接口</label>`;
  html += `<div class="canvas-io-list">`;
  node.inputs.forEach((inp, i) => {
    html += `<div class="canvas-io-item"><input type="text" value="${inp.name}" placeholder="名称" onchange="updateCanvasNodeIO(${id}, 'inputs', ${i}, 'name', this.value)"><input type="text" value="${inp.type}" placeholder="类型" style="width:60px;" onchange="updateCanvasNodeIO(${id}, 'inputs', ${i}, 'type', this.value)"><button class="canvas-io-remove" onclick="removeCanvasNodeIO(${id}, 'inputs', ${i})">×</button></div>`;
  });
  html += `</div>`;
  html += `<button class="canvas-io-add" onclick="addCanvasNodeIO(${id}, 'inputs')">+ 添加输入</button>`;
  html += `<label>输出接口</label>`;
  html += `<div class="canvas-io-list">`;
  node.outputs.forEach((out, i) => {
    html += `<div class="canvas-io-item"><input type="text" value="${out.name}" placeholder="名称" onchange="updateCanvasNodeIO(${id}, 'outputs', ${i}, 'name', this.value)"><input type="text" value="${out.type}" placeholder="类型" style="width:60px;" onchange="updateCanvasNodeIO(${id}, 'outputs', ${i}, 'type', this.value)"><button class="canvas-io-remove" onclick="removeCanvasNodeIO(${id}, 'outputs', ${i})">×</button></div>`;
  });
  html += `</div>`;
  html += `<button class="canvas-io-add" onclick="addCanvasNodeIO(${id}, 'outputs')">+ 添加输出</button>`;
  html += `<button class="btn btn-ghost" style="width:100%;margin-top:16px;color:var(--danger);" onclick="deleteCanvasNode(${id})">删除节点</button>`;
  body.innerHTML = html;
  document.getElementById('canvasNodePanel').classList.add('open');
  renderCanvas();
}

function closeCanvasNodePanel() {
  document.getElementById('canvasNodePanel').classList.remove('open');
  selectedCanvasNode = null;
  renderCanvas();
}

function updateCanvasNode(id, field, value) {
  const node = canvasNodes.find(n => n.id === id);
  if (node) {
    node[field] = value;
    renderCanvas();
    openCanvasNodePanel(id);
  }
}

function updateCanvasNodeIO(id, ioType, index, field, value) {
  const node = canvasNodes.find(n => n.id === id);
  if (node && node[ioType][index]) {
    node[ioType][index][field] = value;
    renderCanvas();
  }
}

function addCanvasNodeIO(id, ioType) {
  const node = canvasNodes.find(n => n.id === id);
  if (node) {
    node[ioType].push({ name: 'new_' + ioType, type: 'any' });
    openCanvasNodePanel(id);
  }
}

function removeCanvasNodeIO(id, ioType, index) {
  const node = canvasNodes.find(n => n.id === id);
  if (node) {
    node[ioType].splice(index, 1);
    openCanvasNodePanel(id);
  }
}

function deleteCanvasNode(id) {
  canvasNodes = canvasNodes.filter(n => n.id !== id);
  canvasConnections = canvasConnections.filter(c => c.from !== id && c.to !== id);
  closeCanvasNodePanel();
  renderCanvas();
}

function saveCanvasEditor() {
  closeCanvasEditor();
}

// ─── New Panel ──
function openNewPanel() {
  document.getElementById('newPanel').classList.add('open');
}
function closeNewPanel() {
  document.getElementById('newPanel').classList.remove('open');
}
function submitNew() {
  const title = document.getElementById('newTitle').value.trim();
  const content = document.getElementById('newContent').value.trim();
  if (!title) { alert('请输入标题'); return; }
  cards.push({ id: nextId++, title, desc: content, lane: 0, stage: stages[0].key });
  document.getElementById('newTitle').value = '';
  document.getElementById('newContent').value = '';
  closeNewPanel();
  renderKanban();
}

// ─── Init ──
renderSidebar();
fetch('steps.json').then(r => r.json()).then(data => {
  stages = data.steps;
  laneNames = stages.map(s => s.label);
  renderKanban();
});
</script>
</body>
