<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkStep · 机器人状态表情</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; --page: #f5f5f7; --surface: #ffffff; --stage: #fbfbfd; --ink: #1d1d1f; --muted: #6e6e73; --line: #e8e8ed; --purple: #7c3aed; background: var(--page); color: var(--ink); }
body[data-theme="dark"] { color-scheme: dark; --page: #16151a; --surface: #211f27; --stage: #292630; --ink: #f0edf5; --muted: #a09aaa; --line: #37333f; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid #0071e3; outline-offset: 3px; }
button[hidden] { display: none; }
main { max-width: 1160px; margin: auto; padding: 36px 28px; }
.eyebrow { color: var(--muted); font-size: 11px; letter-spacing: 2px; font-weight: 600; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 13px 0 24px; }
h1 { font-size: clamp(30px,4vw,44px); letter-spacing: -1px; margin: 0; font-weight: 650; }
.intro { font-size: 12px; line-height: 1.8; color: var(--muted); margin: 10px 0 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.control { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 14px; font-size: 12px; }
.control.primary { background: var(--purple); border-color: var(--purple); color: white; }
.preview { display: grid; grid-template-columns: 220px 1fr; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; overflow: hidden; }
.large { display: flex; align-items: center; justify-content: center; min-height: 220px; position: relative; background: var(--stage); border-right: 1px solid var(--line); }
.large .avatar { width: 96px; height: 96px; }
.scale { position: absolute; bottom: 18px; color: var(--muted); font-size: 11px; }
.scene { padding: 24px 28px; min-width: 0; }
.scene-heading { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 23px; }
.scene-heading span:last-child { margin-left: auto; }
.chat { display: flex; gap: 12px; align-items: flex-start; }
.message { min-width: 0; flex: 1; }
.meta { display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12px; }
.spinner { width: 10px; height: 10px; border: 1.5px solid var(--line); border-top-color: var(--purple); border-radius: 50%; flex-shrink: 0; }
[data-active="true"] .spinner { animation: spin 1s linear infinite; }
[data-active="false"] .spinner { width: 6px; height: 6px; border: 0; background: #86868b; }
[data-state="waiting"] .spinner { background: #b45309; }
[data-state="done"] .spinner { background: #16a34a; }
[data-state="failed"] .spinner { background: #dc2626; }
#reply { font-size: 15px; line-height: 1.65; margin: 7px 0 10px; }
#activity { font-size: 11px; color: var(--muted); line-height: 1.6; }
#continue { margin-top: 12px; }
.timeline { display: flex; gap: 6px; flex-wrap: wrap; margin: 24px 0 0 44px; }
.step { font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--line); padding: 0 6px 8px; }
.step.current { color: var(--purple); border-color: var(--purple); }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 26px 0 13px; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.section-heading p { font-size: 11px; color: var(--muted); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.state-card { position: relative; text-align: left; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 16px; transition: border-color .18s, background-color .18s; }
.state-card:hover { background: var(--stage); }
.state-card[aria-pressed="true"] { border-color: var(--purple); box-shadow: inset 0 0 0 1px var(--purple); }
.state-card .avatar { width: 52px; height: 52px; }
.state-copy { flex: 1; min-width: 0; }
.state-name { display: block; font-size: 15px; font-weight: 600; margin-bottom: 7px; }
.state-desc { display: block; font-size: 11px; color: var(--muted); line-height: 1.65; }
.avatar { width: 32px; height: 32px; flex-shrink: 0; display: block; overflow: visible; color: white; }
.robot-head, .gaze, .eye, .antenna, .mouth { transform-box: fill-box; transform-origin: center; }
.robot-head { transform-origin: 50% 65%; }
.eye, .mouth, .antenna { transition: opacity .2s; }
/* The live preview interpolates geometry and motion together on one timeline. */
#preview .robot-head, #preview .gaze, #preview .eye,
#preview .mouth, #preview .antenna { animation: none; transition: none; transform: none; }
[data-active="true"] .antenna { animation: signal 2.4s ease-in-out infinite; }
[data-state="connecting"] .robot-head { animation: wake 3.6s ease-in-out infinite; }
[data-state="connecting"] .eye { animation: blink 3.6s ease-in-out infinite; }
[data-state="thinking"] .robot-head { animation: think 5.5s ease-in-out infinite; }
[data-state="thinking"] .gaze { animation: glance-up 5.5s ease-in-out infinite; }
[data-state="thinking"] .eye { animation: blink 5.5s ease-in-out infinite; }
[data-state="searching"] .gaze { animation: scan 3.8s ease-in-out infinite; }
[data-state="searching"] .robot-head { animation: track 3.8s ease-in-out infinite; }
[data-state="working"] .robot-head { animation: focus 2.8s ease-in-out infinite; }
[data-state="working"] .eye { animation: blink 4.6s ease-in-out infinite; }
[data-state="working"] .mouth { animation: signal 1.4s ease-in-out infinite; }
[data-state="writing"] .mouth { animation: talk .85s ease-in-out infinite; }
[data-state="writing"] .eye { animation: blink 4.2s ease-in-out infinite; }
[data-state="writing"] .robot-head { animation: nod 3.6s ease-in-out infinite; }
[data-state="waiting"] .robot-head { transform: rotate(-8deg); }
[data-state="failed"] .robot-head { transform: rotate(5deg) translateY(.5px); }
[data-state="stopped"] .robot-head { transform: translateY(1px); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes signal { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes blink { 0%,44%,51%,100% { transform: scaleY(1); } 47% { transform: scaleY(.12); } }
@keyframes wake { 0%,100% { transform: translateY(.5px); } 45%,65% { transform: translateY(-.7px); } }
@keyframes think { 0%,12%,100% { transform: rotate(0); } 30%,60% { transform: rotate(-9deg); } 76%,88% { transform: rotate(4deg); } }
@keyframes glance-up { 0%,12%,100% { transform: translate(0,0); } 30%,60% { transform: translate(-.8px,-1px); } 76%,88% { transform: translate(.6px,0); } }
@keyframes scan { 0%,100% { transform: translateX(0); } 20%,38% { transform: translateX(-1.6px); } 62%,80% { transform: translateX(1.6px); } }
@keyframes track { 0%,100% { transform: rotate(0); } 20%,38% { transform: rotate(-4deg); } 62%,80% { transform: rotate(4deg); } }
@keyframes focus { 0%,100% { transform: translateY(.4px); } 50% { transform: translateY(-.4px); } }
@keyframes talk { 0%,100% { transform: scale(1,.4); } 40% { transform: scale(.75,1.2); } 75% { transform: scale(1.15,.7); } }
@keyframes nod { 0%,30%,100% { transform: rotate(0); } 42%,56% { transform: rotate(5deg) translateY(.5px); } 70% { transform: rotate(-3deg); } }
body[data-paused="true"] * { animation-play-state: paused !important; }
footer { margin-top: 20px; font-size: 11px; line-height: 1.8; color: var(--muted); display: flex; gap: 16px; justify-content: space-between; }
.reduced-note { display: none; }
@media(prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } .reduced-note { display: inline; } }
@media(max-width: 900px) { .top { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .preview { grid-template-columns: 160px 1fr; } .scene { padding: 20px; } }
@media(max-width: 580px) { main { padding: 24px 14px; } .preview { grid-template-columns: 1fr; } .large { min-height: 160px; border-right: 0; border-bottom: 1px solid var(--line); } .large .avatar { width: 80px; height: 80px; } .scale { bottom: 10px; } .grid { grid-template-columns: 1fr; } .section-heading, footer { flex-direction: column; gap: 8px; } .timeline { margin-left: 0; } .scene-heading { flex-wrap: wrap; } }
</style>
</head>
<body data-theme="light" data-paused="false">
<main>
  <div class="eyebrow">WORKSTEP / ROBOT EXPRESSIONS · 03</div>
  <div class="top">
    <div><h1>它的表情，跟着进度走。</h1><p class="intro">同一张脸，平滑变换表情。点击不同状态，或播放一轮完整过程。</p></div>
    <div class="tools">
      <button type="button" class="control primary" id="demo">播放完整过程</button>
      <button type="button" class="control" id="pause" aria-pressed="false">暂停动效</button>
      <button type="button" class="control" id="theme" aria-pressed="false">深色预览</button>
    </div>
  </div>
  <section class="preview" id="preview" data-state="thinking" data-active="true" aria-label="当前消息状态预览">
    <div class="large"><div id="large-avatar"></div><span class="scale">放大表情</span></div>
    <div class="scene">
      <div class="scene-heading"><span>对话中的效果 · 32px</span><span id="demo-status">点击下方表情切换</span></div>
      <div class="chat"><div id="small-avatar"></div><div class="message" aria-live="polite">
        <div class="meta"><span class="spinner" aria-hidden="true"></span><strong id="status"></strong></div>
        <p id="reply"></p><div id="activity"></div>
        <button type="button" class="control primary" id="continue" hidden>确认，继续演示</button>
      </div></div>
      <div class="timeline" id="timeline" aria-label="演示步骤"></div>
    </div>
  </section>
  <div class="section-heading"><h2>同一个机器人，九种状态</h2><p>280ms 平滑过渡 · 连续点击可看中途切换效果。</p></div>
  <div class="grid" id="states"></div>
  <footer><span>运行中轻动；等待、完成、失败和停止时静止。<span class="reduced-note">系统已开启减少动态效果。</span></span><span>模拟消息状态 · 独立原型，尚未接入真实事件</span></footer>
</main>
<script>
const states = {
  connecting: { name: '准备响应', desc: '睡眼睁开，天线亮起', active: true, reply: '收到，我来看看。', activity: '已发送请求，等待引擎开始响应。' },
  thinking: { name: '认真思考', desc: '抬眼、歪头，偶尔眨眼', active: true, reply: '我先理一下思路，找出最合适的处理方式。', activity: '正在分析需求与已有上下文。' },
  searching: { name: '查找资料', desc: '眼神左右扫视，脑袋轻转', active: true, reply: '我正在查找相关资料。', activity: '演示：读取文件、搜索内容等可识别的工具活动。' },
  working: { name: '专注执行', desc: '眉眼收紧，专注运行命令', active: true, reply: '开始执行，正在处理这一步。', activity: '演示：正在运行命令、脚本或测试，等待执行结果。' },
  writing: { name: '组织回复', desc: '眼神放松，小嘴轻轻开合', active: true, reply: '有结果了，我把关键点整理给你。', activity: '正在生成可见的回复内容。' },
  waiting: { name: '等你确认', desc: '一高一低的眉眼，疑惑歪头', active: false, reply: '这一步需要你的确认。要继续执行吗？', activity: '暂停在审批或提问处，等待你的选择。' },
  done: { name: '完成啦', desc: '弯弯笑眼，开心的小嘴', active: false, reply: '处理好了，结果已经整理完成。', activity: '本条消息已结束。' },
  failed: { name: '遇到问题', desc: '八字眉、担心的嘴角', active: false, reply: '这一步遇到了问题，需要检查后重试。', activity: '本条消息执行失败；具体原因仍以错误提示为准。' },
  stopped: { name: '已停止', desc: '闭眼休息，天线暗下', active: false, reply: '已停止，当前内容为中断前的结果。', activity: '用户停止或执行取消，头像不再表示忙碌。' },
};
// Every feature uses the same quadratic-curve topology, so it can morph
// continuously instead of cross-fading or replacing the SVG nodes.
const neutralBrowL = [10.5,13,12,13,13.5,13];
const neutralBrowR = [18.5,13,20,13,21.5,13];
function face(leftEye, rightEye, mouth, angle = 0, y = 0, brows = null, antenna = 1) {
  return { leftEye, rightEye, mouth,
    leftBrow: brows ? brows[0] : neutralBrowL,
    rightBrow: brows ? brows[1] : neutralBrowR,
    pose: [angle,y,0,0,antenna,brows ? 1 : 0] };
}
const faces = {
  connecting: face([11,15,12.5,15,14,15], [18,15,19.5,15,21,15], [14,21,16,21,18,21]),
  thinking: face([12,14,12,15.5,12,17], [20,14,20,15.5,20,17], [15,21,16.5,21,18,21], -5),
  searching: face([12,14,12,15.5,12,17], [20,14,20,15.5,20,17], [15,21,16,21,17,21]),
  working: face([12,16,12,16.5,12,17], [20,16,20,16.5,20,17], [13.5,21,16,21,18.5,21], 0,.3,
    [[10.5,13.5,12,14,13.5,14.5],[18.5,14.5,20,14,21.5,13.5]]),
  writing: face([11,16,12,14,13,16], [19,16,20,14,21,16], [14,20,16,23,18,20]),
  waiting: face([12,13,12,15,12,17], [19,16,20,16,21,16], [15,21,16,20,17,21], -8),
  done: face([10.5,16,12,13,13.5,16], [18.5,16,20,13,21.5,16], [13.5,20,16,24,18.5,20]),
  failed: face([12,16,12,16.5,12,17], [20,16,20,16.5,20,17], [14,22,16,19,18,22], 5,.5,
    [[10.5,14,12,13.5,13.5,13],[18.5,13,20,13.5,21.5,14]]),
  stopped: face([10.5,16,12,16,13.5,16], [18.5,16,20,16,21.5,16], [14.5,21,16,21,17.5,21], 0,1,null,.35),
};
function curve(points) {
  const n = points.map(value => Number(value.toFixed(3)));
  return `M${n[0]} ${n[1]}Q${n[2]} ${n[3]} ${n[4]} ${n[5]}`;
}
function avatar(state) {
  const shape = faces[state];
  return `<svg class="avatar" viewBox="0 0 32 32" aria-hidden="true" fill="none">
    <circle cx="16" cy="16" r="15" fill="var(--purple)"/>
    <g class="pose"><g class="robot-head" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 10V7"/><circle class="antenna" cx="16" cy="6" r="1.4" fill="currentColor" stroke="none" opacity="${shape.pose[4]}"/>
      <rect x="7.5" y="10.5" width="17" height="14" rx="3.3"/>
      <path d="M5.5 15v4 M26.5 15v4"/>
      <g class="gaze-pose"><g class="gaze">
        <g class="brows" opacity="${shape.pose[5]}"><path class="brow-left" d="${curve(shape.leftBrow)}"/><path class="brow-right" d="${curve(shape.rightBrow)}"/></g>
        <path class="eye eye-left" d="${curve(shape.leftEye)}"/><path class="eye eye-right" d="${curve(shape.rightEye)}"/><path class="mouth" d="${curve(shape.mouth)}"/>
      </g></g>
    </g></g>
  </svg>`;
}
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
const featureSelectors = { leftEye: '.eye-left', rightEye: '.eye-right', mouth: '.mouth', leftBrow: '.brow-left', rightBrow: '.brow-right' };
const liveAvatars = ['#large-avatar', '#small-avatar'].map(selector => {
  const host = document.querySelector(selector);
  host.innerHTML = avatar('thinking');
  return { paths: Object.fromEntries(Object.entries(featureSelectors).map(([key,css]) => [key,host.querySelector(css)])),
    pose: host.querySelector('.pose'), gaze: host.querySelector('.gaze-pose'),
    brows: host.querySelector('.brows'), antenna: host.querySelector('.antenna') };
});
let displayedFace = faces.thinking;
let transitionFrom = displayedFace;
let faceState = 'thinking';
let transitionElapsed = 280;
let motionElapsed = 0;
let frame = null;
let lastFrameTime = 0;
function draw(shape) {
  displayedFace = shape;
  for (const avatar of liveAvatars) {
    for (const [key,path] of Object.entries(avatar.paths)) path.setAttribute('d', curve(shape[key]));
    const [angle,y,xg,yg,antenna,brows] = shape.pose;
    avatar.pose.setAttribute('transform', `translate(0 ${y}) rotate(${angle} 16 19)`);
    avatar.gaze.setAttribute('transform', `translate(${xg} ${yg})`);
    avatar.antenna.setAttribute('opacity', antenna);
    avatar.brows.setAttribute('opacity', brows);
  }
}
function sampleFace(state, elapsed) {
  const shape = Object.fromEntries(Object.entries(faces[state]).map(([key,values]) => [key,[...values]]));
  if (!states[state].active) return shape;
  const t = elapsed / 1000;
  const wave = Math.sin(t * Math.PI * 2 / 4);
  shape.pose[4] = .72 + .28 * Math.cos(t * Math.PI * 2 / 2.4);
  if (state === 'thinking') { shape.pose[0] += wave * 4; shape.pose[3] = -(.5 + .5 * wave); }
  if (state === 'searching') { shape.pose[2] = wave * 1.6; shape.pose[0] = wave * 4; }
  if (state === 'connecting') shape.pose[1] = -.6 * wave;
  if (state === 'working') shape.pose[1] += .25 * wave;
  if (state === 'writing') { shape.pose[0] = wave * 2; shape.mouth[3] = 21.4 + 1.6 * Math.cos(t * Math.PI * 2 / .85); }
  // One brief blink every 4.6s; the transition also blends its current phase.
  const blinkTime = elapsed % 4600;
  const openness = blinkTime > 3000 && blinkTime < 3240 ? 1 - .9 * Math.sin((blinkTime - 3000) / 240 * Math.PI) : 1;
  for (const eye of [shape.leftEye,shape.rightEye]) {
    const center = (eye[1] + eye[5]) / 2;
    for (const i of [1,3,5]) eye[i] = center + (eye[i] - center) * openness;
  }
  return shape;
}
function cancelFrame() { if (frame !== null) cancelAnimationFrame(frame); frame = null; }
function scheduleFrame() {
  if (frame !== null || motionPreference.matches || document.hidden || document.body.dataset.paused === 'true') return;
  lastFrameTime = performance.now();
  frame = requestAnimationFrame(animateFace);
}
function animateFace(now) {
  frame = null;
  const delta = Math.max(0, now - lastFrameTime);
  lastFrameTime = now;
  motionElapsed += delta;
  transitionElapsed = Math.min(280, transitionElapsed + delta);
  const target = sampleFace(faceState, motionElapsed);
  const progress = transitionElapsed / 280;
  const eased = progress * progress * (3 - 2 * progress);
  draw(Object.fromEntries(Object.entries(target).map(([key,values]) => [key,values.map((value,i) => transitionFrom[key][i] + (value - transitionFrom[key][i]) * eased)])));
  if (transitionElapsed < 280 || states[faceState].active) frame = requestAnimationFrame(animateFace);
}
function changeFace(state) {
  cancelFrame();
  transitionFrom = displayedFace;
  faceState = state;
  motionElapsed = 0;
  transitionElapsed = 0;
  if (motionPreference.matches) { transitionElapsed = 280; draw(faces[state]); }
  else scheduleFrame();
}
function syncMotion() {
  cancelFrame();
  if (motionPreference.matches) { transitionElapsed = 280; draw(faces[faceState]); }
  else if (transitionElapsed < 280 || states[faceState].active) scheduleFrame();
}
motionPreference.addEventListener('change', syncMotion);
document.addEventListener('visibilitychange', syncMotion);
draw(displayedFace);
const sequence = ['connecting','thinking','searching','working','waiting','writing','done'];
let timer = null;
let step = 0;
const preview = document.querySelector('#preview');
const demoButton = document.querySelector('#demo');
const continueButton = document.querySelector('#continue');
const demoStatus = document.querySelector('#demo-status');
document.querySelector('#states').innerHTML = Object.entries(states).map(([key,value]) => `<button type="button" class="state-card" data-select="${key}" data-state="${key}" data-active="${value.active}" aria-pressed="false">${avatar(key)}<span class="state-copy"><span class="state-name">${value.name}</span><span class="state-desc">${value.desc}</span></span></button>`).join('');
document.querySelector('#timeline').innerHTML = sequence.map(key => `<span class="step" data-step="${key}">${states[key].name}</span>`).join('');
function stopTimer() { if (timer !== null) clearInterval(timer); timer = null; }
function show(state) {
  const value = states[state];
  preview.dataset.state = state;
  preview.dataset.active = String(value.active);
  changeFace(state);
  document.querySelector('#status').textContent = value.name;
  document.querySelector('#reply').textContent = value.reply;
  document.querySelector('#activity').textContent = value.activity;
  continueButton.hidden = true;
  document.querySelectorAll('[data-select]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.select === state)));
  document.querySelectorAll('[data-step]').forEach(item => item.classList.toggle('current', item.dataset.step === state));
}
function play() {
  stopTimer();
  timer = setInterval(() => {
    if (document.body.dataset.paused === 'true' || document.hidden) return;
    step += 1;
    const state = sequence[step];
    show(state);
    if (state === 'waiting') {
      stopTimer();
      continueButton.hidden = false;
      demoStatus.textContent = '演示暂停 · 等待确认';
    } else if (state === 'done') {
      stopTimer();
      demoStatus.textContent = '演示完成';
      demoButton.textContent = '重新播放过程';
    }
  }, 3200);
}
document.querySelectorAll('[data-select]').forEach(button => button.addEventListener('click', () => {
  stopTimer(); show(button.dataset.select); demoStatus.textContent = '手动预览'; demoButton.textContent = '播放完整过程';
}));
demoButton.addEventListener('click', () => {
  step = 0;
  document.body.dataset.paused = 'false';
  document.querySelector('#pause').textContent = '暂停动效';
  document.querySelector('#pause').setAttribute('aria-pressed', 'false');
  show(sequence[0]); demoStatus.textContent = '正在演示 · 每步约 3 秒'; demoButton.textContent = '重新播放过程'; play();
});
continueButton.addEventListener('click', () => {
  step = sequence.indexOf('writing'); show('writing'); demoStatus.textContent = '正在演示 · 每步约 3 秒'; play();
});
document.querySelector('#pause').addEventListener('click', event => {
  const paused = document.body.dataset.paused !== 'true';
  document.body.dataset.paused = String(paused);
  event.currentTarget.textContent = paused ? '继续动效' : '暂停动效';
  event.currentTarget.setAttribute('aria-pressed', String(paused));
  syncMotion();
});
document.querySelector('#theme').addEventListener('click', event => {
  const dark = document.body.dataset.theme !== 'dark';
  document.body.dataset.theme = dark ? 'dark' : 'light';
  event.currentTarget.textContent = dark ? '浅色预览' : '深色预览';
  event.currentTarget.setAttribute('aria-pressed', String(dark));
});
window.addEventListener('pagehide', () => { stopTimer(); cancelFrame(); });
window.addEventListener('pageshow', syncMotion);
show('thinking');
</script>
</body>
</html>
