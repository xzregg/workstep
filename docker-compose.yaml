services:
  workstep:
    build:
      context: .
      dockerfile: Dockerfile
    image: workstep:latest
    container_name: workstep
    ports:
      - "${WORKSTEP_PORT:-8755}:8765"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 应用内安装的 npm CLI 与 Python SDK，重建容器后保留（Linux 专用）
      - ./data/engines:/opt/workstep-engines
      # 全局配置 / 模板 / 任务元数据（容器独立目录，不与宿主机 ~/.workstep 冲突）
      - ./data/workstep:/root/.workstep
      # Codex rollout / 登录态：线程 id 存在项目库里，恢复时必须有对应 rollout
      - ./data/codex:/root/.codex
      # 项目数据目录：应用内创建项目时路径填 /data/projects/<名称>
      - ${WORKSTEP_PROJECTS_DIR:-./data/projects}:/data/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
