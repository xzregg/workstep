version: "3.7"

services:
  workstep:
    build:
      context: .
      dockerfile: Dockerfile
    image: workstep:latest
    container_name: workstep
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${WORKSTEP_PORT:-8755}:8765"
    environment:
      TZ: Asia/Shanghai
    cap_add:
      # Codex 容器内沙箱需要创建 namespace 并执行 pivot_root
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      # 旧数据迁移方式见 docs/container-runtime.md，迁移后再重建容器。
      # 整体持久化 Home：WorkStep 配置、基础运行时、引擎包、登录态与会话。
      - ./data/home:/root
      # 项目数据目录：应用内创建项目时路径填 /data/projects/<名称>
      - ${WORKSTEP_PROJECTS_DIR:-./data/projects}:/data/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

