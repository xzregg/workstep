<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkStep 工作流引擎执行全景</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper:#f5f5f5;
      --paper-2:#ececec;
      --ink:#2d3142;
      --muted:#4f5d75;
      --soft:#7a8399;
      --rule:rgba(45,49,66,.12);
      --accent:#eb6c36;
      --accent-tint:rgba(235,108,54,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(1480px,100%); margin:0 auto; padding:28px 24px 40px; }
    header { margin-bottom:28px; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font:500 11px/1.3 "Geist Mono",monospace; letter-spacing:.14em; }
    h1 { margin:0 0 8px; font:400 34px/1.14 "Instrument Serif","Noto Serif SC",serif; }
    header p { max-width:960px; margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
    figure { margin:0 0 28px; padding:20px; overflow-x:auto; background:#fff; border:1px solid var(--rule); border-radius:8px; }
    figure h2 { margin:0 0 4px; font-size:16px; font-weight:600; }
    figure > p { margin:0 0 16px; color:var(--muted); font-size:12px; }
    svg { display:block; min-width:1180px; width:100%; height:auto; }
    figcaption { margin-top:12px; color:var(--muted); font-size:12px; line-height:1.6; }
    footer { padding-top:16px; border-top:1px solid var(--rule); color:var(--soft); font:10px/1.6 "Geist Mono",monospace; }
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">WORKSTEP · WORKFLOW ENGINE</p>
    <h1>工作流引擎执行全景</h1>
    <p>三张图分别描述任务生命周期、单阶段执行与产物路由，以及用户和协调助手触发的局部重跑。流程定义、运行快照、任务状态投影和产物轮次始终保持独立。</p>
  </header>
