<!doctype html>

  <style>
    :root {
      --paper: #fbfbfc;
      --surface: #f5f5f7;
      --ink: #1d1d1f;
      --ink-2: #424245;
      --muted: #6e6e73;
      --meta: #86868b;
      --rule: #d2d2d7;
      --rule-soft: #eeeef0;
      --accent: #0071e3;
      --accent-light: #e6f0ff;
      --success: #16803c;
      --warn: #a16207;
      --danger: #c83333;
      --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(1600px, 100%); margin: 0 auto; padding: 28px 24px 36px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 600 11px/1 var(--mono); letter-spacing: .16em; }
    h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; font-weight: 650; }
    .subtitle { margin: 9px 0 22px; color: var(--muted); font-size: 14px; }
    .frame { overflow-x: auto; border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--paper); }
    svg { display: block; width: 100%; min-width: 1180px; height: auto; }
    .sans { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
  </style>
</head>

  <h1>任务阶段：提示词注入与审核流转</h1>
