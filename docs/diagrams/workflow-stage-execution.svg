<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="stage-execution-title stage-execution-desc">
      <title id="stage-execution-title">WorkStep 单阶段执行与产物路由</title>
      <desc id="stage-execution-desc">调度器选择就绪阶段，解析输入快照并组装提示词，驱动引擎和事件日志，随后经过审核和产物清单门控，按非空端口正向推进、返回返工或暂停。</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="exec-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="exec-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="exec-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        <style>
          .es{font-family:Geist,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.em{font-family:"Geist Mono",monospace}.en{font-size:13px;font-weight:600;fill:#2d3142}.eb{font-size:11px;fill:#4f5d75}.et{font-size:9px;fill:#7a8399}.ee{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#exec-arrow)}.ea{fill:none;stroke:#eb6c36;stroke-width:1.4;marker-end:url(#exec-accent)}.ed{fill:none;stroke:#eb6c36;stroke-width:1.3;stroke-dasharray:6 4;marker-end:url(#exec-accent)}.ebox{fill:#fff;stroke:#4f5d75;stroke-width:1}.efocal{fill:#fef3ee;stroke:#eb6c36;stroke-width:1.2}.esoft{fill:#fafafa;stroke:#7a8399;stroke-width:1;stroke-dasharray:5 4}
        </style>
      </defs>
      <rect width="1400" height="500" fill="#f5f5f5"/>

      <path d="M216 132H260" class="ee"/>
      <path d="M424 132H468" class="ee"/>
      <path d="M648 132H692" class="ea"/>
      <path d="M872 132H916" class="ee"/>
      <path d="M1080 132H1124" class="ee"/>
      <path d="M1212 184V246" class="ee"/>
      <path d="M1124 302H1012Q996 302 996 318V374" class="ee"/>
      <path d="M1212 358V374" class="ed"/>
      <path d="M1300 302H1332Q1348 302 1348 318V374" class="ee"/>
      <path d="M1124 414H672Q656 414 656 398V208Q656 192 640 192H556V180" class="ed"/>

      <rect x="52" y="84" width="164" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="52" y="84" width="164" height="96" rx="6" class="ebox"/>
      <text x="134" y="116" text-anchor="middle" class="en es">选择 ready 阶段</text>
      <text x="134" y="140" text-anchor="middle" class="et em">deps + active_edges</text>
      <text x="134" y="160" text-anchor="middle" class="eb es">并行启动无冲突节点</text>

      <rect x="260" y="84" width="164" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="84" width="164" height="96" rx="6" class="ebox"/>
      <text x="342" y="116" text-anchor="middle" class="en es">解析输入快照</text>
      <text x="342" y="140" text-anchor="middle" class="et em">port · source · round</text>
      <text x="342" y="160" text-anchor="middle" class="eb es">固定实际输入来源</text>

      <rect x="468" y="84" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="468" y="84" width="180" height="96" rx="6" class="ebox"/>
      <text x="558" y="116" text-anchor="middle" class="en es">组装阶段提示词</text>
      <text x="558" y="140" text-anchor="middle" class="et em">memory · task · supplement</text>
      <text x="558" y="160" text-anchor="middle" class="eb es">要求 + 输入 + 输出契约</text>

      <rect x="692" y="76" width="180" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="692" y="76" width="180" height="112" rx="6" class="efocal"/>
      <text x="782" y="112" text-anchor="middle" class="en es">引擎执行</text>
      <text x="782" y="136" text-anchor="middle" class="et em">AcpEngineBase.spawn</text>
      <text x="782" y="158" text-anchor="middle" class="eb es">session · tools · timeout</text>
      <text x="782" y="176" text-anchor="middle" class="eb es">支持实时消息与停止</text>

      <rect x="916" y="84" width="164" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="916" y="84" width="164" height="96" rx="6" class="ebox"/>
      <text x="998" y="116" text-anchor="middle" class="en es">事件持久化</text>
      <text x="998" y="140" text-anchor="middle" class="et em">JSONL → AG-UI</text>
      <text x="998" y="160" text-anchor="middle" class="eb es">实时流与历史同源</text>

      <rect x="1124" y="84" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="1124" y="84" width="176" height="96" rx="6" class="ebox"/>
      <text x="1212" y="116" text-anchor="middle" class="en es">审核门</text>
      <text x="1212" y="140" text-anchor="middle" class="et em">skip · auto · manual</text>
      <text x="1212" y="160" text-anchor="middle" class="eb es">通过 / 重试 / 等待</text>

      <polygon points="1212,246 1300,302 1212,358 1124,302" fill="#fef3ee" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="1212" y="294" text-anchor="middle" class="en es">扫描 manifest</text>
      <text x="1212" y="318" text-anchor="middle" class="et em">nonempty by fromPort</text>

      <rect x="920" y="374" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="374" width="184" height="72" rx="6" class="ebox"/>
      <text x="1012" y="404" text-anchor="middle" class="en es">正向推进</text>
      <text x="1012" y="428" text-anchor="middle" class="et em">solid active_edges</text>

      <rect x="1124" y="374" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1124" y="374" width="176" height="72" rx="6" class="efocal"/>
      <text x="1212" y="404" text-anchor="middle" class="en es">返回目标重跑</text>
      <text x="1212" y="428" text-anchor="middle" class="et em">feedback + counter</text>

      <rect x="1312" y="374" width="76" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1312" y="374" width="76" height="72" rx="6" class="esoft"/>
      <text x="1350" y="404" text-anchor="middle" class="en es">暂停</text>
      <text x="1350" y="428" text-anchor="middle" class="et em">冲突 / 上限</text>
    </svg>
