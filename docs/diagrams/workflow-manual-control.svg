<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="manual-control-title manual-control-desc">
      <title id="manual-control-title">WorkStep 步骤消息与局部重跑</title>
      <desc id="manual-control-desc">用户可以给运行中步骤发送实时消息，给已结束步骤发送消息后创建补充和子运行；协调助手读取全局任务和产物，生成需确认的重跑提案，确认后仅执行目标步骤及下游，孤立步骤只有被选中时执行。</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="manual-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="manual-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="manual-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        <style>
          .ms{font-family:Geist,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.mm{font-family:"Geist Mono",monospace}.mn{font-size:13px;font-weight:600;fill:#2d3142}.mb{font-size:11px;fill:#4f5d75}.mt{font-size:9px;fill:#7a8399}.me{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#manual-arrow)}.ma{fill:none;stroke:#eb6c36;stroke-width:1.4;marker-end:url(#manual-accent)}.md{fill:none;stroke:#4f5d75;stroke-width:1.1;stroke-dasharray:5 4;marker-end:url(#manual-arrow)}.mbox{fill:#fff;stroke:#4f5d75;stroke-width:1}.mfocal{fill:#fef3ee;stroke:#eb6c36;stroke-width:1.2}.msoft{fill:#fafafa;stroke:#7a8399;stroke-width:1;stroke-dasharray:5 4}
        </style>
      </defs>
      <rect width="1400" height="520" fill="#f5f5f5"/>
      <text x="40" y="42" class="mm" font-size="10" fill="#7a8399" letter-spacing="1.4">LIVE STAGE MESSAGE</text>
      <text x="40" y="252" class="mm" font-size="10" fill="#7a8399" letter-spacing="1.4">CONFIRMED RERUN</text>

      <path d="M220 120H312" class="me"/>
      <path d="M500 120H592" class="ma"/>
      <path d="M780 120H872" class="me"/>

      <rect x="40" y="80" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="80" width="180" height="80" rx="6" class="mbox"/>
      <text x="130" y="112" text-anchor="middle" class="mn ms">用户 @ 运行中步骤</text>
      <text x="130" y="138" text-anchor="middle" class="mt mm">step/message</text>

      <rect x="312" y="80" width="188" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="80" width="188" height="80" rx="6" class="mbox"/>
      <text x="406" y="112" text-anchor="middle" class="mn ms">注入当前 runner</text>
      <text x="406" y="138" text-anchor="middle" class="mt mm">send_live_message</text>

      <rect x="592" y="72" width="188" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="72" width="188" height="96" rx="6" class="mfocal"/>
      <text x="686" y="108" text-anchor="middle" class="mn ms">复用步骤会话</text>
      <text x="686" y="132" text-anchor="middle" class="mt mm">session_id unchanged</text>
      <text x="686" y="152" text-anchor="middle" class="mb ms">不创建 WorkflowRun</text>

      <rect x="872" y="80" width="188" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="80" width="188" height="80" rx="6" class="mbox"/>
      <text x="966" y="112" text-anchor="middle" class="mn ms">继续当前 attempt</text>
      <text x="966" y="138" text-anchor="middle" class="mt mm">execution channel</text>

      <path d="M220 334H300" class="me"/>
      <path d="M488 334H568" class="me"/>
      <path d="M756 334H836" class="ma"/>
      <path d="M1024 334H1104" class="ma"/>

      <rect x="40" y="286" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="286" width="180" height="96" rx="6" class="mbox"/>
      <text x="130" y="318" text-anchor="middle" class="mn ms">用户提出意图</text>
      <text x="130" y="342" text-anchor="middle" class="mt mm">聊天 / @ 已结束步骤</text>
      <text x="130" y="362" text-anchor="middle" class="mb ms">目标、输入、轮次</text>

      <rect x="300" y="278" width="188" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="278" width="188" height="112" rx="6" class="mbox"/>
      <text x="394" y="310" text-anchor="middle" class="mn ms">协调助手判断</text>
      <text x="394" y="334" text-anchor="middle" class="mt mm">task · steps · reviews</text>
      <text x="394" y="354" text-anchor="middle" class="mb ms">按需读取最新有效产物</text>
      <text x="394" y="374" text-anchor="middle" class="mb ms">整理步骤专属补充</text>

      <rect x="568" y="286" width="188" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="286" width="188" height="96" rx="6" class="msoft"/>
      <text x="662" y="318" text-anchor="middle" class="mn ms">持久化动作提案</text>
      <text x="662" y="342" text-anchor="middle" class="mt mm">rerun_from_stage</text>
      <text x="662" y="362" text-anchor="middle" class="mb ms">等待用户确认</text>

      <rect x="836" y="278" width="188" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="278" width="188" height="112" rx="6" class="mfocal"/>
      <text x="930" y="310" text-anchor="middle" class="mn ms">创建子运行</text>
      <text x="930" y="334" text-anchor="middle" class="mt mm">latest workflow definition</text>
      <text x="930" y="354" text-anchor="middle" class="mb ms">目标 + DAG 下游</text>
      <text x="930" y="374" text-anchor="middle" class="mb ms">范围外通过步骤 → reused</text>

      <rect x="1104" y="278" width="184" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="1104" y="278" width="184" height="104" rx="6" class="mfocal"/>
      <text x="1196" y="310" text-anchor="middle" class="mn ms">执行目标步骤</text>
      <text x="1196" y="334" text-anchor="middle" class="mt mm">StageSupplement + rounds</text>
      <text x="1196" y="354" text-anchor="middle" class="mb ms">再按实际产物推进下游</text>

      <rect x="1300" y="286" width="88" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="1300" y="286" width="88" height="96" rx="6" class="msoft"/>
      <text x="1344" y="318" text-anchor="middle" class="mn ms">孤立步骤</text>
      <text x="1344" y="342" text-anchor="middle" class="mt mm">no edges</text>
      <text x="1344" y="362" text-anchor="middle" class="mb ms">被选中才执行</text>
    </svg>
