<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>阶段输出端口与多输入启动条件</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#f5f5f5; color:#2d3142; font-family:Geist,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(1240px,100%); margin:0 auto; padding:28px 24px 40px; }
    .eyebrow { margin:0 0 8px; color:#eb6c36; font:500 11px/1.3 "Geist Mono",monospace; letter-spacing:.14em; }
    h1 { margin:0 0 8px; font:400 32px/1.15 "Instrument Serif","Noto Serif SC",serif; }
    p { margin:0 0 18px; color:#4f5d75; font-size:14px; line-height:1.7; }
    svg { display:block; width:100%; height:auto; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">WORKSTEP · PORT ROUTING</p>
  <h1>阶段输出端口与多输入启动条件</h1>
  <p>A 的两个输出独立激活不同下游；C 只等待 A2，B 必须同时等到 A1 和 D1。</p>
  <svg viewBox="0 0 1200 520" role="img" aria-labelledby="artifact-port-fanout-title artifact-port-fanout-desc">
    <title id="artifact-port-fanout-title">A 阶段输出 A1 和 A2 后驱动 B、C 阶段的端口依赖流程</title>
    <desc id="artifact-port-fanout-desc">A 阶段产生 A1 和 A2，A2 单独满足 C 阶段；A1 必须与 D 阶段产生的 D1 同时就绪，才能通过全部实线输入门启动 B 阶段。</desc>
    <defs>
      <marker id="artifact-port-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="artifact-port-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="artifact-port-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      <style>
        .sans{font-family:Geist,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:"Geist Mono",monospace}.name{font-size:16px;font-weight:600;fill:#2d3142}.sub{font-size:11px;fill:#4f5d75}.tiny{font-size:9px;fill:#7a8399}.edge{fill:none;stroke:#4f5d75;stroke-width:1.4;marker-end:url(#artifact-port-arrow)}.accent-edge{fill:none;stroke:#eb6c36;stroke-width:1.6;marker-end:url(#artifact-port-accent)}.stage{fill:#fff;stroke:#4f5d75;stroke-width:1}.focal{fill:#fef3ee;stroke:#eb6c36;stroke-width:1.3}.artifact{fill:#fafafa;stroke:#7a8399;stroke-width:1}.gate{fill:#fff7f2;stroke:#eb6c36;stroke-width:1.3}
      </style>
    </defs>
    <rect width="1200" height="520" fill="#f5f5f5"/>

    <text x="44" y="42" class="tiny mono" letter-spacing="1.2">PRODUCERS</text>
    <text x="332" y="42" class="tiny mono" letter-spacing="1.2">OUTPUT PORTS</text>
    <text x="620" y="42" class="tiny mono" letter-spacing="1.2">READINESS</text>
    <text x="902" y="42" class="tiny mono" letter-spacing="1.2">DOWNSTREAM</text>

    <path d="M244 168H304Q320 168 320 152V132H364" class="edge"/>
    <path d="M244 192H304Q320 192 320 208V244H364" class="accent-edge"/>
    <path d="M244 388H304Q320 388 320 372V356H364" class="edge"/>
    <path d="M500 132H724Q740 132 740 116V108H900" class="edge"/>
    <path d="M500 244H612Q628 244 628 260V284H660" class="accent-edge"/>
    <path d="M500 356H612Q628 356 628 340V316H660" class="edge"/>
    <path d="M756 300H900" class="accent-edge"/>

    <rect x="44" y="124" width="200" height="112" rx="8" fill="#f5f5f5"/>
    <rect x="44" y="124" width="200" height="112" rx="8" class="focal"/>
    <text x="144" y="164" text-anchor="middle" class="name sans">A 阶段</text>
    <text x="144" y="190" text-anchor="middle" class="sub sans">一次执行 · 两个输出端口</text>
    <text x="144" y="214" text-anchor="middle" class="tiny mono">A1 · A2 independently routed</text>

    <rect x="44" y="340" width="200" height="96" rx="8" fill="#f5f5f5"/>
    <rect x="44" y="340" width="200" height="96" rx="8" class="stage"/>
    <text x="144" y="378" text-anchor="middle" class="name sans">D 阶段</text>
    <text x="144" y="404" text-anchor="middle" class="sub sans">产生 B 的另一个必需输入</text>

    <rect x="364" y="96" width="136" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="364" y="96" width="136" height="72" rx="6" class="artifact"/>
    <text x="432" y="126" text-anchor="middle" class="name sans">产物 A2</text>
    <text x="432" y="148" text-anchor="middle" class="tiny mono">A.fromPort 1</text>

    <rect x="364" y="208" width="136" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="364" y="208" width="136" height="72" rx="6" class="focal"/>
    <text x="432" y="238" text-anchor="middle" class="name sans">产物 A1</text>
    <text x="432" y="260" text-anchor="middle" class="tiny mono">A.fromPort 0</text>

    <rect x="364" y="320" width="136" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="364" y="320" width="136" height="72" rx="6" class="artifact"/>
    <text x="432" y="350" text-anchor="middle" class="name sans">产物 D1</text>
    <text x="432" y="372" text-anchor="middle" class="tiny mono">D.fromPort 0</text>

    <polygon points="708,252 756,300 708,348 660,300" class="gate"/>
    <text x="708" y="295" text-anchor="middle" class="name sans">AND</text>
    <text x="708" y="316" text-anchor="middle" class="tiny mono">全部实线输入</text>

    <rect x="900" y="64" width="244" height="88" rx="8" fill="#f5f5f5"/>
    <rect x="900" y="64" width="244" height="88" rx="8" class="stage"/>
    <text x="1022" y="100" text-anchor="middle" class="name sans">C 阶段</text>
    <text x="1022" y="126" text-anchor="middle" class="sub sans">A2 非空即可启动</text>

    <rect x="900" y="252" width="244" height="96" rx="8" fill="#f5f5f5"/>
    <rect x="900" y="252" width="244" height="96" rx="8" class="focal"/>
    <text x="1022" y="290" text-anchor="middle" class="name sans">B 阶段</text>
    <text x="1022" y="316" text-anchor="middle" class="sub sans">A1 与 D1 都非空才启动</text>
    <text x="1022" y="336" text-anchor="middle" class="tiny mono">A1 ready AND D1 ready</text>

    <line x1="44" y1="468" x2="1156" y2="468" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
    <text x="44" y="494" class="tiny mono" letter-spacing="1.1">RULE</text>
    <text x="112" y="494" class="sub sans">每条实线连接独立激活；一个输出非空，不代表同一阶段的其它输出也存在。</text>
  </svg>
</main>
</body>
</html>
