<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>WorkStep · 沙箱设置交互原型</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7;font-size:15px;--blue:#0071e3;--line:#e8e8ed;--muted:#6e6e73;--green:#16a34a;--warning:#b45309}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d2d2d7;border-radius:10px;padding:9px 15px;background:white;color:inherit;min-height:36px}button:hover{background:#f5f5f7}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#0077ed}.quiet{border-color:transparent;background:transparent}.danger{color:#c22b25}h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:-.4px}h2{font-size:22px;letter-spacing:-.3px}h3{font-size:15px}p{line-height:1.65}.muted{color:var(--muted)}.small{font-size:12px}.topbar{height:60px;padding:0 24px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:650}.logo{width:28px;height:28px;display:grid;place-items:center;background:linear-gradient(140deg,#0071e3,#7c3aed);color:white;border-radius:8px}.chip{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:5px 10px;background:#f0f2f6;font-size:12px;white-space:nowrap}.chip.blue{background:#edf5ff;color:#0063c6}.chip.green{background:#edf8f0;color:var(--green)}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 60px)}.sidebar{padding:30px 16px;border-right:1px solid var(--line);background:#fafafb}.sidebar b{display:block;margin:0 12px 16px;font-size:12px;color:var(--muted)}.sidebar .item{padding:11px 12px;color:#6e6e73;margin:3px 0;border-radius:9px}.sidebar .item.selected{color:var(--blue);background:#eaf2fc;font-weight:600}.content{padding:30px 40px 40px;max-width:1100px;width:100%;margin:0 auto}.page-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.page-heading p{margin-top:7px;color:var(--muted)}.preview-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;font-size:12px}.preview-tools select{padding:6px 28px 6px 10px;border:1px solid #d2d2d7;border-radius:7px;background:white;color:inherit;max-width:100%}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.steps{display:flex;padding:22px 26px;border-bottom:1px solid var(--line);gap:8px;justify-content:space-between}.step{padding:6px 4px;border:0;border-radius:0;background:transparent;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap;font-size:13px}.step:hover{background:transparent;color:var(--blue)}.step-number{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#f0f0f3;font-size:12px}.step.active{color:var(--blue);font-weight:650}.step.active .step-number{color:white;background:var(--blue)}.step.done .step-number{color:var(--green);background:#edf8f0}.connector{height:1px;background:var(--line);flex:1;align-self:center;min-width:8px}.panel-body{padding:30px;min-height:430px}.subheading{margin-top:8px;color:var(--muted);margin-bottom:26px}.field{margin:20px 0}.field label,.field-title{display:block;font-weight:600;margin-bottom:9px}.input-row{display:flex;align-items:center;gap:8px}.input-row input{flex:1;min-width:0}input[type=text]{border:1px solid #d2d2d7;border-radius:9px;padding:10px 12px;width:100%;background:white;color:inherit}input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--blue);flex:none}.help{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.65}.notice{padding:15px 18px;border-radius:10px;background:#fff8ed;border:1px solid #f0dfbd;line-height:1.7;color:var(--warning);margin:18px 0}.notice.info{background:#f1f7ff;border-color:#dfebfc;color:#365d84}.notice b{display:block;margin-bottom:4px}.checks{margin:18px 0}.check-row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.check-row:last-child{border-bottom:0}.check-row .text{flex:1}.check-row small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}.status-icon{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#f0f0f3;color:#86868b;flex:none}.status-icon.ok{background:#edf8f0;color:var(--green)}.status-icon.spin{border:2px solid #dbe9fc;border-top-color:var(--blue);background:none;animation:spin .9s linear infinite}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.footer{padding:18px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fdfdfe}.progress-wrap{margin:18px 0}.progress-label{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px}.progress{height:6px;background:#eef0f3;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}.choices{display:flex;gap:18px;margin:20px 0;flex-wrap:wrap}.choices label,.option{display:flex;align-items:flex-start;gap:10px;line-height:1.6;cursor:pointer}.choices label{align-items:center}.project-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:15px 0}.project-row{display:flex;gap:12px;align-items:center;padding:15px;border-bottom:1px solid var(--line);cursor:pointer}.project-row:last-child{border:0}.project-name{font-weight:600}.path{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-all}.project-row .chip{margin-left:auto}.option{padding:14px 0;border-bottom:1px solid var(--line)}.option input{margin-top:3px}.option-text{flex:1}.option-text b{font-weight:550}.option-text p{font-size:12px;color:var(--muted);margin-top:4px}.excluded{margin-top:22px;background:#f5f5f7;border-radius:10px;padding:16px 18px}.excluded p{color:var(--muted);font-size:13px;margin-top:7px}details{margin-top:18px}summary{cursor:pointer;font-size:13px;color:#424245;padding:8px 0}details p{font-size:12px;color:var(--muted);margin:8px 0}.summary{display:grid;grid-template-columns:115px minmax(0,1fr);gap:16px;font-size:13px;margin:24px 0}.summary dt{color:var(--muted)}.summary dd{margin:0;word-break:break-all}.agree{display:flex;align-items:center;gap:10px;margin-top:24px;cursor:pointer}.error{color:#c22b25;margin-top:12px;font-size:13px}.error:empty{display:none}.success-banner{display:flex;align-items:center;gap:15px;margin:4px 0 28px}.success-mark{background:#edf8f0;color:var(--green);font-size:24px;display:grid;place-items:center;width:48px;height:48px;border-radius:50%}.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:24px}.manage-card{padding:18px;background:#fafafb;border:1px solid var(--line);border-radius:11px}.manage-card p{margin:7px 0 14px;font-size:12px;color:var(--muted)}.spaced{margin-top:20px}.launch-list{margin:24px 0}.launch-list li{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 0}.launch-list{padding:0}.prototype-note{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}dialog{width:min(520px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:26px;color:inherit;box-shadow:0 24px 70px #0002}dialog::backdrop{background:#1d1d1f55}dialog h2{font-size:20px}dialog .actions{justify-content:flex-end;margin-top:24px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#1d1d1f;color:white;border-radius:10px;z-index:5;max-width:calc(100% - 32px);font-size:13px}.empty{padding:30px 15px;text-align:center;color:var(--muted)}[hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.status-icon.spin{animation:none}.progress span{transition:none}}@media(max-width:1023px){.content{padding:24px}.sidebar{width:170px}.shell{grid-template-columns:170px minmax(0,1fr)}.steps{padding:18px;gap:3px}.step{font-size:12px;gap:5px}}@media(max-width:760px){.shell{display:block}.sidebar{display:none}.content{padding:18px 12px}.topbar{padding:0 15px}.page-heading{align-items:flex-start}.page-heading .chip{display:none}.panel-body{padding:22px 18px;min-height:0}.steps{overflow:auto;justify-content:flex-start;gap:12px}.connector{display:none}.step{flex:none}.step-number{width:23px;height:23px}.footer{padding:16px 18px;flex-wrap:wrap}.footer .actions{margin-left:auto}.manage-grid{grid-template-columns:1fr}.input-row{flex-wrap:wrap}.input-row input{flex-basis:100%}.preview-tools{gap:8px}.preview-tools label{width:100%}h2{font-size:20px}.summary{grid-template-columns:88px minmax(0,1fr)}button{padding:8px 12px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="logo">W</span>WorkStep<span class="muted small">/ 设置</span></div><span class="chip">可点击原型</span></header>
<div class="shell">
<aside class="sidebar" aria-label="设置导航"><b>个人设置</b><div class="item">常规</div><div class="item">供应商</div><div class="item">引擎配置</div><div class="item">外观与语言</div><b class="spaced">桌面环境</b><div class="item selected">沙箱模式</div><div class="item">远程访问</div><div class="item">关于 WorkStep</div></aside>
<main class="content">
<div class="page-heading"><div><h1>沙箱模式</h1><p>分步准备独立运行环境，继续使用你的项目和配置。</p></div><span class="chip" id="mode-chip">当前：普通模式</span></div>
<div class="preview-tools"><label for="platform">预览环境</label><select id="platform"><option value="mac">macOS · Apple 芯片</option><option value="win">Windows · x64</option></select><select id="bundle" aria-label="发布包类型"><option value="online">普通版 · 点击下载</option><option value="bundled">内置 Podman 版</option></select><select id="scenario" aria-label="预览情景"><option value="normal">正常准备</option><option value="cached">已有匹配镜像</option><option value="missing-wsl">WSL2 未就绪</option><option value="download-error">下载失败</option><option value="launch-error">启动失败</option></select><button class="quiet" id="reset">重置预览</button></div>
<div class="panel"><nav class="steps" aria-label="设置步骤" id="steps"></nav><section class="panel-body" id="body" aria-live="polite"></section><footer class="footer" id="footer"></footer></div>
<p class="prototype-note">交互演示：目录、下载、配置迁移与重启均为模拟，不会修改你的真实环境。</p>
</main></div>
<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="actions" id="dialog-actions"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), names=['辅助软件','镜像','项目目录','迁移配置','确认'];
let timers=[], toastTimer;
const initial=()=>({step:0,runtime:false,image:false,wsl:false,busy:false,root:'',projects:[{name:'workstep',path:'',selected:true},{name:'my-project',path:'',selected:true}],projectMode:'existing',newPath:'',migrate:{providers:true,engines:true,preferences:true,cli:false},ack:false,error:'',progress:0,phase:'',running:false,saved:false,launch:0});
let s=initial();
const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const win=()=>$('platform').value==='win', scenario=()=>$('scenario').value;
function paths(){s.root=win()?'C:\\WorkStep-Sandbox':'/Users/you/WorkStep-Sandbox';s.projects[0].path=win()?'C:\\Projects\\workstep':'/Users/you/Projects/workstep';s.projects[1].path=win()?'C:\\Projects\\my-project':'/Users/you/Projects/my-project';s.newPath=win()?'C:\\Projects\\sandbox-projects':'/Users/you/Projects/sandbox-projects';}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function button(label,action,primary=false,disabled=false){return `<button ${primary?'class="primary"':''} data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;}
function status(ok,title,desc='',spinning=false){return `<div class="check-row"><span class="status-icon ${ok?'ok':spinning?'spin':''}" aria-hidden="true">${ok?'✓':spinning?'':'○'}</span><div class="text">${title}${desc?`<small>${desc}</small>`:''}</div><span class="small muted">${ok?'已就绪':spinning?'处理中':'待准备'}</span></div>`;}
function progress(){return s.busy?`<div class="progress-wrap"><div class="progress-label"><span>${esc(s.phase)}</span><span>${s.progress}%</span></div><div class="progress" role="progressbar" aria-label="准备进度" aria-valuenow="${s.progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${s.progress}%"></span></div><p class="help">演示进度，不代表实际下载速度或启动耗时。</p></div>`:'';}
function nextReady(){return s.step===0?s.runtime:s.step===1?s.image:s.step===2?(s.projectMode==='new'?Boolean(s.newPath.trim()):s.projects.some(p=>p.selected)):s.step===4?s.ack:true;}
function selectedProjects(){return s.projectMode==='new'?1:s.projects.filter(p=>p.selected).length;}
function configSummary(){const a=[];if(s.migrate.providers)a.push('供应商（含 API Key）');if(s.migrate.engines)a.push('模型与引擎参数');if(s.migrate.preferences)a.push('用户偏好');if(s.migrate.cli)a.push('CLI 配置');return a.join('、')||'暂不迁移';}
function render(){
 $('mode-chip').textContent=s.running?'沙箱运行中':'当前：普通模式';$('mode-chip').className='chip '+(s.running?'green':'');
 $('steps').hidden=s.step>=5;
 $('steps').innerHTML=names.map((n,i)=>`${i?'<span class="connector"></span>':''}<button class="step ${s.step===i?'active':s.step>i?'done':''}" data-action="jump" data-step="${i}" ${s.busy?'disabled':''} ${s.step===i?'aria-current="step"':''}><span class="step-number">${s.step>i?'✓':i+1}</span>${n}</button>`).join('');
 let h='';
 if(s.step===0){const missing=win()&&scenario()==='missing-wsl'&&!s.wsl;
 h=`<h2>先准备沙箱需要的辅助软件</h2><p class="subheading">自动识别当前系统与芯片。准备一次，以后启动直接复用。</p><span class="chip blue">${win()?'Windows · x64':'macOS · Apple 芯片'} · 自动识别</span><div class="field"><label for="root">沙箱存储位置</label><div class="input-row"><input id="root" type="text" value="${esc(s.root)}" ${s.busy||s.runtime?'disabled':''}>${button('选择目录','choose-root',false,s.busy||s.runtime)}</div><p class="help">保存辅助软件、虚拟机和镜像，不是项目目录。请使用单独的空目录。</p></div><div class="checks">${status(true,'系统与架构支持')}${status(!missing,win()?'WSL2 与虚拟化':'系统虚拟化',missing?'需要先启用 Windows WSL2，再继续准备。':'无需安装其他桌面容器管理软件。')}${status(s.runtime,'Podman 及辅助软件',$('bundle').value==='bundled'?'使用安装包内的资源，无需再次下载 Podman。':'下载对应平台的软件，并校验完整性。',s.busy)}</div>${missing?`<div class="notice"><b>先完成 Windows 系统准备</b>启用 WSL2 和硬件虚拟化，可能需要管理员权限或重启。<div class="actions spaced"><a href="https://learn.microsoft.com/zh-cn/windows/wsl/install" target="_blank" rel="noopener">查看启用说明 ↗</a>${button('模拟 WSL2 已启用','enable-wsl')}</div></div>`:''}${progress()}<div class="actions">${button(s.runtime?'辅助软件已就绪':$('bundle').value==='bundled'?'准备内置辅助软件':'下载并准备辅助软件','prepare-runtime',true,s.busy||s.runtime||missing||!s.root.trim())}</div>`;
 }else if(s.step===1){h=`<h2>检查沙箱镜像</h2><p class="subheading">先查找已有的匹配镜像，没有再下载。不会删除其他镜像。</p><div class="checks">${status(s.image,'虚拟机基础镜像','用于运行 Linux 容器；内置 Podman 版首次仍可能需要下载。',s.busy)}${status(s.image,'WorkStep 镜像','检查当前应用版本、Linux 系统及 CPU 架构。',s.busy)}</div>${s.image?'<div class="notice info"><b>镜像已就绪，可以继续</b>当前环境已有匹配镜像，后续启动复用本地资源。</div>':'<div class="notice"><b>未找到匹配的沙箱镜像</b>推荐下载与当前应用及芯片架构匹配的官方镜像。</div>'}${progress()}<div class="actions">${button(s.image?'镜像已准备':'下载推荐镜像','prepare-image',true,s.busy||s.image)}${button('扫描本地 Docker 镜像','scan',false,s.busy||s.image)}</div><details><summary>从本地 Docker 导入有什么要求？</summary><p>仅列出架构匹配的 Linux WorkStep 镜像。选中后校验并导入独立 Podman 环境；运行沙箱不依赖 Docker 持续运行。</p></details>`;
 }else if(s.step===2){h=`<h2>选择在沙箱中使用的项目</h2><p class="subheading">项目目录单独选择，路径会映射到沙箱内，不能直接复制旧目录配置。</p><div class="choices"><label><input type="radio" name="project-mode" value="existing" ${s.projectMode==='existing'?'checked':''}>继续使用已有项目（推荐）</label><label><input type="radio" name="project-mode" value="new" ${s.projectMode==='new'?'checked':''}>使用新的项目目录</label></div>${s.projectMode==='existing'?`<div class="project-list">${s.projects.map((p,i)=>`<label class="project-row"><input type="checkbox" data-project="${i}" ${p.selected?'checked':''}><div><div class="project-name">${esc(p.name)}</div><div class="path">${esc(p.path)}</div></div><span class="chip">原目录</span></label>`).join('')}</div>${button('添加其他目录','add-project')}<p class="help">关联原目录，不复制项目。已有任务、消息和工作流继续读取项目数据库。</p>`:`<div class="field"><label for="new-path">项目目录</label><div class="input-row"><input id="new-path" type="text" value="${esc(s.newPath)}">${button('选择目录','choose-project')}</div><p class="help">此目录会挂载为沙箱内的项目区域；可在启动后创建或导入项目。</p></div>`}<div class="notice"><b>原内容不会因切换被清空</b>未关联的项目暂时不显示，原数据仍保留。关联原目录后，沙箱里的修改也会影响原项目文件，请勿同时在两种环境运行同一项目。</div>`;
 }else if(s.step===3){const options=[['providers','迁移供应商配置','包含供应商地址、协议和 API Key；密钥只复制到本地沙箱，不在预览中显示。'],['engines','迁移模型选择、引擎参数与供应商绑定','仅复制不依赖宿主路径的设置。'],['preferences','迁移可兼容的用户偏好','例如语言、显示名称及其他可兼容设置。'],['cli','同时导入 CLI 配置（可选）','Codex / Claude 的登录可能无法直接复用；路径相关条目需重新检查。']];
 h=`<h2>把普通模式的配置带进沙箱</h2><p class="subheading">选择需要迁移的配置。首次复制后，两个环境各自保存，后续可手动重新导入。</p>${options.map(([key,title,desc])=>`<label class="option"><input type="checkbox" data-migrate="${key}" ${s.migrate[key]?'checked':''}><div class="option-text"><b>${title}</b><p>${desc}</p></div></label>`).join('')}<div class="excluded"><h3>目录配置自动排除</h3><p>项目注册路径、默认项目目录、引擎程序路径、工作目录及其他依赖宿主文件的配置不会直接复制。项目按上一步的挂载选择重新关联。</p></div><div class="notice"><b>本机服务地址需要检查</b>localhost / 127.0.0.1 在沙箱中指向不同的环境。此类供应商或代理地址会标记待检查，不自动改写。</div><details><summary>如果沙箱已经有配置怎么办？</summary><p>导入前先备份。默认保留沙箱已有同名配置，需要覆盖时明确选择；原环境不受影响。供应商及其绑定一起迁移，避免模型绑定丢失。</p></details>`;
 }else if(s.step===4){h=`<h2>最后确认一下</h2><p class="subheading">保存设置后，重启进入沙箱；也可以稍后再开启。</p><dl class="summary"><dt>辅助软件</dt><dd>${s.runtime?'已准备':'尚未准备（请返回第 1 步）'}</dd><dt>沙箱镜像</dt><dd>${s.image?'已就绪，与当前平台匹配':'尚未准备（请返回第 2 步）'}</dd><dt>项目目录</dt><dd>${s.projectMode==='existing'?`关联 ${selectedProjects()} 个已有项目`:`使用新目录：${esc(s.newPath)}`}</dd><dt>配置迁移</dt><dd>${esc(configSummary())}</dd><dt>目录配置</dt><dd>排除宿主路径，按沙箱环境重新设置</dd><dt>沙箱存储</dt><dd>${esc(s.root)}</dd></dl><div class="notice"><b>切换后，原数据仍然保留</b>所选项目可继续使用；未关联项目暂时不显示。引擎登录、本机服务地址等可能需要重新设置。关闭沙箱并重启可以返回普通模式。</div><label class="agree"><input id="ack" type="checkbox" ${s.ack?'checked':''}>我已了解配置迁移与项目目录的变化</label><p class="help">有任务或会话运行时，暂不能切换环境。</p>`;
 }else if(s.step===5){h=`<div class="success-banner"><span class="success-mark">${s.running?'✓':'○'}</span><div><h2>${s.running?'沙箱运行中':'沙箱已准备，尚未开启'}</h2><p class="muted">${s.running?'项目已关联 · 所选配置已迁移':'设置已保存，普通模式继续运行。'}</p></div></div><div class="manage-grid"><div class="manage-card"><h3>项目目录</h3><p>已选择 ${selectedProjects()} 个目录，按挂载关系关联。</p>${button('管理项目目录','manage-projects')}</div><div class="manage-card"><h3>配置迁移</h3><p>${esc(configSummary())}；目录字段排除。</p>${button('重新导入配置','reimport')}</div></div><dl class="summary"><dt>沙箱存储</dt><dd>${esc(s.root)}</dd><dt>镜像状态</dt><dd>与当前应用及架构匹配</dd></dl><div class="actions">${button(s.running?'关闭沙箱并重启':'开启沙箱并重启',s.running?'disable':'launch',!s.running)}${button('查看日志','logs')}</div><details><summary>高级设置与清理</summary><p>资源与兼容权限单独管理。删除只清理自有沙箱环境和配置，不删除挂载的项目目录。</p><button class="danger" data-action="remove" ${s.running?'disabled':''}>删除沙箱…</button>${s.running?'<p>先关闭沙箱并重启，再进行删除。</p>':''}</details>`;
 }else{const labels=['检查辅助软件与镜像','启动虚拟机','启动沙箱后台','关联项目并检查配置'];h=`<h2>${s.error?'沙箱启动遇到问题':'正在进入沙箱环境'}</h2><p class="subheading">复用本地环境，不重复下载。等待后台就绪后自动打开项目。</p><ul class="launch-list">${labels.map((label,i)=>`<li><span class="status-icon ${s.launch>i?'ok':s.launch===i&&s.busy?'spin':''}">${s.launch>i?'✓':s.launch===i&&s.busy?'':'○'}</span>${label}</li>`).join('')}</ul>${s.error?`<div class="notice"><b>启动失败，原数据保留</b>${esc(s.error)}</div><div class="actions">${button('重试','retry-launch',true)}${button('查看日志','logs')}${button('返回普通模式','return-native')}</div>`:'<p class="muted small">演示状态；实际耗时取决于设备性能及环境。</p>'}`;}
 $('body').innerHTML=h+(s.step!==6&&s.error?`<p class="error" role="alert">${esc(s.error)}</p>`:'');
 if(s.step<4)$('footer').innerHTML=`<span class="small muted">第 ${s.step+1} 步，共 5 步</span><div class="actions">${s.step?button('上一步','back',false,s.busy):''}${button('下一步','next',true,s.busy||!nextReady())}</div>`;
 else if(s.step===4)$('footer').innerHTML=`${button('上一步','back')}<div class="actions">${button('仅保存，稍后开启','save',false,!s.runtime||!s.image||!selectedProjects())}${button('确认并重启','confirm-launch',true,!s.ack||!s.runtime||!s.image||!selectedProjects())}</div>`;
 else $('footer').innerHTML=`<span class="small muted">${s.step===6?'切换期间不会删除项目数据。':'可随时切回普通模式，两个环境各自保留配置。'}</span>`;
 $('platform').disabled=$('bundle').disabled=$('scenario').disabled=s.busy;
}
function modal(title,html,actions){$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;$('dialog-actions').replaceChildren();for(const a of actions){const b=document.createElement('button');b.textContent=a.label;if(a.primary)b.className='primary';if(a.danger)b.className='danger';b.onclick=()=>{if(a.fn()!==false)$('dialog').close();};$('dialog-actions').append(b);}$('dialog').showModal();}
function directory(title,value,done){modal(title,'<p class="help">原型使用示例路径，可以直接编辑；实际应用会打开系统目录选择器。</p><div class="field"><label for="directory-input">目录路径</label><input id="directory-input" type="text" value="'+esc(value)+'"><p id="directory-error" class="error"></p></div>',[{label:'取消',fn:()=>{}},{label:'使用此目录',primary:true,fn:()=>{const v=$('directory-input').value.trim();if(!v){$('directory-error').textContent='请选择或输入目录。';$('directory-input').focus();return false;}done(v);render();}}]);}
function prepare(kind){s.busy=true;s.error='';s.progress=0;s.phase=kind==='runtime'?($('bundle').value==='bundled'?'校验包内辅助软件':'下载 Podman 及辅助软件'):'准备虚拟机基础镜像';render();const bundled=kind==='runtime'&&$('bundle').value==='bundled';for(let i=1;i<=5;i++)later(()=>{s.progress=i*20;if(i===3&&scenario()==='download-error'&&!bundled){s.busy=false;s.error='模拟下载失败：网络连接中断。已准备内容保留，请重试。';render();return;}if(!s.busy)return;if(kind==='image'&&i>=3)s.phase='下载并校验 WorkStep 镜像';if(i===5){s.busy=false;s[kind==='runtime'?'runtime':'image']=true;toast(kind==='runtime'?'辅助软件已准备':'镜像已就绪');}render();},i*550);}
function launch(){clearTimers();s.step=6;s.launch=0;s.busy=true;s.error='';render();for(let i=1;i<=4;i++)later(()=>{if(!s.busy)return;s.launch=i;if(i===2&&scenario()==='launch-error'){s.busy=false;s.error='模拟后台健康检查失败，可以重试或返回普通模式。';render();return;}if(i===4){s.busy=false;s.running=true;s.saved=true;s.step=5;toast('已进入沙箱（模拟）');}render();},i*650);}
function reset(){clearTimers();s=initial();paths();if(scenario()==='cached'){s.runtime=true;s.image=true;}render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
 if(a==='jump'){if(s.busy)return;s.step=Number(el.dataset.step);s.error='';render();}
 else if(a==='back'||a==='next'){s.step+=a==='back'?-1:1;s.error='';render();}
 else if(a==='prepare-runtime')prepare('runtime');else if(a==='prepare-image')prepare('image');
 else if(a==='enable-wsl'){s.wsl=true;render();}
 else if(a==='choose-root')directory('选择沙箱存储位置',s.root,v=>s.root=v);
 else if(a==='choose-project')directory('选择项目目录',s.newPath,v=>s.newPath=v);
 else if(a==='add-project')directory('添加项目目录',win()?'C:\\Projects\\other-project':'/Users/you/Projects/other-project',v=>{if(!s.projects.some(p=>p.path===v))s.projects.push({name:v.split(/[\\/]/).filter(Boolean).pop()||'项目',path:v,selected:true});});
 else if(a==='scan')modal('本地 Docker 镜像','<p class="help">示例扫描结果，仅显示符合当前架构的 WorkStep 镜像。</p><div class="project-list"><div class="project-row"><div><b>workstep:local</b><div class="path">Linux · '+(win()?'amd64':'arm64')+' · 入口检查通过</div></div><span class="chip green">可导入</span></div></div>',[{label:'取消',fn:()=>{}},{label:'导入此镜像',primary:true,fn:()=>prepare('image')}]);
 else if(a==='save'){s.saved=true;s.step=5;render();toast('设置已保存，继续使用普通模式（模拟）');}
 else if(a==='confirm-launch')modal('确认切换到沙箱','<div class="notice"><b>会复制你选择的配置（含所选 API Key），不会复制目录字段。</b>原项目数据保留。沙箱中未关联的项目暂不显示；本机地址与引擎登录可能需重新设置。重启期间会显示启动进度。</div>',[{label:'返回检查',fn:()=>{}},{label:'确认并重启',primary:true,fn:()=>launch()}]);
 else if(a==='launch'||a==='retry-launch')launch();
 else if(a==='disable')modal('关闭沙箱并重启','<p class="subheading">将回到普通模式的配置和项目列表。沙箱中的配置独立保留，不会自动覆盖普通模式。</p>',[{label:'取消',fn:()=>{}},{label:'关闭并重启',primary:true,fn:()=>{s.running=false;render();toast('已返回普通模式（模拟）');}}]);
 else if(a==='return-native'){s.busy=false;s.running=false;s.error='';s.step=5;render();toast('已返回普通模式，沙箱准备内容保留');}
 else if(a==='manage-projects'){if(s.running)modal('先关闭沙箱再修改目录','<p class="subheading">目录变更需要重新准备并重启。先关闭沙箱，可以避免影响当前工作。</p>',[{label:'知道了',primary:true,fn:()=>{}}]);else{s.step=2;render();}}
 else if(a==='reimport')modal('重新导入配置','<p class="subheading">导入前先备份沙箱配置。目录字段始终排除。</p><label class="option"><input type="radio" name="conflict" checked>保留沙箱已有配置，仅补充缺失项（推荐）</label><label class="option"><input type="radio" name="conflict">使用普通模式配置覆盖同名项</label><p class="help">'+(s.running?'正在运行沙箱，请先关闭并重启后再导入。':'本次为交互演示，不会实际读取或写入配置。')+'</p>',[{label:'取消',fn:()=>{}},...(s.running?[]:[{label:'备份并导入',primary:true,fn:()=>toast('已模拟备份与配置导入，目录字段已排除')}])]);
 else if(a==='logs')modal('沙箱运行日志','<p class="help">以下为示例日志，不含密钥。</p><pre style="white-space:pre-wrap;font-size:12px;line-height:1.8">[检查] 运行时平台匹配\n[镜像] 版本与架构检查\n[配置] 路径字段排除\n[提示] localhost 地址待检查\n'+(s.error?'[错误] '+esc(s.error):'[状态] '+(s.running?'沙箱运行中':'沙箱未运行'))+'</pre>',[{label:'关闭',primary:true,fn:()=>{}}]);
 else if(a==='remove')modal('删除沙箱环境？','<div class="notice"><b>沙箱专属配置、虚拟机和镜像将被删除。</b>挂载的项目目录与普通模式配置保留。请先导出需要保留的沙箱配置。</div>',[{label:'保留沙箱',fn:()=>{}},{label:'删除沙箱',danger:true,fn:()=>{reset();toast('已模拟删除，原项目保持不变');}}]);
});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='project-mode'){s.projectMode=t.value;render();}else if(t.dataset.project!==undefined){s.projects[Number(t.dataset.project)].selected=t.checked;render();}else if(t.dataset.migrate){s.migrate[t.dataset.migrate]=t.checked;}else if(t.id==='ack'){s.ack=t.checked;render();}});
document.addEventListener('input',e=>{if(e.target.id==='root'){s.root=e.target.value;const b=$('body').querySelector('[data-action="prepare-runtime"]');if(b)b.disabled=s.runtime||s.busy||!s.root.trim()||(win()&&scenario()==='missing-wsl'&&!s.wsl);}if(e.target.id==='new-path'){s.newPath=e.target.value;const b=$('footer').querySelector('[data-action="next"]');if(b)b.disabled=!nextReady();}});
['platform','bundle','scenario'].forEach(id=>$(id).addEventListener('change',reset));$('reset').onclick=reset;paths();render();
})();
</script>
</body>
</html>
