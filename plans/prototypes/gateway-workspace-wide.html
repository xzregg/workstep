<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 WorkStep · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#273449;background:#fff}button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:3px}header{height:56px;display:flex;align-items:center;gap:32px;padding:0 24px;border-bottom:1px solid #e8ebf0}.brand{font-size:20px;font-weight:750;letter-spacing:-.6px}.nav{color:#2563eb;font-weight:600}.right{margin-left:auto;display:flex;align-items:center;gap:24px}.badge{font-size:11px;color:#98a2b3;border:1px solid #e5e7eb;border-radius:4px;padding:3px 7px}.tabsbar{height:52px;display:flex;align-items:end;background:#f5f6f8;border-bottom:1px solid #e3e7ed;padding:0 16px;gap:16px}.tabs{display:flex;align-items:end;gap:4px;overflow:auto;flex:1}.device{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:13px 20px;height:44px;color:#667085;border:1px solid transparent;border-radius:8px 8px 0 0}.device.active{background:#fff;color:#1d2939;border-color:#e3e7ed;border-bottom-color:#fff;font-weight:600;margin-bottom:-1px;height:45px}.dot{height:6px;width:6px;border-radius:100%;background:#16a36a;display:inline-block}.dot.off{background:#a5aebd}.status{font-size:12px;color:#15803d;white-space:nowrap;align-self:center}.tools{align-self:center;display:flex;gap:12px;color:#667085}.tools button{padding:6px}.shell{height:calc(100dvh - 108px);display:flex}.sidebar{width:230px;flex-shrink:0;background:#fafbfc;border-right:1px solid #e7eaf0;display:flex;flex-direction:column;padding:18px 12px}.project{background:#fff;border:1px solid #dce2ea;border-radius:8px;padding:10px;display:flex;align-items:center;gap:8px;margin-bottom:22px}.project select{min-width:0;flex:1;border:0;background:transparent;color:#344054;outline:none}.caption{font-size:11px;color:#98a2b3;letter-spacing:.6px;padding:0 12px;margin-bottom:10px}.menu{display:flex;flex-direction:column;gap:5px}.menu button{text-align:left;padding:12px;border-radius:7px;color:#667085;display:flex;gap:12px;align-items:center}.menu button.active{color:#2563eb;background:#eaf1ff;font-weight:600}.menu button:hover{background:#eef2f7}.menu button.active:hover{background:#eaf1ff}.sidebar-bottom{margin-top:auto;color:#98a2b3;font-size:12px;padding:12px;line-height:2}.sidebar-bottom button{padding:0;display:block;color:#667085;margin-bottom:10px}.content{flex:1;min-width:0;overflow:auto;padding:28px 32px;position:relative}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 8px;color:#172033}.sub{margin:0;font-size:13px;color:#98a2b3}.primary{background:#2563eb;color:#fff;border-radius:7px;padding:10px 16px;font-weight:500}.primary:hover{background:#1d4ed8}.filters{display:flex;gap:10px;align-items:center;margin-bottom:20px}.filters input{width:300px;max-width:40%;padding:9px 12px;border:1px solid #dce2ea;border-radius:7px}.filters select{padding:9px 12px;border:1px solid #dce2ea;border-radius:7px;background:#fff;color:#667085}.view{margin-left:auto;display:flex;gap:4px}.view button{border-radius:6px;padding:8px 10px;color:#98a2b3}.view button.active{background:#f0f4fa;color:#344054}.table-wrap{overflow:auto;border:1px solid #e8ecf2;border-radius:9px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#fafbfc;color:#98a2b3;font-size:12px;font-weight:500;padding:13px 18px}td{padding:22px 18px;border-top:1px solid #edf0f4;font-size:13px;color:#667085}td:first-child{font-weight:600;color:#344054;min-width:240px}.pill{padding:5px 10px;border-radius:5px;background:#f3f4f6;color:#667085;font-size:12px}.pill.running{background:#eef5ff;color:#2563eb}.pill.done{background:#ecfdf3;color:#16925d}.count{font-size:12px;color:#98a2b3;margin-top:18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{border:1px solid #e3e8ef;border-radius:10px;padding:20px}.card h3{margin:0 0 16px;font-size:15px}.card p{font-size:12px;color:#98a2b3}.card .pill{display:inline-block;margin-top:12px}.offline{display:flex;align-items:center;justify-content:center;height:70%;text-align:center}.offline h2{font-size:20px}.offline p{color:#98a2b3;line-height:1.8}.toast{position:fixed;bottom:24px;right:24px;width:390px;max-width:calc(100vw - 32px);background:#fff;border:1px solid #dce2ea;box-shadow:0 6px 26px #26344614;padding:18px 20px;border-radius:10px;z-index:3}.toast strong{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:550}.toast p{color:#98a2b3;font-size:12px;margin:8px 0 0 26px;line-height:1.7}.spinner{width:15px;height:15px;border:2px solid #dbe7fc;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}.toast button{color:#2563eb;font-size:12px;padding:0;margin:10px 0 0 26px}@keyframes spin{to{transform:rotate(360deg)}}.restriction{padding:8px 12px;border-radius:6px;background:#f8fafc;color:#667085;font-size:12px;margin-bottom:20px}.demo{position:fixed;bottom:16px;left:246px;color:#a3acba;font-size:11px}.demo button{font-size:11px;text-decoration:underline;padding:4px 6px}.notice{position:fixed;top:124px;right:24px;background:#172033;color:#fff;padding:12px 18px;border-radius:8px;z-index:4;font-size:13px}[hidden]{display:none!important}@media(max-width:800px){header{padding:0 14px;gap:18px}.badge,.right .admin{display:none}.right{gap:10px}.sidebar{width:180px;padding:12px 8px}.content{padding:20px 16px}.status{display:none}.tabsbar{padding:0 8px;gap:4px}.device{padding:12px}.filters{flex-wrap:wrap}.filters input{width:100%;max-width:100%}.demo{left:195px}h1{font-size:22px}}@media(max-width:520px){.sidebar{width:54px;padding:12px 6px}.project{padding:10px 0;justify-content:center}.project select,.caption,.menu .label,.sidebar-bottom{display:none}.menu button{padding:12px 10px}.content{padding:20px 12px}.sub{max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tools button:first-child{display:none}.demo{left:64px;bottom:8px}.heading .primary{font-size:12px;padding:9px}.view{margin-left:0}.nav{font-size:12px}.right{font-size:12px}.device{font-size:12px}.toast{bottom:40px;right:16px}}
</style></head><body>
<header><div class="brand">◈ WorkStep</div><div class="nav">我的 WorkStep</div><span class="badge">交互原型</span><div class="right"><button class="admin" onclick="notify('这里进入平台管理，原型只展示工作台')">平台管理</button><button onclick="notify('当前使用模拟账号和模拟项目')">演示用户 ▾</button></div></header>
<div class="tabsbar"><div class="tabs" role="tablist" aria-label="切换设备实例"></div><span class="status" id="status">已连接 · 全部项目</span><div class="tools"><button aria-label="刷新连接" onclick="reconnect()">↻</button><button aria-label="全屏" onclick="fullscreen()">⛶</button></div></div>
<div class="shell"><aside class="sidebar"><div class="project"><span>▣</span><select aria-label="切换项目" id="project" onchange="renderContent()"></select></div><div class="caption">项目工作台</div><nav class="menu" aria-label="项目导航"></nav><div class="sidebar-bottom"><button onclick="notify('原型中的项目设置入口')">⚙ 项目设置</button><span id="host">远程实例 · 研发电脑</span></div></aside><main class="content" id="content"></main></div>
<div class="demo">原型演示 <button onclick="reconnect()">模拟网关重启</button><button onclick="reset()">恢复初始状态</button></div>
<div class="toast" id="toast" role="status" hidden><strong><span class="spinner"></span><span id="toast-title">网关暂时断开，正在自动重连…</span></strong><p>保留当前设备和项目。连接恢复后自动返回工作台，无需刷新。</p><button onclick="finishReconnect()">立即恢复连接</button></div><div class="notice" id="notice" role="status" hidden></div>
<script>
const devices=[{name:'研发电脑',online:true,projects:['操作手册演示','前端演示项目']},{name:'测试服务器',online:true,projects:['授权项目 A1'],limited:true},{name:'演示电脑',online:false,projects:['移动端演示']}];const menus=[['▤','任务'],['◇','工作流'],['◷','定时任务'],['✦','项目助手'],['▥','文件与产物']];let selected=0,section='任务',view='list',timer,noticeTimer;
const tasks=[['整理项目需求','研发流程','进行中','今天 14:32'],['实现登录页面','研发流程','待开始','今天 13:40'],['验证设备项目授权','验收流程','已完成','昨天 18:20'],['补充移动端布局','研发流程','待开始','昨天 16:05']];
function render(){document.querySelector('.tabs').innerHTML=devices.map((d,i)=>`<button class="device ${i===selected?'active':''}" role="tab" aria-selected="${i===selected}" onclick="choose(${i})"><span>▣</span>${d.name}<span class="dot ${d.online?'':'off'}"></span></button>`).join('');const d=devices[selected];document.getElementById('status').textContent=d.online?'已连接 · '+(d.limited?'仅授权项目':'全部项目'):'设备离线';document.getElementById('status').style.color=d.online?'#15803d':'#98a2b3';document.getElementById('project').innerHTML=d.projects.map(p=>`<option>${p}</option>`).join('');document.getElementById('host').textContent='远程实例 · '+d.name;renderMenu();renderContent()}
function choose(i){clearTimeout(timer);document.getElementById('toast').hidden=true;selected=i;section='任务';render()}
function renderMenu(){document.querySelector('.menu').innerHTML=menus.map(([icon,name])=>`<button class="${section===name?'active':''}" onclick="section='${name}';renderMenu();renderContent()"><span>${icon}</span><span class="label">${name}</span></button>`).join('')}
function pill(s){return `<span class="pill ${s==='进行中'?'running':s==='已完成'?'done':''}">${s}</span>`}
function renderContent(){const d=devices[selected],p=document.getElementById('project').value;const el=document.getElementById('content');if(!d.online){el.innerHTML='<div class="offline"><div><h2>演示电脑当前离线</h2><p>设备上线后会自动恢复连接。<br>也可以切换到其他在线设备。</p><button class="primary" onclick="notify(this.textContent)">检查连接</button></div></div>';return}el.innerHTML=`<div class="heading"><div><h1>${section}</h1><p class="sub">${p} / ${section==='任务'?'当前项目的任务与工作流':section}</p></div><button class="primary" onclick="notify('这是交互原型，正式版本复用远端 WorkStep 功能')">＋ ${section==='任务'?'新建任务':'新建'}</button></div>${d.limited?'<div class="restriction">此设备仅授予“授权项目 A1”的访问权限，其他项目不可见。</div>':''}${section==='任务'?`<div class="filters"><input id="search" placeholder="⌕ 搜索任务…" oninput="renderTasks()"><select id="filter" aria-label="任务状态" onchange="renderTasks()"><option>所有状态</option><option>进行中</option><option>待开始</option><option>已完成</option></select><select aria-label="工作流" onchange="notify('原型工作流筛选示例')"><option>所有工作流</option><option>研发流程</option><option>验收流程</option></select><div class="view"><button class="${view==='list'?'active':''}" onclick="view='list';renderContent()">☷ 列表</button><button class="${view==='board'?'active':''}" onclick="view='board';renderContent()">▦ 看板</button></div></div><div id="tasks"></div>`:'<div class="offline"><div><h2>'+section+'</h2><p>这里复用远端设备的 '+section+' 页面。<br>原型只演示导航和整体布局。</p></div></div>'}`;if(section==='任务')renderTasks()}
function renderTasks(){const q=document.getElementById('search').value,s=document.getElementById('filter').value;const rows=tasks.filter(t=>t[0].includes(q)&&(s==='所有状态'||t[2]===s));document.getElementById('tasks').innerHTML=(view==='list'?`<div class="table-wrap"><table><thead><tr><th>任务名称</th><th>工作流</th><th>状态</th><th>创建者</th><th>更新时间</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td>${pill(t[2])}</td><td>演示用户</td><td>${t[3]}</td></tr>`).join('')}</tbody></table></div>`:`<div class="cards">${rows.map(t=>`<article class="card"><h3>${t[0]}</h3><p>${t[1]} · 演示用户</p>${pill(t[2])}<p>${t[3]}</p></article>`).join('')}</div>`)+`<div class="count">共 ${rows.length} 项任务</div>`}
function reconnect(){if(!devices[selected].online){notify('当前设备离线，请切换在线设备');return}clearTimeout(timer);document.getElementById('toast').hidden=false;document.getElementById('status').textContent='正在自动重连…';document.getElementById('status').style.color='#d97706';timer=setTimeout(finishReconnect,4500)}
function finishReconnect(){clearTimeout(timer);document.getElementById('toast').hidden=true;document.getElementById('status').textContent='已连接 · '+(devices[selected].limited?'仅授权项目':'全部项目');document.getElementById('status').style.color='#15803d';notify('连接已恢复，设备与当前项目已保留')}
function notify(message){clearTimeout(noticeTimer);const n=document.getElementById('notice');n.textContent=message;n.hidden=false;noticeTimer=setTimeout(()=>n.hidden=true,2600)}
function reset(){view='list';choose(0)}function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>notify('当前浏览器不支持全屏'))}render();
</script></body></html>
