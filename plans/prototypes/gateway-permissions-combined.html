<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>权限集合与分栏 · WorkStep 权限分配原型</title><style>
:root{--accent:#0071e3;--hover:#0077ed;--canvas:#fff;--surface:#f5f5f7;--lifted:#fbfbfd;--ink:#1d1d1f;--secondary:#424245;--muted:#6e6e73;--border:#d2d2d7;--line:#e8e8ed;--control:12px;--panel:14px;--window:18px}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--surface);font:14px/1.55 system-ui,-apple-system,'PingFang SC',sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer;min-height:36px;padding:6px 14px;border:1px solid var(--border);background:var(--canvas);color:var(--secondary);border-radius:var(--control)}button:hover{background:var(--surface)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:var(--canvas);border-color:var(--accent)}.primary:hover{background:var(--hover)}.text-button{border:0;background:transparent;color:var(--accent);padding:4px 8px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.preview-nav{max-width:1180px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-weight:700;margin-right:auto}.preview-nav a{font-size:13px;color:var(--muted)}.preview-nav a[aria-current=page]{color:var(--accent);font-weight:600}.preview-label{font-size:11px;color:var(--muted)}.intro{max-width:1120px;margin:12px auto 20px;padding:0 24px}.intro h1{font-size:24px;letter-spacing:-.02em;margin:0 0 8px}.intro p{margin:0;color:var(--muted);font-size:13px}.window{width:min(960px,calc(100% - 48px));margin:0 auto 32px;border:1px solid var(--line);border-radius:var(--window);background:var(--canvas);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.05)}.window.wide{width:min(1160px,calc(100% - 48px))}.window-header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}.window-header h2{font-size:20px;margin:0}.window-header .meta{margin-left:auto}.muted,.meta{color:var(--muted);font-size:12px}.body{padding:24px}.context{display:grid;grid-template-columns:140px 1fr 1fr;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.field{display:grid;gap:8px;align-content:start;min-width:0}.field>span{font-size:13px;font-weight:600}.field input,.field select,.search{width:100%;min-width:0;min-height:36px;border:1px solid var(--border);border-radius:var(--control);padding:6px 10px;background:var(--canvas);color:var(--ink)}.toolbar{display:flex;align-items:center;gap:12px;margin:16px 0;flex-wrap:wrap}.toolbar .search{flex:1;min-width:180px;width:auto}.toolbar strong{font-size:13px;font-weight:500;white-space:nowrap}.selection{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{font-size:12px;min-height:28px;padding:4px 10px;border-color:var(--line);color:var(--accent);background:var(--lifted);max-width:100%;text-align:left}.chip span{margin-left:8px}.categories{display:grid;gap:20px}.group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}.group-head h3{font-size:16px;margin:0}.group-head .meta{margin-left:auto}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.option{display:flex;align-items:flex-start;gap:10px;min-height:64px;padding:12px;border:1px solid var(--line);border-radius:var(--control);cursor:pointer;background:var(--lifted)}.option:hover{border-color:var(--border)}.option:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--canvas))}.option input{width:16px;height:16px;flex:0 0 16px;margin:3px 0 0;accent-color:var(--accent)}.option strong{font-size:13px;font-weight:500;display:block}.option small{font-size:12px;color:var(--muted);display:block;margin-top:3px}.option span{min-width:0;overflow-wrap:anywhere}.footer{border-top:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:10px;background:var(--canvas)}.footer .summary{margin-right:auto;font-size:12px;color:var(--muted)}.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}.preset{text-align:left;padding:16px;min-height:112px;border-color:var(--line);background:var(--lifted)}.preset strong{display:block;margin-bottom:8px;font-size:14px}.preset small{font-size:12px;color:var(--muted);display:block}.preset[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--canvas));color:var(--accent)}.section-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.section-heading h3{margin:0;font-size:16px}.section-heading .meta{margin-left:auto}.brief{background:var(--surface);border-radius:var(--panel);padding:16px 20px;margin:16px 0 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.brief strong{font-size:13px}.brief p{font-size:12px;color:var(--muted);margin:6px 0 0}.customize{border-top:1px solid var(--line);padding-top:20px}.customize>summary{cursor:pointer;font-weight:600;list-style-position:inside}.split{display:grid;grid-template-columns:168px minmax(0,1fr) 232px;min-height:520px}.side{padding:20px 12px;border-right:1px solid var(--line);background:var(--lifted)}.side button{border:0;background:transparent;width:100%;display:flex;justify-content:space-between;text-align:left;margin-bottom:8px;padding:10px 12px}.side button[aria-pressed=true]{color:var(--accent);background:var(--surface);font-weight:600}.side h3{font-size:12px;color:var(--muted);margin:0 12px 16px}.center{padding:20px;min-width:0}.center .options{grid-template-columns:1fr}.center .option{background:transparent;border-width:0 0 1px;border-radius:0;min-height:64px;padding:12px 4px}.center .option:has(input:checked){background:transparent}.review{padding:20px;border-left:1px solid var(--line);background:var(--lifted);min-width:0}.review h3{font-size:16px;margin:0 0 16px}.review dl{margin:0 0 20px}.review dt{font-size:12px;color:var(--muted);margin:12px 0 4px}.review dd{font-size:13px;margin:0;overflow-wrap:anywhere}.review .selection{display:block}.review .chip{display:block;width:100%;margin:0 0 8px}.review .field{margin:20px 0}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 32px));padding:14px 20px;border-radius:var(--panel);background:var(--ink);color:var(--canvas);box-shadow:0 8px 30px rgba(0,0,0,.1);z-index:3;font-size:13px}.notice[hidden]{display:none}.notice button{float:right;border:0;background:transparent;color:var(--canvas);min-height:24px;padding:0 4px}.scope-rule{display:flex;align-items:center;gap:12px;font-size:13px;margin:24px 0 0}.scope-rule select{min-height:36px;border:1px solid var(--border);border-radius:var(--control);padding:6px 10px;background:var(--canvas)}.index-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:24px}.index-card{border:1px solid var(--line);border-radius:var(--panel);padding:24px;background:var(--canvas);color:var(--ink)}.index-card h2{font-size:20px;margin:0 0 12px}.index-card p{font-size:13px;color:var(--muted)}.index-card a{display:inline-block;margin-top:16px}.number{font-size:12px;color:var(--accent);margin-bottom:28px}.index-caption{margin:0 24px 24px;font-size:13px;color:var(--muted)}
@media(max-width:900px){.split{grid-template-columns:140px minmax(0,1fr)}.review{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.review .selection{display:flex}.review .chip{width:auto}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.presets{grid-template-columns:repeat(2,minmax(0,1fr))}.index-grid{grid-template-columns:1fr}}@media(max-width:600px){.preview-nav{padding:16px;gap:12px}.brand{flex-basis:100%}.intro{padding:0 16px}.window,.window.wide{width:calc(100% - 24px)}.window-header,.body,.footer{padding:16px}.context{grid-template-columns:1fr;gap:12px;margin-bottom:20px;padding-bottom:20px}.options{grid-template-columns:1fr}.brief{grid-template-columns:1fr;gap:12px}.split{display:block}.side{display:flex;gap:4px;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.side h3{display:none}.side [data-category-nav]{display:contents}.side button{flex:none;width:auto;white-space:nowrap;margin:0;gap:12px}.center,.review{padding:16px}.footer{flex-wrap:wrap}.footer .summary{flex-basis:100%;margin-bottom:4px}.footer>button:first-of-type{margin-left:auto}.toolbar .search{flex-basis:100%}.field input,.field select,.search{font-size:16px}.presets{gap:8px}.preset{padding:12px}.window-header{align-items:flex-start}.window-header .meta{max-width:100px;text-align:right}.scope-rule{flex-wrap:wrap}.index-grid{margin:16px}.index-caption{margin:16px}}

.window:not(.landing){display:flex;flex-direction:column;max-height:calc(100dvh - 190px)}
.window-header,.footer{flex:none}.window:not(.landing)>.body{min-height:0;overflow:auto}
.window.wide:not(.landing){height:calc(100dvh - 190px)}
.window.wide:not(.landing)>.body{flex:none}.split{flex:1;min-height:0;overflow:hidden}
.center,.review{overflow:auto;min-height:0}
@media(max-width:900px){.window.wide:not(.landing){height:auto;max-height:none}.split{overflow:visible}.center,.review{overflow:visible}}
@media(max-width:600px){.window:not(.landing){max-height:none}.window:not(.landing)>.body{overflow:visible}}

.combined>.body{padding:16px 24px}
.combined .context{padding-bottom:16px;margin-bottom:16px}
.combined .presets{margin:12px 0 0;gap:8px}
.combined .preset{min-height:0;padding:12px 14px}
.combined .preset strong{margin-bottom:4px}
.combined .section-heading h3{font-size:16px}
.combined .review .selection{margin-top:12px}
@media(max-width:600px){.combined>.body{padding:16px}.combined .section-heading .meta{flex-basis:100%;margin:0}.combined .preset{padding:12px}}
</style></head><body><nav class="preview-nav" aria-label="原型切换"><a class="brand" href="gateway-permissions-index.html">WorkStep / 权限分配原型</a><a href="gateway-permissions-a.html" >A · 分组多选</a><a href="gateway-permissions-b.html" >B · 权限集合优先</a><a href="gateway-permissions-c.html" >C · 左右分栏</a><a href="gateway-permissions-combined.html" aria-current="page">合并方案</a><span class="preview-label">界面提案</span></nav><div class="intro"><h1>权限集合 + 左右分栏</h1><p>先用权限集合快速分配，再按功能分类调整明细，右侧始终保留本次分配摘要。</p></div><div class="window wide combined"><header class="window-header"><h2>分配项目权限</h2><span class="meta">设备：演示设备<br>范围：指定项目</span></header><div class="body"><div class="context"><label class="field"><span>对象类型</span><select id="subject-type"><option value="user">用户</option><option value="group">用户组</option></select></label><label class="field"><span>授权对象</span><select id="subject"><option>演示用户</option><option>协作用户</option></select></label><label class="field"><span>指定项目</span><select id="project"><option>操作手册演示 / 需求池</option><option>操作手册演示 / 产品研发</option></select></label></div><div class="section-heading"><h3>权限集合</h3><span class="meta">选择后自动勾选下方明细</span></div><div class="presets" data-presets></div></div><div class="split"><aside class="side"><h3>功能分类</h3><div data-category-nav></div></aside><main class="center"><div class="toolbar"><input type="search" class="search" data-search aria-label="搜索权限" placeholder="搜索权限名称、功能或权限键"><strong data-count aria-live="polite"></strong><button type="button" class="text-button" data-clear>清空选择</button></div><div class="categories" data-permissions></div></main><aside class="review"><h3>本次分配</h3><dl><dt>授权对象</dt><dd data-subject-summary></dd><dt>指定项目</dt><dd data-project-summary></dd><dt>权限集合</dt><dd data-preset-name></dd></dl><strong data-count aria-live="polite"></strong><div class="selection" data-selected></div><p class="muted" data-denied></p><label class="field"><span>授权规则</span><select id="effect"><option>允许</option><option>禁止</option></select></label><p class="muted">只分配选定项目的能力，不授予整台设备访问权。</p></aside></div><footer class="footer"><span class="summary">交互原型 · 模拟数据 · 不修改真实授权</span><button type="button" data-reset>重置示例</button><button type="button" class="primary" data-save>预览分配结果</button></footer></div><div class="notice" id="notice" role="status" hidden><button type="button" data-dismiss aria-label="关闭结果提示">×</button><span id="notice-text"></span></div><script>const CATALOG=[{"name": "任务", "description": "提交与跟进任务", "items": [{"id": "task.read", "name": "查看任务", "description": "任务列表、进度、日志和结果"}, {"id": "task.create", "name": "创建任务", "description": "填写需求并使用已有流程"}, {"id": "task.start_on_create", "name": "创建时自动执行", "description": "提交后立即启动"}, {"id": "task.copy", "name": "复制任务", "description": "从已有任务复制创建"}, {"id": "task.ai_create", "name": "AI 创建助手", "description": "辅助整理任务标题与需求"}, {"id": "task.edit", "name": "修改任务", "description": "修改标题与描述"}, {"id": "task.chat", "name": "任务内交流", "description": "补充需求、与任务助手交流"}, {"id": "task.run", "name": "执行任务", "description": "启动已创建的任务"}, {"id": "task.stop", "name": "暂停或取消", "description": "暂停任务与步骤执行"}, {"id": "task.restart", "name": "恢复与重启", "description": "恢复步骤、重试消息"}, {"id": "task.review", "name": "人工审核", "description": "通过、驳回任务审核"}, {"id": "task.delete", "name": "删除任务", "description": "删除已有任务"}]}, {"name": "流程", "description": "设计流程与步骤", "items": [{"id": "workflow.read", "name": "查看流程", "description": "查看已有流程和步骤"}, {"id": "workflow.create", "name": "创建流程", "description": "新建流程、使用模板"}, {"id": "workflow.edit", "name": "编辑流程步骤", "description": "修改步骤、连线与提示词"}, {"id": "workflow.delete", "name": "删除流程", "description": "删除已有流程"}, {"id": "workflow.ai_edit", "name": "AI 流程助手", "description": "生成并应用流程方案"}, {"id": "workflow.hooks", "name": "流程钩子管理", "description": "配置触发和通知钩子"}]}, {"name": "项目会话", "description": "独立于任务的聊天", "items": [{"id": "session.read", "name": "查看会话历史", "description": "查看项目会话列表与消息"}, {"id": "session.create", "name": "创建项目会话", "description": "新建、分叉项目会话"}, {"id": "session.chat", "name": "项目对话", "description": "向项目会话发送消息"}, {"id": "session.manage", "name": "管理项目会话", "description": "重命名、归档和删除"}]}, {"name": "文件", "description": "浏览与修改项目文件", "items": [{"id": "file.read", "name": "查看文件", "description": "目录浏览、预览和下载"}, {"id": "file.upload", "name": "上传文件", "description": "上传文件、图片和附件"}, {"id": "file.edit", "name": "编辑文件", "description": "修改文件内容与项目记忆"}, {"id": "file.manage", "name": "管理文件目录", "description": "新建、重命名、移动与删除"}]}, {"name": "Git", "description": "版本管理与远端操作", "items": [{"id": "git.read", "name": "查看 Git", "description": "状态、历史与差异"}, {"id": "git.workspace", "name": "管理工作区", "description": "创建和删除工作树"}, {"id": "git.write", "name": "Git 本地操作", "description": "提交、切换分支与合并"}, {"id": "git.remote", "name": "Git 远端操作", "description": "获取、拉取和推送"}]}, {"name": "其他", "description": "定时任务、分享与设置", "items": [{"id": "schedule.read", "name": "查看定时任务", "description": "配置与执行记录"}, {"id": "schedule.manage", "name": "管理定时任务", "description": "创建、修改和启停"}, {"id": "share.create", "name": "创建分享", "description": "创建项目或任务分享"}, {"id": "share.manage", "name": "管理分享", "description": "修改与撤销分享"}, {"id": "statistics.read", "name": "查看统计", "description": "用量统计与执行报告"}, {"id": "project.settings", "name": "修改项目设置", "description": "执行配置与并发设置"}, {"id": "action.run", "name": "运行快捷操作", "description": "运行项目与任务快捷按钮"}, {"id": "skill.manage", "name": "管理项目 Skills", "description": "添加、修改与重新扫描"}]}];const MODE="c";
const groups=CATALOG;
const all=groups.flatMap(g=>g.items);
const base=['task.read','workflow.read'];
const presets=[{id:'viewer',name:'只读查看者',description:'查看任务、结果和流程',keys:base},{id:'creator',name:'任务创建者',description:'按已有流程提交任务',keys:[...base,'task.create']},{id:'collaborator',name:'任务协作者',description:'创建、交流和跟进任务',keys:[...base,'task.create','task.chat','task.edit','task.run','task.stop','task.restart']},{id:'editor',name:'项目编辑者',description:'项目业务操作，分享另授权',keys:all.filter(i=>!i.id.startsWith('share.')).map(i=>i.id)}];
let selected=new Set(presets[1].keys),category=0,query='';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const chosen=all.filter(i=>selected.has(i.id));
 const matched=presets.find(p=>p.keys.length===selected.size&&p.keys.every(k=>selected.has(k)));
 document.querySelectorAll('[data-count]').forEach(n=>n.textContent=`已选 ${selected.size} 项`);
 document.querySelectorAll('[data-selected]').forEach(n=>n.innerHTML=chosen.length?chosen.map(i=>`<button class="chip" type="button" data-remove="${i.id}" aria-label="移除${i.name}">${i.name}<span aria-hidden="true">×</span></button>`).join(''):'<span class="muted">还未选择权限</span>');
 document.querySelectorAll('[data-preset-name]').forEach(n=>n.textContent=matched?matched.name:'自定义权限');
 document.querySelectorAll('[data-presets]').forEach(n=>n.innerHTML=presets.map(p=>`<button type="button" class="preset" data-preset="${p.id}" aria-pressed="${matched?.id===p.id}"><strong>${p.name}</strong><small>${p.description}</small></button>`).join(''));
 document.querySelectorAll('[data-category-nav]').forEach(n=>n.innerHTML=groups.map((g,i)=>`<button type="button" data-category="${i}" aria-pressed="${category===i}">${g.name}<span class="meta">${g.items.filter(p=>selected.has(p.id)).length}/${g.items.length}</span></button>`).join(''));
 const visible=MODE==='c'&&!query?[groups[category]]:groups;
 const content=visible.map(g=>{const items=g.items.filter(i=>(i.name+i.id+i.description+g.name).toLowerCase().includes(query));return items.length?`<section><div class="group-head"><h3>${g.name}</h3><span class="meta">${g.items.filter(i=>selected.has(i.id)).length}/${g.items.length} 已选</span></div><div class="options">${items.map(i=>`<label class="option"><input type="checkbox" data-key="${i.id}" ${selected.has(i.id)?'checked':''}><span><strong>${i.name}</strong><small>${i.description}</small></span></label>`).join('')}</div></section>`:''}).join('');
 document.querySelector('[data-permissions]').innerHTML=content||'<p class="empty">没有匹配的权限，请尝试其他关键词。</p>';
 document.querySelectorAll('[data-save]').forEach(n=>n.disabled=selected.size===0);
 document.querySelectorAll('[data-clear]').forEach(n=>n.disabled=selected.size===0);
 const denied=groups.filter(g=>g.items.every(i=>!selected.has(i.id))).map(g=>g.name);
 document.querySelectorAll('[data-denied]').forEach(n=>n.textContent=denied.length?denied.join('、')+'入口不开放':'按已勾选的具体权限开放入口');
}
document.addEventListener('change',event=>{const key=event.target.dataset.key;if(key){event.target.checked?selected.add(key):selected.delete(key);render()}if(event.target.id==='subject-type'){document.getElementById('subject').innerHTML=event.target.value==='group'?'<option>研发协作组</option><option>外部协作组</option>':'<option>演示用户</option><option>协作用户</option>';updateContext()}if(['subject','project','effect'].includes(event.target.id))updateContext()});
document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){query=event.target.value.trim().toLowerCase();render()}});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.preset){selected=new Set(presets.find(p=>p.id===b.dataset.preset).keys);render()}if(b.dataset.remove){selected.delete(b.dataset.remove);render()}if(b.dataset.category!==undefined){category=Number(b.dataset.category);render()}if(b.hasAttribute('data-clear')){selected.clear();render()}if(b.hasAttribute('data-reset')){selected=new Set(presets[1].keys);query='';document.querySelector('[data-search]').value='';render()}if(b.hasAttribute('data-save')){const name=document.getElementById('subject').value,project=document.getElementById('project').value,effect=document.getElementById('effect').value;document.getElementById('notice-text').textContent=`预览结果：向“${name}”分配“${project}”的 ${selected.size} 项${effect}权限。未写入真实平台。`;document.getElementById('notice').hidden=false}if(b.hasAttribute('data-dismiss'))document.getElementById('notice').hidden=true});
function updateContext(){document.querySelectorAll('[data-subject-summary]').forEach(n=>n.textContent=document.getElementById('subject').value);document.querySelectorAll('[data-project-summary]').forEach(n=>n.textContent=document.getElementById('project').value)}
render();updateContext();
</script></body></html>
