<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkStep · 移动端侧栏原型</title>
<style>
:root{--ink:#24262b;--muted:#93969e;--line:#ebecef;--blue:#0879e4;--soft:#edf5ff;--mobile-control-regular:32px;--mobile-control-touch:44px}
*{box-sizing:border-box}body{margin:0;background:#eff0f3;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button{border:0;background:none}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}[hidden]{display:none!important}.symbols{display:none}.stage{min-height:100dvh;display:flex;justify-content:center;align-items:center;gap:90px;padding:38px}.notes{width:310px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:600}.notes h1{font-size:32px;line-height:1.45;letter-spacing:-1px;margin:15px 0 20px}.notes p{color:#777d87;line-height:1.9}.notes ol{padding-left:20px;color:#686f7a;line-height:2.4}.notes small{display:block;margin-top:28px;color:var(--muted);line-height:1.8}.phone{width:390px;height:844px;max-height:calc(100dvh - 76px);border:7px solid #fff;border-radius:38px;background:#fff;box-shadow:0 24px 80px #23324a1a;overflow:hidden;position:relative}.status{height:38px;padding:8px 20px 0;display:flex;justify-content:space-between;font-weight:600;font-size:12px}.screen{height:calc(100% - 38px);position:relative;background:#f8f9fb}.main{padding:23px 20px}.main header{display:flex;align-items:center;justify-content:space-between}.main h2{font-size:17px}.main h3{font-size:23px;margin-top:90px}.main p{color:#8d939d}.open{padding:0;width:32px;height:32px;display:grid;place-items:center}.shade{position:absolute;inset:0;background:#151b283d}.sidebar{position:absolute;inset:0 auto 0 0;width:calc(100% - 34px);background:white;display:flex;flex-direction:column;box-shadow:10px 0 30px #242c3510}.brand{height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0;white-space:nowrap}.logo{width:25px;height:25px;display:grid;place-items:center;background:#e9f4ff;border-radius:8px;color:var(--blue)}.brand strong{font-size:17px;letter-spacing:-.5px}.connected{display:flex;align-items:center;gap:4px;color:#278d5d;font-size:10px}.intro{margin-left:auto;padding:0 3px;height:var(--mobile-control-regular);font-size:12px;color:#656b74}.dot{width:5px;height:5px;border-radius:50%;background:#28a468}.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:8px}.icon:hover{background:#f0f2f5}.close{width:24px;flex-shrink:0;color:#7d818a}.quick{padding:4px 12px max(4px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0}.primary{height:var(--mobile-control-touch);width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px;background:var(--soft);color:#096fcd;border-radius:10px;padding:0 12px;font-weight:600}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tools button{height:var(--mobile-control-regular);display:flex;align-items:center;justify-content:center;gap:6px;padding:0;font-size:12px;border-radius:7px;color:#656b74}.tools button:hover{background:#f5f6f8}.tools svg{width:16px;height:16px}.scroll{display:grid;grid-template-rows:minmax(0,2fr) minmax(0,1fr);min-height:0;flex:1;padding:0 12px}.recent-section,.projects{min-height:0;display:flex;flex-direction:column;overflow:hidden}.section-title{flex-shrink:0}.section-list{min-height:0;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#dedfe4 transparent}.section-title{display:flex;align-items:center;justify-content:space-between;padding:13px 9px 7px}.recent-heading{height:32px;padding:0 9px}.section-title h2{flex:1;font-size:11px;color:#8c9099;font-weight:500;margin:0}.section-title .icon{height:24px;width:24px;color:#9ca0a8}.section-title svg{width:15px;height:15px}.chat{width:100%;height:var(--mobile-control-regular);border-radius:9px;display:flex;align-items:center;text-align:left;gap:10px;padding:0 10px}.chat:hover{background:#f6f7f9}.chat.active{background:#f0f5fc}.chat>svg{width:16px;height:16px;color:#979ca5}.chat.active>svg{color:var(--blue)}.chat-title{display:block;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat.active .chat-title{color:#0867c4}.projects{padding-top:0}.projects>.section-title{height:32px;padding:0 9px}.recent-section{border-top:1px solid var(--line)}.project{display:flex;align-items:center;gap:9px;width:100%;height:40px;padding:0 10px;text-align:left;border-radius:8px;font-size:13px}.project:hover{background:#f6f7f9}.project svg{width:17px;height:17px;color:#8b929c}.project .chevron{width:12px;height:12px;margin-left:auto}.project.current{background:#f6f7f9}.project.current>svg:first-child{color:var(--blue)}.project-detail{padding-left:32px}.project-detail button{display:flex;align-items:center;gap:7px;width:100%;height:32px;text-align:left;font-size:12px;color:#858b95}.project-detail svg{width:14px;height:14px}.search{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;margin:5px 0;color:var(--ink)}.toast{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#252c38;color:white;font-size:12px;border-radius:9px;z-index:3;max-width:90%;width:max-content}.empty{font-size:12px;color:#969ca6;padding:20px 10px}.preview-label{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#a5a9b0;font-size:11px}
@media(max-width:760px){.stage{padding:0;display:block}.notes{display:none}.phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}.status{display:none}.screen{height:100%}.sidebar{width:min(350px,calc(100% - 34px))}.brand{padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top))}.preview-label{display:none}}
.project-detail summary{display:flex;align-items:center;gap:7px;min-height:32px;font-size:12px;color:#858b95;cursor:pointer;list-style:none}.project-detail summary::-webkit-details-marker{display:none}.project-detail summary::before{content:"›";font-size:16px}.project-detail details[open]>summary::before{transform:rotate(90deg)}.project-detail details>button{padding-left:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}.tab-active{color:var(--blue);border-bottom:2px solid var(--blue)}
.project-search{display:flex;align-items:center;gap:4px;min-width:0;width:150px;height:26px;margin-right:5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:#9ca0a8}.project-search svg{width:14px;height:14px}.project-search input{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-size:11px;padding:0}.project-search:focus-within{outline:2px solid var(--blue);outline-offset:1px}
</style>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M4 3v18h17M9 16v-5m5 5V6m5 10V9"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h4l1-3 3-1 2-3-2-2 1-3-3-2-1-3Z"/><circle cx="10.5" cy="11.5" r="3"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs></svg>
<div class="stage">
<aside class="notes"><span class="eyebrow">WORKSTEP / MOBILE NAVIGATION</span><h1>接着聊，<br>不用先找项目。</h1><p>把常用入口放在手边，让最近的聊天成为打开侧栏后的第一站。</p><ol><li>统计、定时、设置在左下方同排显示</li><li>下方 1/3 显示最近 20 条对话</li><li>上方保留项目、流程与会话的展开收缩</li></ol><small>交互原型 · 使用虚构演示数据<br>点击聊天可更新本地顺序，刷新后保留。<br>仅保存最近访问索引，不复制聊天正文。</small></aside>
<div class="phone"><div class="status"><span>9:41</span><span>▴▴▴ &nbsp; Wi-Fi &nbsp; ▰</span></div><div class="screen">
<main class="main"><header><button class="open" aria-label="打开菜单"><svg><use href="#menu"/></svg></button><b>WorkStep</b><svg><use href="#plus"/></svg></header><h3 id="page-title">移动端侧栏</h3><p id="page-description">打开菜单，继续最近的聊天。</p></main>
<div class="shade"></div><nav class="sidebar" aria-label="主导航">
<header class="brand"><span class="logo"><svg><use href="#plus"/></svg></span><strong>WorkStep</strong><span class="connected"><i class="dot"></i>网关已连接</span><button class="intro" data-preview="产品介绍">介绍</button><button class="icon close" aria-label="关闭菜单"><svg><use href="#close"/></svg></button></header>

<div class="scroll"><section class="projects"><div class="section-title"><h2>项目</h2><label class="project-search" id="project-search-field" hidden><input id="project-search" type="search" placeholder="搜索项目" aria-label="搜索项目"></label><button class="icon" id="project-search-toggle" aria-label="搜索项目" aria-expanded="false" aria-controls="project-search-field"><svg><use href="#search"/></svg></button><button class="icon" data-preview="添加项目" aria-label="添加项目"><svg><use href="#plus"/></svg></button></div><div class="section-list"><button class="project current" id="project-toggle" aria-expanded="true"><svg><use href="#folder"/></svg>操作手册演示<svg class="chevron"><use href="#down"/></svg></button><div class="project-detail" id="project-detail"><details open><summary><svg><use href="#folder"/></svg>流程</summary><button data-preview="示例审核流程">示例审核流程</button></details><details open><summary><svg><use href="#chat"/></svg>对话 <span class="tab-active">普通 12</span><span>渠道 3</span></summary><button data-preview="整理下一版的产品想法">整理下一版的产品想法</button><button data-preview="帮我梳理发布检查清单">帮我梳理发布检查清单</button><button data-preview="为项目配置一个审核流程">为项目配置一个审核流程</button><button data-preview="消息组件的展示方式">消息组件的展示方式</button><button data-preview="项目分享">项目分享</button></details></div><button class="project" data-preview="示例网站"><svg><use href="#folder"/></svg>示例网站</button><button class="project" data-preview="默认工作区"><svg><use href="#folder"/></svg>默认工作区</button></div></section>
<section class="recent-section"><div class="section-title recent-heading"><h2>最近聊天</h2></div><div id="recent" class="section-list"></div></section></div>

<div class="quick"><div class="tools"><button data-preview="数据统计"><svg><use href="#chart"/></svg>数据统计</button><button data-preview="定时任务"><svg><use href="#clock"/></svg>定时任务</button><button data-preview="设置"><svg><use href="#settings"/></svg>设置</button></div></div>
</nav><div class="toast" role="status" hidden></div></div></div></div>
<script>
const key='workstep-mobile-sidebar-prototype-v1';
const seed=[{id:'a',title:'整理下一版的产品想法',project:'操作手册演示',age:4,active:true},{id:'b',title:'首页布局和移动端适配',project:'示例网站',kind:'task',age:85},{id:'c',title:'帮我梳理发布检查清单',project:'操作手册演示',age:180},{id:'d',title:'为项目配置一个审核流程',project:'操作手册演示',kind:'task',age:1300},{id:'e',title:'导航栏的几个优化方向',project:'示例网站',age:1600},{id:'f',title:'从一个简单的想法开始',project:'默认工作区',age:3100}].map(x=>({...x,kind:x.kind||'conversation',visited:Date.now()-x.age*60000}));
let chats=seed,selected='a',toastTimer;
try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.every(x=>typeof x.id==='string'&&typeof x.title==='string'&&typeof x.project==='string'&&Number.isFinite(x.visited)))chats=saved.map(x=>({...x,kind:x.kind||seed.find(y=>y.id===x.id)?.kind||'conversation'}))}catch{}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(key,JSON.stringify(chats))}catch{toast('本地存储不可用，本次会话内保留')}}
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const use=document.createElementNS(svg.namespaceURI,'use');use.setAttribute('href','#'+name);svg.append(use);return svg}
function render(){
 const target=$('recent');target.replaceChildren();
 chats.sort((a,b)=>b.visited-a.visited).slice(0,20).forEach(x=>{
  const b=document.createElement('button');b.className='chat'+(x.id===selected?' active':'');
  if(x.id===selected)b.setAttribute('aria-current','page');
  b.append(icon('chat'));
  const title=document.createElement('span');title.className='chat-title';title.textContent=x.title;b.append(title);
  b.onclick=()=>{selected=x.id;x.visited=Date.now();save();render();$('page-title').textContent=x.title;$('page-description').textContent=x.project+' · '+(x.kind==='task'?'任务详情':'原有对话')+'（原型演示）';toggle(false)};
  target.append(b);
 });
 if(!target.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=chats.length?'没有匹配的聊天':'访问过的聊天会显示在这里';target.append(empty)}
}
function toggle(open){document.querySelector('.sidebar').hidden=!open;document.querySelector('.shade').hidden=!open;if(!open)document.querySelector('.open').focus()}
document.querySelector('.close').onclick=()=>toggle(false);document.querySelector('.shade').onclick=()=>toggle(false);document.querySelector('.open').onclick=()=>toggle(true);
$('project-toggle').onclick=()=>{const open=$('project-detail').hidden;$('project-detail').hidden=!open;$('project-toggle').setAttribute('aria-expanded',String(open))};
function toast(text){const el=document.querySelector('.toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2300)}
document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>toast(b.dataset.preview+' · 此处为入口位置演示'));
$('project-search-toggle').onclick=()=>{const open=$('project-search-field').hidden;$('project-search-field').hidden=!open;$('project-search-toggle').setAttribute('aria-expanded',String(open));if(open)$('project-search').focus();else{$('project-search').value='';$('project-search').dispatchEvent(new Event('input'))}};
$('project-search').oninput=()=>{const query=$('project-search').value.trim().toLowerCase();document.querySelectorAll('.projects .project').forEach(button=>{const visible=button.textContent.toLowerCase().includes(query);button.hidden=!visible;if(button.id==='project-toggle')$('project-detail').hidden=!visible||button.getAttribute('aria-expanded')!=='true'})};
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});render();
</script>
</body>
</html>
