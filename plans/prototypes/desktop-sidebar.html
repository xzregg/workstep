-step small{font-size:10px;color:#a1a9b5}.composer-wrap{flex-shrink:0;padding:12px 36px 20px}.composer{max-width:760px;margin:auto;border:1px solid #dfe3e9;border-radius:14px;background:#fff;box-shadow:0 2px 8px #19263904}.composer textarea{resize:none;display:block;width:100%;height:62px;border:0;background:transparent;padding:14px 16px 5px;outline:none;color:var(--ink);font-size:12px}.composer-bar{display:flex;align-items:center;gap:6px;padding:5px 10px 8px;color:#9aa2ae}.composer-bar .config{border:1px solid #eceef1;border-radius:5px;padding:3px 7px;color:#8b94a1;font-size:10px}.composer-bar .send{margin-left:auto;width:28px;height:28px;background:var(--blue);border-radius:8px;color:white}.composer-note{text-align:center;font-size:10px;color:#b3b8c1;margin-top:9px}.context-menu{position:fixed;width:170px;padding:5px;border:1px solid #e5e8ee;border-radius:10px;background:white;box-shadow:0 10px 35px #182a4520;z-index:10}.context-menu button{width:100%;height:32px;display:flex;align-items:center;gap:9px;padding:0 9px;font-size:12px;text-align:left;border-radius:6px;color:#666f7b}.context-menu button.danger{color:#d05b5b}.context-menu svg{width:14px;height:14px}.context-menu p{font-size:11px;line-height:1.7;color:#969eaa;margin:6px 9px}.context-menu input{height:30px;width:100%;border:1px solid var(--line);border-radius:6px;font-size:12px;padding:0 8px}.context-menu .save{color:var(--blue)}.empty{font-size:11px;color:#a0a7b1;padding:12px 8px}.toast{position:fixed;bottom:30px;left:calc(50% + 100px);transform:translateX(-50%);padding:9px 15px;border-radius:9px;background:#303947;color:white;font-size:12px;z-index:20}.prototype-note{position:absolute;right:23px;bottom:5px;font-size:10px;color:#bcc2cc;pointer-events:none}

.rail-button::after{content:attr(aria-label);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:100;padding:6px 10px;background:#292e35;color:white;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;visibility:hidden}.rail-button:hover::after,.rail-button:focus-visible::after{visibility:visible}

<div class="prototype-bar"><strong>WorkStep · PC 侧栏交互原型</strong><span>Codex 布局参考 · 虚构演示数据 · 可拖动侧栏分隔线</span></div>
<div class="app">
<nav class="tool-rail" aria-label="常用功能">
  <button class="rail-button" data-preview="数据统计" aria-label="数据统计" title="数据统计"><svg><use href="#chart"/></svg></button>
  <button class="rail-button" data-preview="定时任务" aria-label="定时任务" title="定时任务"><svg><use href="#clock"/></svg></button>
  <button class="rail-button" data-preview="角色中心" aria-label="角色中心" title="角色中心"><svg><use href="#drama"/></svg></button>

  <header class="brand"><span class="logo"><svg><use href="#workflow"/></svg></span><strong>WorkStep</strong><span class="connected" title="网关已连接"><i class="dot"></i><span>网关已连接</span></span><button class="intro" data-preview="产品介绍">介绍</button></header>
  <div class="sidebar-tools"><button class="new-chat" id="new-chat"><svg><use href="#edit"/></svg>新对话</button><button class="workspace-switch" data-preview="切换工作区">本机工作区<svg><use href="#chevron"/></svg></button></div>

<script>
const $=id=>document.getElementById(id),storageKey='workstep.desktop-sidebar-prototype.v1';
const projectNames=['操作手册演示','示例网站','默认工作区'];
const entries=[
 ['a','整理下一版的产品想法',0,'session',4],['b','首页布局和移动端适配',1,'task',32],
 ['c','帮我梳理发布检查清单',0,'session',85],['d','为项目配置一个审核流程',0,'task',130],
 ['e','导航栏的几个优化方向',1,'session',180],['f','消息组件的展示方式',0,'session',260],
 ['g','整理产品说明文档',0,'task',430],['h','从一个简单的想法开始',2,'session',720],
 ['i','新版本的任务验收',1,'task',1100],['j','项目分享与成员协作',0,'session',1400],
 ['k','移动端体验反馈',1,'session',1900],['l','发布前的检查',0,'task',2600],
].map(([id,title,project,kind,age])=>({id,title,project,kind,visited:Date.now()-age*60000}));
let catalog=new Map(entries.map(x=>[x.id,{...x}])),recent=entries.slice(0,20).map(x=>({...x})),selected='a',toastTimer,menuEntry=null;
try{const value=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(value)&&value.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&Number.isInteger(x.project)&&x.project>=0&&x.project<projectNames.length&&(x.kind==='task'||x.kind==='session')&&Number.isFinite(x.visited))){recent=value.sort((a,b)=>b.visited-a.visited).slice(0,20);recent.forEach(x=>catalog.set(x.id,{...catalog.get(x.id),...x}))}}catch{}
function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg'),u=document.createElementNS(s.namespaceURI,'use');u.setAttribute('href','#'+name);s.append(u);return s}
function button(label,className,action){const b=document.createElement('button');b.type='button';b.className=className;b.setAttribute('aria-label',label);b.title=label;b.onclick=action;return b}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2200)}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(recent))}catch{toast('本地存储不可用，本次会话内保留')}}
function relative(visited){const m=Math.max(0,Math.floor((Date.now()-visited)/60000));return m<1?'刚刚':m<60?m+'分前':m<1440?Math.floor(m/60)+'小时前':Math.floor(m/1440)+'天前'}
function row(entry,isRecent){const root=document.createElement('div');root.className='row'+(selected===entry.id?' active':'');const open=button(entry.title,'row-open',()=>visit(entry));open.append(icon(entry.kind==='task'?'workflow':'bot'));const title=document.createElement('span');title.className='truncate';title.textContent=entry.title;open.append(title);root.append(open);if(entry.id==='d'){const running=document.createElement('span');running.className='spinner';running.setAttribute('aria-label','运行中');root.append(running)}if(entry.id==='c'){const completed=document.createElement('span');completed.className='completion';completed.title='已完成，未读';root.append(completed)}const time=document.createElement('time');time.textContent=relative(entry.visited);time.dateTime=new Date(entry.visited).toISOString();time.title=new Date(entry.visited).toLocaleString('zh-CN');root.append(time);const archive=button('归档','more quick-archive',e=>{e.stopPropagation();archiveEntry(entry)});archive.append(icon('archive'));const more=button('更多操作','more',e=>{e.stopPropagation();showMenu(entry,e.currentTarget)});more.textContent='⋯';root.append(archive,more);root.oncontextmenu=e=>{e.preventDefault();showMenu(entry,root)};return root}
function renderRecent(){const list=$('recent');list.replaceChildren();recent.forEach(entry=>list.append(row(entry,true)));$('recent-count').textContent=recent.length;if(!recent.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='打开过的任务和对话会显示在这里';list.append(empty)}}
function renderProjects(){const list=$('projects'),previous=new Map(Array.from(list.querySelectorAll('details[data-key]')).map(x=>[x.dataset.key,x.open]));list.replaceChildren();const query=$('search').value.trim();projectNames.forEach((name,index)=>{if(query&&!name.includes(query))return;const p=document.createElement('details');p.className='project';p.dataset.key='p'+index;p.open=previous.get(p.dataset.key)??false;const summary=document.createElement('summary');summary.className='project-heading';summary.append(icon('folder'));const title=document.createElement('span');title.className='project-name';title.textContent=name;summary.append(title);if(index===0){const spin=document.createElement('span');spin.className='spinner';spin.setAttribute('aria-label','运行中');summary.append(spin)}const arrow=icon('chevron');arrow.classList.add('chevron');summary.append(arrow);p.append(summary);const content=document.createElement('div');content.className='project-content';const flow=document.createElement('details');flow.className='group';flow.dataset.key='f'+index;flow.open=previous.get(flow.dataset.key)??index===0;const flowHeading=document.createElement('summary');flowHeading.className='group-heading';flowHeading.append(icon('folder'),document.createTextNode('流程'));const addFlow=button('添加流程','icon',e=>{e.preventDefault();e.stopPropagation();toast('在此项目内添加流程 · 入口演示')});addFlow.append(icon('plus'));flowHeading.append(addFlow);flow.append(flowHeading);['研发流程','简单流程'].slice(0,index===2?1:2).forEach((name,i)=>{const r=document.createElement('div');r.className='row';const b=button(name,'row-open',()=>toast(name+' · 流程入口演示'));b.append(icon('workflow'));const text=document.createElement('span');text.className='truncate';text.textContent=name;b.append(text);r.append(b);if(i===0&&index===0){const fail=document.createElement('span');fail.className='failure';fail.title='执行失败';r.append(fail)}const count=document.createElement('span');count.className='node-count';count.textContent=i===0?'8步':'2步';r.append(count);flow.append(r)});content.append(flow);const line=document.createElement('div');line.className='group-line';content.append(line);const chat=document.createElement('details');chat.className='group';chat.dataset.key='c'+index;chat.open=previous.get(chat.dataset.key)??index===0;const heading=document.createElement('summary');heading.className='group-heading';heading.append(icon('folder'),document.createTextNode('对话'));const tabs=document.createElement('span');tabs.className='tabs';['普通','渠道'].forEach((text,i)=>{const tab=button(text,'tab'+(i===0?' active':''),e=>{e.preventDefault();e.stopPropagation();tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');chat.querySelector('.channel-empty').hidden=i===0;chat.querySelector('.project-chat-list').hidden=i!==0});tab.textContent=text+(i===0?' '+Array.from(catalog.values()).filter(x=>x.project===index&&x.kind==='session'&&!x.removed).length:' 0');tabs.append(tab)});heading.append(tabs);const addChat=button('在'+name+'新建对话','icon',e=>{e.preventDefault();e.stopPropagation();createChat(index)});addChat.append(icon('plus'));heading.append(addChat);chat.append(heading);const chatList=document.createElement('div');chatList.className='project-chat-list';Array.from(catalog.values()).filter(x=>x.project===index&&x.kind==='session'&&!x.removed).forEach(entry=>chatList.append(row(entry,false)));const empty=document.createElement('div');empty.className='empty channel-empty';empty.hidden=true;empty.textContent='暂无渠道对话';chat.append(chatList,empty);content.append(chat);p.append(content);list.append(p)});if(!list.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的项目';list.append(empty)}}
function visit(entry){hideMenu();selected=entry.id;const now=Math.max(Date.now(),(recent[0]?.visited||0)+1);const updated={...entry,visited:now};catalog.set(entry.id,{...catalog.get(entry.id),...updated});recent=[updated,...recent.filter(x=>x.id!==entry.id)].slice(0,20);save();renderRecent();renderProjects();renderPage(updated)}
function renderPage(entry){const task=entry.kind==='task';$('breadcrumb-project').textContent=projectNames[entry.project];$('breadcrumb-type').textContent=task?'任务详情':'对话';$('header-icon').querySelector('use').setAttribute('href',task?'#workflow':'#bot');$('page-kicker').textContent=projectNames[entry.project]+' · '+(task?'任务详情':'对话');$('page-title').textContent=entry.title;$('page-subtitle').textContent=task?'研发流程 · 当前步骤与过程记录':'Claude Agent SDK · Sonnet · 自动模式';$('page-status').className='badge'+(entry.id==='d'?' running':'');$('page-status').textContent=entry.id==='d'?'运行中':'已完成';if(entry.id==='d'){const spin=document.createElement('span');spin.className='spinner';$('page-status').prepend(spin)}$('page-content').innerHTML=task?'<div class="task-summary"><span>研发流程</span><span>3 个步骤</span><span>执行过程</span></div><div class="task-step"><span class="step-number">1</span><span class="step-title">梳理需求与约束</span><small>已完成</small></div><div class="task-step"><span class="step-number">2</span><span class="step-title">实现与验证</span><small>当前步骤</small></div><div class="task-step"><span class="step-number">3</span><span class="step-title">审核与交付</span><small>待执行</small></div><p class="empty">此区域用于演示：最近任务会回到对应任务详情。</p>':'<div class="message user"><div class="user-bubble">帮我整理一下下一版的产品想法，优先改善每天都会用到的操作。</div></div><div class="message"><div class="assistant-label"><svg><use href="#bot"/></svg>WorkStep <span>·</span> Claude Agent SDK</div><div class="assistant-body"><p>可以先从侧栏的日常使用路径开始，让<strong>找到项目、继续对话</strong>更顺手。</p><ul><li>项目与最近聊天分别滚动，分区标题始终可见。</li><li>最近访问按打开顺序排列，保留 20 条本地记录。</li><li>任务使用流程图标，对话使用机器人图标。</li><li>时间和操作菜单留在右侧，原有状态提示继续保留。</li></ul><p>项目下的流程、普通对话和渠道对话，仍然保持原来的展开收缩方式。</p></div><div class="message-meta"><svg><use href="#check"/></svg>已完成<span>·</span>Sonnet<span>·</span>12 秒<button class="icon" data-copy aria-label="复制示例回复"><svg><use href="#copy"/></svg></button></div></div>';$('composer').placeholder=task?'给这项任务补充说明…':'继续这段对话…'}
function createChat(project){const entry={id:'demo-'+Date.now(),title:'新的演示对话',project,kind:'session',visited:Date.now()};catalog.set(entry.id,entry);visit(entry);toast('已在「'+projectNames[project]+'」新建演示对话')}
function archiveEntry(entry){catalog.get(entry.id).removed=true;recent=recent.filter(x=>x.id!==entry.id);save();hideMenu();renderRecent();renderProjects();toast('已归档演示记录，并从最近聊天移除')}
function hideMenu(){$('context-menu').hidden=true;menuEntry=null}
function showMenu(entry,anchor){menuEntry=entry;const menu=$('context-menu'),rect=anchor.getBoundingClientRect();menu.replaceChildren();[['archive','归档',()=>archiveEntry(entry)],['edit','重命名',()=>renameMenu(entry)],['trash','删除',()=>deleteMenu(entry)]].forEach(([name,label,action])=>{const b=button(label,name==='trash'?'danger':'',action);b.append(icon(name),document.createTextNode(label));menu.append(b)});menu.style.left=Math.max(8,Math.min(innerWidth-178,rect.right-170))+'px';menu.style.top=Math.max(34,Math.min(innerHeight-155,rect.bottom+4))+'px';menu.hidden=false;menu.querySelector('button').focus()}
function renameMenu(entry){const menu=$('context-menu');menu.replaceChildren();const label=document.createElement('p');label.textContent='重命名';const input=document.createElement('input');input.value=entry.title;input.setAttribute('aria-label','新的标题');const saveButton=button('保存','save',()=>{const title=input.value.trim();if(!title)return;catalog.get(entry.id).title=title;recent=recent.map(x=>x.id===entry.id?{...x,title}:x);save();hideMenu();renderRecent();renderProjects();if(selected===entry.id)renderPage(catalog.get(entry.id))});saveButton.textContent='保存';input.oninput=()=>saveButton.disabled=!input.value.trim();input.onkeydown=e=>{if(e.key==='Enter')saveButton.click()};menu.append(label,input,saveButton);input.focus();input.select()}
function deleteMenu(entry){const menu=$('context-menu');menu.replaceChildren();const text=document.createElement('p');text.textContent='删除这条演示记录？';const confirm=button('确认删除','danger',()=>{catalog.get(entry.id).removed=true;recent=recent.filter(x=>x.id!==entry.id);save();hideMenu();renderRecent();renderProjects();toast('已删除演示记录')});confirm.append(icon('trash'),document.createTextNode('确认删除'));menu.append(text,confirm);confirm.focus()}
$('new-chat').onclick=e=>{const menu=$('context-menu'),rect=e.currentTarget.getBoundingClientRect();menuEntry=null;menu.replaceChildren();const label=document.createElement('p');label.textContent='选择项目，新建对话';menu.append(label);projectNames.forEach((name,index)=>{const b=button(name,'',()=>{hideMenu();createChat(index)});b.append(icon('folder'),document.createTextNode(name));menu.append(b)});menu.style.left=rect.left+'px';menu.style.top=rect.bottom+'px';menu.hidden=false;menu.querySelector('button').focus()};
$('search-toggle').onclick=()=>{const open=$('search').hidden;$('search').hidden=!open;$('search-toggle').setAttribute('aria-expanded',String(open));if(open)$('search').focus();else{$('search').value='';renderProjects()}};$('search').oninput=renderProjects;
document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>toast(b.dataset.preview+' · 入口位置演示'));
document.addEventListener('click',e=>{if(!e.target.closest('#context-menu')&&!e.target.closest('.more')&&!e.target.closest('#new-chat'))hideMenu();if(e.target.closest('[data-copy]'))toast('示例回复复制入口')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideMenu();if(!$('search').hidden){$('search').hidden=true;$('search').value='';$('search-toggle').setAttribute('aria-expanded','false');renderProjects()}}});
const divider=$('divider');function setWidth(value){const width=Math.max(240,Math.min(380,value));document.documentElement.style.setProperty('--sidebar-width',width+'px');divider.setAttribute('aria-valuenow',String(width))}divider.onpointerdown=e=>{const start=e.clientX,width=document.querySelector('.sidebar').getBoundingClientRect().width;divider.setPointerCapture(e.pointerId);divider.onpointermove=event=>setWidth(width+event.clientX-start);divider.onpointerup=divider.onpointercancel=()=>{divider.onpointermove=null}};divider.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setWidth(Number(divider.getAttribute('aria-valuenow'))+(e.key==='ArrowRight'?10:-10))}};
$('send').onclick=()=>{const value=$('composer').value.trim();if(!value)return;const message=document.createElement('div');message.className='message user';const bubble=document.createElement('div');bubble.className='user-bubble';bubble.textContent=value;message.append(bubble);$('page-content').append(message);$('composer').value='';message.scrollIntoView({block:'nearest',behavior:'smooth'});toast('仅演示输入效果，不会调用引擎')};
save();renderProjects();renderRecent();renderPage(catalog.get(selected));setInterval(()=>{if($('context-menu').hidden)renderRecent()},60000);
</script>
</body>
