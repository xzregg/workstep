<style>
#role-studio{color-scheme:light dark;--rs-bg:light-dark(#fff,#191b21);--rs-soft:light-dark(#f5f5f7,#23262e);--rs-paper:light-dark(#fbfbfd,#20232b);--rs-ink:light-dark(#1d1d1f,#eef0f6);--rs-muted:light-dark(#6e6e73,#a6acbb);--rs-line:light-dark(#e8e8ed,#353a46);--rs-blue:light-dark(#0071e3,#73b4ff);--rs-fill:light-dark(#0071e3,#2778d1);--rs-tint:light-dark(#eef5ff,#25384e);--rs-violet:light-dark(#7c3aed,#b99aff);--rs-error:light-dark(#dc2626,#ffaaaa);--rs-shadow:light-dark(#1d1d1f18,#1d1d1f50);font:15px/1.55 system-ui,-apple-system,'PingFang SC',sans-serif;color:var(--rs-ink);background:var(--rs-bg);border:1px solid var(--rs-line);border-radius:18px;overflow:hidden;position:relative;text-align:left}
#role-studio *{box-sizing:border-box}#role-studio [hidden]{display:none!important}
#role-studio button,#role-studio input,#role-studio select,#role-studio textarea{font:inherit;color:inherit}
#role-studio button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--rs-bg);border:1px solid var(--rs-line);border-radius:12px;padding:7px 12px}
#role-studio button:hover{background:var(--rs-soft)}#role-studio button:disabled{opacity:.4;cursor:default}
#role-studio button.primary{background:var(--rs-fill);border-color:var(--rs-fill);color:#fff}
#role-studio button.ghost{background:transparent;border-color:transparent}
#role-studio button.icon{width:32px;height:32px;padding:0}
#role-studio svg{width:16px;height:16px;flex-shrink:0}
#role-studio h1,#role-studio h2,#role-studio h3,#role-studio p{margin:0}
#role-studio h1,#role-studio h2{font-size:20px;font-weight:600}#role-studio h3{font-size:15px;font-weight:600}
#role-studio .muted{color:var(--rs-muted)}#role-studio .small{font-size:12px}
#role-studio .row{display:flex;align-items:center;gap:9px}#role-studio .wrap{flex-wrap:wrap}#role-studio .between{justify-content:space-between}#role-studio .grow{flex:1;min-width:0}
#role-studio .chrome{height:49px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--rs-paper);border-bottom:1px solid var(--rs-line)}
#role-studio .logo{width:27px;height:27px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--rs-fill),#7c3aed);color:#fff;font-weight:600}
#role-studio .demo-label{margin-left:auto;padding-right:76px;font-size:12px;color:var(--rs-muted)}
#role-studio .page-head{padding:24px 24px 18px}#role-studio .page-head p{color:var(--rs-muted);margin-top:5px;font-size:12px}
#role-studio .tabs{display:flex;gap:25px;margin:0 24px;border-bottom:1px solid var(--rs-line)}
#role-studio .tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 0;color:var(--rs-muted);background:transparent}
#role-studio .tabs button[aria-selected=true]{border-bottom-color:var(--rs-blue);color:var(--rs-blue)}
#role-studio .pill{padding:2px 7px;background:var(--rs-soft);color:var(--rs-muted);font-size:11px;border-radius:999px;white-space:nowrap}
#role-studio .workspace{display:grid;grid-template-columns:151px minmax(0,1fr) 350px;min-height:650px}
#role-studio .categories{padding:20px 12px;background:var(--rs-paper);border-right:1px solid var(--rs-line)}
#role-studio .categories .label{margin:0 10px 12px;color:var(--rs-muted);font-size:12px}
#role-studio .category{width:100%;display:flex;justify-content:space-between;border:0;margin-bottom:5px;padding:9px 10px;background:transparent}
#role-studio .category[aria-pressed=true]{background:var(--rs-tint);color:var(--rs-blue)}
#role-studio .category-note{border-top:1px solid var(--rs-line);margin:22px 9px 0;padding-top:16px;font-size:12px;color:var(--rs-muted)}
#role-studio .library{padding:20px;min-width:0}
#role-studio .library-head{margin-bottom:16px;font-size:12px;color:var(--rs-muted)}
#role-studio .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#role-studio .role-card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;text-align:left;padding:15px;min-width:0;min-height:197px;border-radius:14px;background:var(--rs-bg)}
#role-studio .role-card[aria-pressed=true]{border-color:var(--rs-blue);background:var(--rs-tint)}
#role-studio .role-card .name{font-weight:600;display:block;overflow-wrap:anywhere}
#role-studio .avatar{width:34px;height:34px;border-radius:12px;background:var(--rs-soft);color:var(--rs-ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
#role-studio .role-card .summary{font-size:12px;color:var(--rs-muted);min-height:37px}
#role-studio .role-card .excerpt{font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--rs-muted);border-top:1px solid var(--rs-line);padding-top:9px;overflow-wrap:anywhere}
#role-studio .role-card .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--rs-muted);margin-top:auto;gap:5px}
#role-studio .inspector{background:var(--rs-paper);border-left:1px solid var(--rs-line);display:flex;flex-direction:column;min-width:0}
#role-studio .inspector-head{padding:18px 20px;border-bottom:1px solid var(--rs-line)}
#role-studio .inspector-head .row{margin-bottom:4px}
#role-studio .editor{padding:18px 20px;flex:1;min-width:0}
#role-studio .field{display:block;margin-bottom:14px;font-size:12px;color:var(--rs-muted)}
#role-studio .field input,#role-studio .field textarea,#role-studio .field select{display:block;width:100%;margin-top:6px;border:1px solid var(--rs-line);border-radius:12px;background:var(--rs-bg);padding:9px 10px;color:var(--rs-ink)}
#role-studio .field textarea{resize:vertical;min-height:86px}#role-studio .field textarea.prompt{min-height:282px;font-size:12px;line-height:1.8}
#role-studio .two-fields{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px}
#role-studio .field-caption{font-size:11px;margin-top:6px;color:var(--rs-muted)}
#role-studio .references{border-top:1px solid var(--rs-line);padding-top:13px;margin-top:15px;font-size:12px;color:var(--rs-muted)}
#role-studio .references button{font-size:12px;margin:7px 5px 0 0;padding:4px 8px;background:var(--rs-bg)}
#role-studio .editor-footer{padding:14px 20px;border-top:1px solid var(--rs-line);background:var(--rs-paper)}
#role-studio .save-status{font-size:11px;color:var(--rs-muted)}
#role-studio .validation{color:var(--rs-error);font-size:12px;min-height:19px;margin-bottom:8px}
#role-studio .team-card{min-height:210px}
#role-studio .faces{display:flex;flex-wrap:wrap;gap:5px}
#role-studio .faces .avatar{width:26px;height:26px;font-size:12px}
#role-studio .team-members-label{margin-bottom:9px}
#role-studio .member-select{display:block;margin:6px 0;border:1px solid var(--rs-line);border-radius:12px;background:var(--rs-bg);padding:10px}
#role-studio .member-select.checked{border-color:var(--rs-blue);background:var(--rs-tint)}
#role-studio .member-select label{display:flex;align-items:center;gap:9px}
#role-studio input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin:0;accent-color:var(--rs-fill)}
#role-studio .member-select .avatar{width:25px;height:25px;font-size:12px}
#role-studio .member-select .member-meta{font-size:11px;color:var(--rs-muted);margin-left:25px;margin-top:5px}
#role-studio .member-select input.duty{width:calc(100% - 25px);margin-left:25px;margin-top:7px;background:var(--rs-bg);border:1px solid var(--rs-line);border-radius:12px;padding:7px 8px;font-size:12px}
#role-studio .member-select .prompt-link{padding:2px 0;font-size:11px;color:var(--rs-blue);border:0;background:transparent;margin-left:25px}
#role-studio .member-select .prompt-peek{font-size:12px;color:var(--rs-muted);margin:7px 0 0 25px;white-space:pre-wrap;overflow-wrap:anywhere}
#role-studio .notice{padding:11px 12px;border:1px solid var(--rs-line);border-radius:12px;background:var(--rs-bg);font-size:12px;color:var(--rs-muted);margin-top:15px}
#role-studio .overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--rs-shadow)}
#role-studio .confirm{max-width:360px;width:100%;padding:24px;border-radius:14px;background:var(--rs-bg);border:1px solid var(--rs-line);box-shadow:0 15px 45px var(--rs-shadow)}
#role-studio .confirm p{margin:12px 0 20px;color:var(--rs-muted);font-size:12px}#role-studio .confirm .actions{justify-content:flex-end}
#role-studio .toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:12px;background:var(--rs-ink);color:var(--rs-bg);max-width:90%;font-size:12px}
#role-studio .empty{padding:30px 10px;text-align:center;color:var(--rs-muted);font-size:12px}
@media(min-width:1200px){#role-studio .workspace{grid-template-columns:170px minmax(0,1fr) 390px}}
@media(max-width:900px){#role-studio .workspace{grid-template-columns:135px minmax(0,1fr) 310px}#role-studio .cards{grid-template-columns:1fr}#role-studio .library{padding:16px}#role-studio .role-card{min-height:164px}#role-studio .role-card .excerpt{-webkit-line-clamp:2}}
@media(max-width:700px){#role-studio .workspace{grid-template-columns:1fr;min-height:0}#role-studio .categories{display:flex;gap:5px;overflow:auto;border-right:0;border-bottom:1px solid var(--rs-line);padding:12px}#role-studio .categories .label,#role-studio .category-note{display:none}#role-studio .category{width:auto;white-space:nowrap;gap:10px;margin:0;padding:8px 10px}#role-studio .cards{grid-template-columns:repeat(2,minmax(0,1fr))}#role-studio .inspector{border-left:0;border-top:1px solid var(--rs-line)}#role-studio .demo-label{padding-right:0}#role-studio .page-head{padding:18px}#role-studio .tabs{margin:0 18px}#role-studio .field textarea.prompt{min-height:290px}#role-studio .library{padding:18px}#role-studio .inspector-head,#role-studio .editor,#role-studio .editor-footer{padding:18px}#role-studio .editor-footer{position:sticky;bottom:0}#role-studio .member-select .prompt-link{padding:6px 0}}
@media(max-width:400px){#role-studio .cards{grid-template-columns:1fr}#role-studio .page-head .row{align-items:flex-start;gap:12px}#role-studio .page-head button{white-space:nowrap;font-size:12px}#role-studio .chrome{padding:0 14px}#role-studio .chrome .muted{display:none}#role-studio .two-fields{grid-template-columns:1fr}#role-studio .field input,#role-studio .field textarea,#role-studio .field select{font-size:16px}#role-studio .field textarea.prompt{font-size:16px}#role-studio .editor-footer .row{flex-wrap:wrap}#role-studio .save-status{flex:1}#role-studio .demo-label{font-size:11px}}
</style>
<div id="role-studio" aria-label="WorkStep 角色库与专家团原型">
  <div class="chrome"><span class="logo">W</span><strong>WorkStep</strong><span class="muted small">/ 设置</span><span class="demo-label">角色与专家团 · 原型</span></div>
  <header class="page-head"><div class="row between"><div><h1>角色与专家团</h1><p>定义专业角色，再把角色组合成专家团。</p></div><button class="primary cursor-interaction" data-action="create" id="rs-create"><i data-lucide="plus" aria-hidden="true"></i>新增角色</button></div></header>
  <nav class="tabs" role="tablist" aria-label="角色与专家团管理"><button class="cursor-interaction" id="rs-roles-tab" role="tab" aria-controls="rs-workspace" data-view="roles" aria-selected="true">角色库 <span class="pill" id="rs-role-count"></span></button><button class="cursor-interaction" id="rs-teams-tab" role="tab" aria-controls="rs-workspace" data-view="teams" aria-selected="false">专家团 <span class="pill" id="rs-team-count"></span></button></nav>
  <div class="workspace" id="rs-workspace" role="tabpanel" aria-labelledby="rs-roles-tab">
    <aside class="categories" id="rs-categories" aria-label="角色分类"></aside>
    <section class="library" aria-label="角色与专家团列表"><div class="row between library-head"><span id="rs-list-label"></span><span id="rs-list-count"></span></div><div class="cards" id="rs-cards"></div></section>
    <section class="inspector" aria-label="提示词与成员编辑"><header class="inspector-head"><div class="row between"><h2 id="rs-editor-title">角色提示词</h2><span class="pill" id="rs-source"></span></div><p class="small muted" id="rs-editor-subtitle">角色是专家团的基础，提示词在角色库中统一维护。</p></header><div class="editor" id="rs-editor"></div><footer class="editor-footer"><p class="validation" id="rs-error" role="alert"></p><div class="row between"><span class="save-status" id="rs-save-status" aria-live="polite">所有修改已保存</span><div class="row"><button class="cursor-interaction" data-action="cancel" id="rs-cancel">取消</button><button class="primary cursor-interaction" data-action="save" id="rs-save" disabled>保存角色</button></div></div></footer></section>
  </div>
  <div class="overlay" id="rs-confirm" hidden><section class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="rs-confirm-title"><h2 id="rs-confirm-title">有未保存的修改</h2><p>离开当前编辑会丢失这些修改。</p><div class="row actions"><button class="cursor-interaction" data-action="keep">继续编辑</button><button class="primary cursor-interaction" data-action="discard">放弃修改</button></div></section></div>
  <div class="toast" id="rs-toast" role="status" hidden></div>
</div>
<script>
(()=>{
const root=document.getElementById('role-studio'),q=s=>root.querySelector(s);
const categories=['开发与架构','产品与业务','设计与体验','数据与 AI','安全与质量','内容与营销'];
let roles=[
{id:'architect',name:'架构专家',category:'开发与架构',description:'系统边界、技术选型与架构取舍',builtin:true,prompt:'# 角色定位\n你是一位软件架构专家，负责把需求转化为清晰、可验证的技术方案。\n\n# 工作方法\n1. 明确业务目标、系统边界和约束。\n2. 比较可行方案，说明技术取舍。\n3. 检查数据流、依赖与失败恢复路径。\n\n# 交付要求\n输出架构建议、关键风险和验证清单。\n证据不足时标注假设，不把推断当作事实。'},
{id:'frontend',name:'前端工程师',category:'开发与架构',description:'组件设计、交互实现与前端性能',builtin:true,prompt:'# 角色定位\n你是一位前端工程师。\n\n# 工作方法\n复用现有组件与样式，关注状态管理、可访问性和窄屏布局。对异步状态提供明确反馈。\n\n# 交付要求\n交付可维护的实现方案、交互边界和行为验收场景。'},
{id:'backend',name:'后端工程师',category:'开发与架构',description:'接口设计、数据模型与并发处理',builtin:true,prompt:'# 角色定位\n你是一位后端工程师。\n\n# 工作方法\n明确接口契约和数据不变量，分析并发、幂等、错误恢复与可观测性。\n\n# 交付要求\n提供接口设计、关键实现建议和回归验证清单。'},
{id:'product',name:'产品专家',category:'产品与业务',description:'用户场景、需求边界与优先级',builtin:true,prompt:'# 角色定位\n你是一位产品专家。\n\n# 工作方法\n识别目标用户、核心问题与价值，划定首版范围。比较不同需求的收益与成本。\n\n# 交付要求\n输出优先级、非目标和可验证的验收标准。'},
{id:'ux',name:'体验专家',category:'设计与体验',description:'操作路径、信息层级与错误恢复',builtin:true,prompt:'# 角色定位\n你是一位用户体验专家。\n\n# 工作方法\n围绕用户目标检查完整操作路径，评估反馈、空状态、键盘操作和错误恢复。\n\n# 交付要求\n提出具体交互改进和可验证的验收场景。'},
{id:'visual',name:'视觉设计师',category:'设计与体验',description:'视觉层级、组件规范与一致性',builtin:true,prompt:'# 角色定位\n你是一位视觉设计师。\n\n# 工作方法\n优先遵循产品设计系统，检查字体、间距、颜色、状态和响应式表现。\n\n# 交付要求\n交付可落地的视觉规格，并指出不一致之处。'},
{id:'data',name:'数据分析师',category:'数据与 AI',description:'指标定义、数据质量与验证方法',builtin:true,prompt:'# 角色定位\n你是一位数据分析师。\n\n# 工作方法\n核对数据来源、质量和指标含义，明确分析方法和局限。\n\n# 交付要求\n提供可复现的验证步骤，不编造数据或评分。'},
{id:'security',name:'安全专家',category:'安全与质量',description:'权限边界、数据隔离与风险评估',builtin:true,prompt:'# 角色定位\n你是一位安全专家。\n\n# 工作方法\n沿输入、权限检查和输出链路分析信任边界。\n\n# 交付要求\n描述风险的触发条件、影响范围和修复建议。证据不足时列出待验证事项。'},
{id:'writer',name:'内容策划',category:'内容与营销',description:'内容结构、表达清晰度与事实核验',builtin:true,prompt:'# 角色定位\n你是一位内容策划专家。\n\n# 工作方法\n检查逻辑结构、信息完整性与来源支撑，区分事实、推断和建议。\n\n# 交付要求\n给出可直接使用的内容结构与修改建议。'}
];
let teams=[{id:'tech',name:'技术方案评审团',description:'从架构、安全和体验角度评审技术方案。',members:[{roleId:'architect',duty:'技术可行性与架构取舍'},{roleId:'security',duty:'权限边界与数据风险'},{roleId:'ux',duty:'交互路径与错误恢复'}]}, {id:'product-team',name:'产品方案评审团',description:'评审需求价值、用户体验和验证方式。',members:[{roleId:'product',duty:'用户价值与需求优先级'},{roleId:'ux',duty:'操作路径与可用性'},{roleId:'data',duty:'指标定义与验证方法'}]}];
let view='roles',category='全部角色',selected='architect',draft=null,baseline='',creating=false,pending=null,memberCategory='全部分类',toastTimer=null,returnFocus=null;
const role=id=>roles.find(r=>r.id===id),team=id=>teams.find(t=>t.id===id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function dirty(){return JSON.stringify(draft)!==baseline}
function toast(s){q('#rs-toast').textContent=s;q('#rs-toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('#rs-toast').hidden=true,2300)}
function remember(){if(!window.openai?.setWidgetState)return;const state={modelContent:{view,selectedRole:view==='roles'?draft.name:null,teams:teams.map(t=>({name:t.name,roles:t.members.map(m=>role(m.roleId)?.name)}))},privateContent:{version:1,view,category,selected,roles,teams}};if(new TextEncoder().encode(JSON.stringify(state)).length<16000)window.openai.setWidgetState(state).catch(()=>{});}
function guard(action){if(!dirty()){action();return}pending=action;returnFocus=document.activeElement;q('#rs-confirm').hidden=false;q('#rs-confirm').querySelector('button').focus()}
function usedBy(id){return teams.filter(t=>t.members.some(m=>m.roleId===id))}
function start(id,isNew=false,copy=null){selected=id;creating=isNew;memberCategory='全部分类';draft=copy||clone(view==='roles'?role(id):team(id));baseline=JSON.stringify(draft);render()}
function renderCategories(){if(view==='roles'){const cats=['全部角色',...categories,'自定义角色'];q('#rs-categories').innerHTML='<div class="label">按领域分类</div>'+cats.map(c=>{const count=c==='全部角色'?roles.length:c==='自定义角色'?roles.filter(r=>!r.builtin).length:roles.filter(r=>r.category===c).length;return `<button class="category cursor-interaction" data-category="${c}" aria-pressed="${category===c}"><span>${c}</span><span class="small muted">${count}</span></button>`}).join('')+'<div class="category-note">角色提示词统一维护。<br>一个角色可加入多个专家团。</div>'}else{q('#rs-categories').innerHTML='<div class="label">团队管理</div><button class="category cursor-interaction" aria-pressed="true"><span>全部专家团</span><span class="small muted">'+teams.length+'</span></button><div class="category-note">专家团引用角色库中的角色。<br><br>在团内配置成员分工，在角色库维护提示词。</div>'}}
function renderCards(){const items=view==='roles'?roles.filter(r=>category==='全部角色'||(category==='自定义角色'?!r.builtin:r.category===category)):teams;q('#rs-list-label').textContent=view==='roles'?category:'全部专家团';q('#rs-list-count').textContent=`${items.length} ${view==='roles'?'个角色':'个专家团'}`;q('#rs-cards').innerHTML=items.length?items.map(x=>view==='roles'?`<button class="role-card cursor-interaction" data-select="${x.id}" aria-pressed="${!creating&&selected===x.id}"><span class="row"><span class="avatar">${esc(x.name[0])}</span><span class="grow"><span class="name">${esc(x.name)}</span><span class="small muted">${esc(x.category)}</span></span></span><span class="summary">${esc(x.description)}</span><span class="excerpt">${esc(x.prompt.replace(/#\s*/g,''))}</span><span class="card-foot"><span class="pill">${x.builtin?'内置角色':'自定义'}</span><span>${usedBy(x.id).length} 个团引用 · 点击编辑</span></span></button>`:`<button class="role-card team-card cursor-interaction" data-select="${x.id}" aria-pressed="${!creating&&selected===x.id}"><span class="row"><span class="avatar"><i data-lucide="users" aria-hidden="true"></i></span><span class="name">${esc(x.name)}</span></span><span class="summary">${esc(x.description)}</span><span class="faces">${x.members.map(m=>`<span class="avatar" data-tooltip="${esc(role(m.roleId)?.name)}">${esc(role(m.roleId)?.name[0])}</span>`).join('')}</span><span class="small muted">${x.members.map(m=>esc(role(m.roleId)?.name)).join(' · ')}</span><span class="card-foot"><span>${x.members.length} 位成员</span><span>点击编辑</span></span></button>`).join(''):'<div class="empty">当前分类暂无角色。<br>点击「新增角色」创建。</div>';icons()}
function renderRoleEditor(){q('#rs-editor-title').textContent=creating?'新增角色':'角色提示词';q('#rs-source').textContent=creating?'自定义':draft.builtin?'内置 · 可修改':'自定义';q('#rs-editor-subtitle').textContent='角色是专家团的基础，提示词在角色库中统一维护。';const refs=creating?[]:usedBy(draft.id);q('#rs-editor').innerHTML=`<div class="two-fields"><label class="field">角色名称 <span aria-hidden="true">*</span><input data-field="name" aria-label="角色名称" value="${esc(draft.name)}" placeholder="如：检索评估专家" maxlength="40"></label><label class="field">所属分类<select data-field="category" aria-label="角色分类">${categories.map(c=>`<option ${draft.category===c?'selected':''}>${c}</option>`).join('')}</select></label></div><label class="field">角色简介<input data-field="description" aria-label="角色简介" value="${esc(draft.description)}" placeholder="说明这个角色擅长什么" maxlength="120"></label><label class="field">角色提示词 <span aria-hidden="true">*</span><textarea class="prompt" data-field="prompt" aria-label="角色提示词" placeholder="定义角色身份、工作方法和交付要求…" maxlength="6000">${esc(draft.prompt)}</textarea><span class="field-caption">支持 Markdown，作为角色的系统提示词。</span></label><div class="references"><div>被专家团引用 · ${refs.length}</div>${refs.map(t=>`<button class="cursor-interaction" data-open-team="${t.id}"><i data-lucide="users" aria-hidden="true"></i>${esc(t.name)}</button>`).join('')}${refs.length?'<p class="field-caption">保存后，引用该角色的专家团在下次调用时使用新提示词。</p>':'<p class="field-caption">保存后，可以在专家团中选择这个角色。</p>'}</div>`;q('#rs-save').textContent=creating?'创建角色':'保存角色';q('#rs-cancel').textContent=creating?'取消':'撤销修改'}
function renderMemberList(){const visible=roles.filter(r=>memberCategory==='全部分类'||r.category===memberCategory);q('#rs-member-list').innerHTML=visible.map(r=>{const m=draft.members.find(m=>m.roleId===r.id);return `<div class="member-select ${m?'checked':''}"><label class="cursor-interaction"><input type="checkbox" data-member="${r.id}" ${m?'checked':''}><span class="avatar">${esc(r.name[0])}</span><strong class="grow">${esc(r.name)}</strong><span class="small muted">${r.builtin?'内置':'自定义'}</span></label><p class="member-meta">${esc(r.category)}</p>${m?`<input class="duty" data-duty="${r.id}" value="${esc(m.duty)}" aria-label="${esc(r.name)}在团内的分工" placeholder="该角色在团内负责什么">`:''}<details><summary class="prompt-link cursor-interaction">查看角色提示词</summary><div class="prompt-peek">${esc(r.prompt)}</div></details></div>`}).join('')}
function renderTeamEditor(){q('#rs-editor-title').textContent=creating?'新增专家团':'专家团配置';q('#rs-source').textContent='角色组合';q('#rs-editor-subtitle').textContent='选择角色组成团队，并指定每位成员的分工。';q('#rs-editor').innerHTML=`<label class="field">专家团名称 <span aria-hidden="true">*</span><input data-field="name" aria-label="专家团名称" value="${esc(draft.name)}" placeholder="如：检索体验评审团" maxlength="40"></label><label class="field">团队用途<textarea data-field="description" aria-label="团队用途" placeholder="这个专家团解决什么问题？" maxlength="400">${esc(draft.description)}</textarea></label><div class="row between team-members-label"><h3>成员角色</h3><span class="small muted" id="rs-member-count">已选 ${draft.members.length} 位</span></div><label class="field">从角色库选择<select id="rs-member-category" aria-label="成员角色分类"><option>全部分类</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></label><div id="rs-member-list"></div><div class="notice">团内只配置成员与分工，角色提示词引用角色库中的最新保存版本。</div>`;renderMemberList();q('#rs-save').textContent=creating?'创建专家团':'保存专家团';q('#rs-cancel').textContent=creating?'取消':'撤销修改'}
function validation(){if(!draft.name.trim())return'请填写'+(view==='roles'?'角色':'专家团')+'名称。';const collection=view==='roles'?roles:teams;if(collection.some(x=>x.id!==draft.id&&x.name.trim()===draft.name.trim()))return'名称已存在，请换一个名称。';if(view==='roles'&&!draft.prompt.trim())return'请填写角色提示词。';if(view==='teams'&&!draft.members.length)return'请至少选择一位成员角色。';return''}
function update(){const error=validation();q('#rs-error').textContent=(dirty()||creating)?error:'';q('#rs-save').disabled=Boolean(error)||(!creating&&!dirty());q('#rs-cancel').disabled=!creating&&!dirty();q('#rs-save-status').textContent=creating?'尚未创建':dirty()?'有未保存的修改':'所有修改已保存';if(view==='teams')q('#rs-member-count').textContent='已选 '+draft.members.length+' 位';}
function render(){q('#rs-workspace').setAttribute('aria-labelledby',view==='roles'?'rs-roles-tab':'rs-teams-tab');root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));q('#rs-role-count').textContent=roles.length;q('#rs-team-count').textContent=teams.length;q('#rs-create').innerHTML='<i data-lucide="plus" aria-hidden="true"></i>新增'+(view==='roles'?'角色':'专家团');renderCategories();renderCards();view==='roles'?renderRoleEditor():renderTeamEditor();update();icons()}
function switchView(v,id=null){guard(()=>{view=v;category='全部角色';start(id||(view==='roles'?roles[0].id:teams[0].id));remember()})}
function create(){guard(()=>{const id='custom-'+Date.now();start(id,true,view==='roles'?{id,name:'',category:categories.includes(category)?category:categories[0],description:'',prompt:'',builtin:false}:{id,name:'',description:'',members:[]});q('[data-field=name]').focus()})}
function save(){if(validation())return;draft.name=draft.name.trim();const data=clone(draft);if(view==='roles'){const i=roles.findIndex(r=>r.id===draft.id);if(i<0)roles.push(data);else roles[i]=data;}else{const i=teams.findIndex(t=>t.id===draft.id);if(i<0)teams.push(data);else teams[i]=data;}const wasNew=creating;creating=false;category=view==='roles'&&category==='自定义角色'&&!draft.builtin?'自定义角色':view==='roles'&&categories.includes(category)?draft.category:category;baseline=JSON.stringify(draft);render();toast((view==='roles'?'角色':'专家团')+(wasNew?'已创建':'已保存'));remember()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)switchView(b.dataset.view);if(b.dataset.category)guard(()=>{category=b.dataset.category;renderCategories();renderCards();remember()});if(b.dataset.select)guard(()=>{start(b.dataset.select);if(innerWidth<=700)q('.inspector').scrollIntoView?.({block:'start'});remember()});if(b.dataset.openTeam)switchView('teams',b.dataset.openTeam);const a=b.dataset.action;if(a==='create')create();if(a==='save')save();if(a==='cancel'){if(creating){start(view==='roles'?roles[0].id:teams[0].id)}else{draft=JSON.parse(baseline);view==='roles'?renderRoleEditor():renderTeamEditor();update();icons()}}if(a==='keep'){q('#rs-confirm').hidden=true;pending=null;returnFocus?.focus()}if(a==='discard'){q('#rs-confirm').hidden=true;const action=pending;pending=null;draft=JSON.parse(baseline);action?.();render()}});
q('#rs-editor').addEventListener('input',e=>{if(e.target.dataset.field){draft[e.target.dataset.field]=e.target.value;update()}if(e.target.dataset.duty){draft.members.find(m=>m.roleId===e.target.dataset.duty).duty=e.target.value;update()}});
q('#rs-editor').addEventListener('change',e=>{if(e.target.dataset.field){draft[e.target.dataset.field]=e.target.value;update()}if(e.target.id==='rs-member-category'){memberCategory=e.target.value;renderMemberList()}const id=e.target.dataset.member;if(id){if(e.target.checked&&!draft.members.some(m=>m.roleId===id))draft.members.push({roleId:id,duty:role(id).description});if(!e.target.checked)draft.members=draft.members.filter(m=>m.roleId!==id);renderMemberList();update()}});
root.addEventListener('keydown',e=>{if(q('#rs-confirm').hidden)return;if(e.key==='Escape'){e.preventDefault();q('#rs-confirm').hidden=true;pending=null;returnFocus?.focus()}if(e.key==='Tab'){const buttons=q('#rs-confirm').querySelectorAll('button');if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus()}}});
function restore(state){const saved=state?.privateContent;if(saved?.version!==1||!Array.isArray(saved.roles)||!Array.isArray(saved.teams)||!saved.roles.length||!saved.teams.length)return;roles=clone(saved.roles);teams=clone(saved.teams);view=saved.view==='teams'?'teams':'roles';category=['全部角色','自定义角色',...categories].includes(saved.category)?saved.category:'全部角色';const collection=view==='roles'?roles:teams;start(collection.some(x=>x.id===saved.selected)?saved.selected:collection[0].id)}
start('architect');restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(!dirty()&&e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
})();
</script>
