<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WorkStep 网关移动端头部原型</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #0071e3;outline-offset:2px}.explain{max-width:760px;padding:0 24px;margin:28px auto}.explain h1{font-size:22px}.explain p{font-size:14px;line-height:1.7;color:#6e6e73}.preview{max-width:390px;margin:24px auto;background:white;min-height:480px;position:relative;border:1px solid #e8e8ed;border-radius:18px;overflow:hidden}.header{height:56px;padding:0 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e8e8ed;background:white}.title{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{padding:0;width:32px;height:32px;min-width:32px;border:0;border-radius:8px;background:transparent;color:#424245;display:grid;place-items:center}.icon:hover,.icon[aria-expanded=true]{background:#f5f5f7}.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.device{position:relative}.device:after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#16a34a}.placeholder{margin:90px 24px;text-align:center;color:#86868b;font-size:14px;line-height:1.8}.placeholder strong{display:block;font-size:17px;font-weight:500;color:#6e6e73;margin-bottom:8px}.cover{position:absolute;inset:56px 0 0;background:#0003;z-index:2}.picker{margin:8px;background:white;padding:8px;border-radius:14px;border:1px solid #e8e8ed;box-shadow:0 8px 24px #0001}.picker-title{font-size:12px;color:#86868b;padding:8px 12px}.row{width:100%;height:44px;border:0;background:white;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:8px;text-align:left;font-size:14px;color:#424245}.row[aria-selected=true]{background:#eaf3ff;color:#0071e3;font-weight:600}.row:hover{background:#f5f5f7}.name{flex:1}.status{font-size:11px;color:#86868b}.dot{width:6px;height:6px;border-radius:50%;background:#16a34a}.offline .dot{background:#86868b}.check{width:16px;color:#0071e3}.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);border-radius:10px;background:#1d1d1f;color:white;font-size:13px;padding:10px 14px;white-space:nowrap}.legend{max-width:390px;padding:0 12px;margin:20px auto;color:#6e6e73;font-size:13px;line-height:1.9}.legend b{color:#424245;font-weight:600}[hidden]{display:none!important}@media(max-width:600px){body{background:white}.explain{margin:18px auto;padding:0 16px}.explain h1{font-size:18px}.preview{max-width:none;margin:16px 0;min-height:420px;border-radius:0;border-left:0;border-right:0}.legend{max-width:none;padding:0 20px}.header{padding-inline:max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-right))}}.gateway-overlay{position:absolute;z-index:2;top:12px;left:48px;display:flex;flex-direction:row;align-items:center;gap:2px;padding:0 2px;background:rgba(255,255,255,.96);border:1px solid #e8e8ed;border-radius:10px;box-shadow:0 2px 8px #00000008}.gateway-overlay .icon{width:30px;min-width:30px;height:30px}.gateway-overlay .icon svg{width:18px;height:18px}.cover{z-index:3}.placeholder{padding-top:4px}.position-note{font-size:12px;color:#86868b}.device:after{top:3px;right:3px}.picker-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.platform-link{height:32px;padding:0 10px;background:transparent;border:0;border-radius:8px;color:#0071e3;font-size:12px;white-space:nowrap}.platform-link:hover{background:#eaf3ff}</style></head><body><div class="explain"><h1>网关移动端 · 仅调整头部</h1><p>Web 移动端界面保持原样。三横线右侧仅覆盖一个绝对定位的切换设备入口，不占布局高度。</p></div><main class="preview"><header class="header"><button class="icon" id="menu" aria-label="打开项目菜单" title="打开项目菜单"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="title" title="操作手册演示">操作手册演示</span><button class="icon" id="new" aria-label="新建对话" title="沿用 Web 的新建入口"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header><div class="gateway-overlay" aria-label="网关快捷入口"><button class="icon device" id="switch" aria-label="切换设备，当前沙箱 1" aria-expanded="false" title="切换设备 · 沙箱 1"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></div><div class="placeholder"><strong>下方沿用设备端 Web 移动界面</strong>项目、任务、会话、流程、设置及侧栏<br>均使用现有界面，此处不重新设计。</div><div class="cover" id="cover" hidden><section class="picker" role="dialog" aria-label="切换设备"><div class="picker-heading"><div class="picker-title">切换设备</div><button class="platform-link" id="back">返回网关平台</button></div><button class="row" role="option" aria-selected="true" data-device="沙箱 1"><span class="dot"></span><span class="name">沙箱 1</span><span class="status">当前设备</span><span class="check">✓</span></button><button class="row" role="option" aria-selected="false" data-device="办公电脑"><span class="dot"></span><span class="name">办公电脑</span><span class="status">在线</span><span class="check"></span></button><button class="row offline" role="option" aria-selected="false" aria-disabled="true" data-device="家用机"><span class="dot"></span><span class="name">家用机</span><span class="status">离线</span><span class="check"></span></button></section></div><div class="toast" id="toast" role="status" hidden></div></main><div class="legend"><b>☰ 项目菜单</b>：沿用现有 Web 抽屉。<br><b>显示器图标</b>：点击展开设备列表，绿点表示当前设备在线。<br><b>返回网关平台</b>：显示在设备列表标题行右上角。<br><b>＋</b>：保留 Web 原有的新建入口。<br>切换设备按钮绝对定位在三横线右边；返回网关平台位于设备列表标题行右上角。<br>可点击体验；所有设备均为模拟数据。</div><script>const $=s=>document.querySelector(s);let timer;function tip(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2000)}function close(){$('#cover').hidden=true;$('#switch').setAttribute('aria-expanded','false');$('#switch').focus()}$('#switch').onclick=()=>{$('#cover').hidden=false;$('#switch').setAttribute('aria-expanded','true')};$('#cover').onclick=e=>{if(e.target===$('#cover'))close()};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-disabled')==='true'){tip('设备离线，暂时无法切换');return}document.querySelectorAll('[data-device]').forEach(r=>{const active=r===b;r.setAttribute('aria-selected',active);r.querySelector('.check').textContent=active?'✓':'';r.querySelector('.status').textContent=active?'当前设备':r.classList.contains('offline')?'离线':'在线'});$('#switch').setAttribute('aria-label','切换设备，当前'+b.dataset.device);$('#switch').title='切换设备 · '+b.dataset.device;close();tip('已切换到'+b.dataset.device+'（模拟）')});$('#back').onclick=()=>tip('返回网关平台（模拟）');$('#menu').onclick=()=>tip('打开现有 Web 项目抽屉');$('#new').onclick=()=>tip('沿用 Web 新建对话');document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body></html>
