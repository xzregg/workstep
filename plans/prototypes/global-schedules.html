<style>

-size:11px;color:var(--accent);background:#fff9;border-radius:5px;padding:0 5px}.section-label{margin:26px 10px 10px;color:var(--muted);font-size:11px}.project-link{padding:9px 12px;border-radius:8px;margin:2px 0;color:var(--secondary)}.project-link.current{background:#ededf0}.project-link small{display:block;margin-left:22px;font-size:11px}.nav-bottom{margin-top:auto}.workspace{flex:1;min-width:0;padding:28px 30px;background:#fff}.workspace h1{font-size:20px}.workspace-header{display:flex;align-items:center;justify-content:space-between}.workflow-tabs{margin-top:22px;padding-bottom:12px;border-bottom:1px solid var(--border);color:var(--accent)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}.board-col{background:#f7f7f9;border-radius:10px;padding:16px;min-height:380px}.board-card{padding:15px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-top:15px}.board-card small{display:block;margin-top:10px}.backdrop{position:fixed;inset:32px 0 0 200px;background:#252c371f;display:flex;align-items:center;justify-content:center;padding:22px;z-index:10}.window{position:relative;display:flex;flex-direction:column;width:100%;height:min(900px,calc(100dvh - 76px));min-width:720px;min-height:450px;background:#fff;border:1px solid #d9dce2;border-radius:13px;box-shadow:0 18px 65px #00000020;isolation:isolate}.window-header{display:flex;align-items:center;gap:10px;min-height:57px;padding:0 20px;border-bottom:1px solid var(--border);cursor:move;user-select:none}.window-header h1{font-size:16px;font-weight:650}.window-header .title-icon{color:var(--accent)}.window-header .tag{font-size:11px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}.project-tabs{display:flex;align-items:stretch;gap:7px;padding:0 16px;min-height:53px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}.project-tabs button{border:0;border-radius:0;background:transparent;gap:8px;color:var(--muted);padding:0 14px;border-bottom:2px solid transparent}.project-tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}.project-tabs .tab-count{padding:0 6px;font-size:11px;min-width:20px;border-radius:5px;background:var(--surface);color:var(--muted)}.project-tabs button[aria-selected=true] .tab-count{background:var(--soft);color:var(--accent)}.project-context{display:flex;align-items:center;gap:8px;height:45px;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}.project-context strong{font-weight:600}.project-context .scope-hint{font-size:11px;color:var(--muted)}.project-context button{min-height:27px;font-size:12px}.columns{flex:1;min-height:0;display:grid;grid-template-columns:220px 4px minmax(280px,1fr) 4px 280px}.list{padding:15px 10px;overflow:auto}.list-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 10px 10px}.schedule-item{display:block;width:100%;border:1px solid transparent;background:transparent;padding:12px 10px;text-align:left;border-radius:9px;white-space:normal;margin-bottom:5px}.schedule-item.selected{background:var(--soft);border-color:#d7e7ff}.schedule-item .row{justify-content:space-between;gap:5px}.schedule-item strong{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--success);font-size:11px;white-space:nowrap}.status.paused{color:var(--muted)}.status::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:2px}.schedule-meta{color:var(--muted);font-size:11px;margin-top:8px;display:flex;justify-content:space-between;gap:4px}.agent-label{font-size:11px;color:var(--accent);margin-top:6px}.separator{background:var(--border);cursor:col-resize;position:relative}.separator:hover{background:#acd0ff}.editor,.runs{padding:18px;overflow:auto;min-width:0}.editor-title{display:flex;align-items:center;gap:8px;margin-bottom:17px}.editor-title button{min-height:26px;font-size:11px;padding:0 8px}.editor-title .delete{color:#c45454}.inner-tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:16px}.inner-tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 0 9px;min-height:30px;background:none;color:var(--muted);font-size:12px}.inner-tabs button.active{color:var(--fg);border-color:var(--accent);font-weight:600}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;font-size:12px}.field>span{color:var(--secondary)}input,select,textarea{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:var(--fg);min-height:var(--control)}textarea{height:105px;resize:vertical;line-height:1.7}.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segments{display:flex;gap:3px;background:var(--surface);padding:3px;border-radius:8px;margin-bottom:12px}.segments button{flex:1;border:0;background:transparent;min-height:28px;font-size:12px;padding:0 8px}.segments button.active{background:#fff;box-shadow:0 1px 4px #00000010;color:var(--fg);font-weight:600}.frequency-title{font-size:12px;margin:19px 0 8px}.weekdays{display:flex;margin:0 0 13px;border:1px solid var(--line);border-radius:7px;overflow:hidden}.weekdays button{flex:1;border:0;border-right:1px solid var(--border);border-radius:0;min-height:28px;padding:0 2px;font-size:11px}.weekdays button:last-child{border:0}.weekdays button.active{color:var(--accent);background:var(--soft)}.preview{background:var(--surface);border-radius:8px;padding:11px 12px;color:var(--secondary);font-size:11px;line-height:1.9}.preview strong{font-weight:500;color:var(--muted)}.editor-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}.editor-footer small{font-size:11px}.runs-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.runs-header select{width:92px;min-height:28px;font-size:11px}.run-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:9px;font-size:11px}.run-status{color:var(--success);font-weight:600}.run-status.failed{color:#d44b4b}.run-card time{color:var(--muted);font-size:11px}.run-card p{margin-top:8px;color:var(--muted);line-height:1.6}.run-card button{border:0;background:var(--surface);font-size:11px;margin-top:9px;min-height:25px;padding:0 8px}.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);text-align:center;padding:40px 20px;min-height:220px}.empty svg{width:30px;height:30px;stroke:#a5b5c6}.empty h2{color:var(--secondary)}.empty p{font-size:12px;max-width:240px}.empty button{margin-top:5px}.blank-panel{height:100%;display:grid;place-items:center;color:var(--muted);font-size:12px}.window-footer{display:flex;align-items:center;gap:7px;padding:9px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}.window-footer svg{width:12px;height:12px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 18px;max-width:90vw;background:#263347;color:#fff;border-radius:9px;box-shadow:0 6px 25px #0002;font-size:12px;z-index:40}.confirm-backdrop{position:fixed;inset:0;background:#18223555;display:grid;place-items:center;z-index:30;padding:20px}.confirm{width:min(390px,100%);background:white;padding:24px;border-radius:14px;box-shadow:0 20px 60px #0003}.confirm h2{font-size:16px}.confirm p{margin:12px 0 23px;color:var(--muted);font-size:12px}.confirm-actions{display:flex;justify-content:flex-end;gap:8px}.resize{position:absolute;z-index:5}.resize.n,.resize.s{height:7px;left:9px;right:9px;cursor:ns-resize}.resize.n{top:-3px}.resize.s{bottom:-3px}.resize.e,.resize.w{width:7px;top:9px;bottom:9px;cursor:ew-resize}.resize.e{right:-3px}.resize.w{left:-3px}.resize.ne,.resize.nw,.resize.se,.resize.sw{width:13px;height:13px}.resize.ne{right:-3px;top:-3px;cursor:nesw-resize}.resize.nw{left:-3px;top:-3px;cursor:nwse-resize}.resize.se{right:-3px;bottom:-3px;cursor:nwse-resize}.resize.sw{left:-3px;bottom:-3px;cursor:nesw-resize}.mobile-back{display:none}.review-row{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.review-row select{width:130px}.mobile-heading{display:none}
@media(min-width:1600px){.window{max-width:1450px}.columns{grid-template-columns:250px 4px minmax(300px,1fr) 4px 340px}}
@media(max-width:1190px) and (min-width:1024px){.sidebar{width:175px}.backdrop{left:175px;padding:12px}.columns{grid-template-columns:180px 4px minmax(250px,1fr) 4px 210px}.editor,.runs{padding:13px}.window-header{padding:0 15px}.scope-hint{display:none}}
@media(max-width:1023px){.sidebar{width:168px}.backdrop{inset:32px 0 0;padding:0}.window{height:100%;width:100%;min-width:0;min-height:0;border:0;border-radius:0}.window-header{min-height:52px;padding:0 14px;cursor:default}.window-header .tag{font-size:11px}.window-header button{min-height:var(--control)}.project-tabs{padding:0 6px;min-height:var(--touch)}.project-tabs button{padding:0 12px;min-height:var(--touch);font-size:12px}.project-context{padding:0 14px;min-height:var(--touch);height:auto;gap:5px}.scope-hint{display:none}.columns{display:flex;flex-direction:column;overflow:auto}.separator{display:none}.list{flex:1}.editor,.runs{display:none}.window[data-mobile-detail=true] .list{display:none}.window[data-mobile-detail=true] .editor,.window[data-mobile-detail=true] .runs{display:block;overflow:visible}.window[data-mobile-detail=true] .editor{padding:16px}.window[data-mobile-detail=true] .runs{padding:20px 16px}.window[data-mobile-detail=true] .mobile-back{display:inline-flex}.window[data-mobile-detail=true] .runs{border-top:1px solid var(--border)}.schedule-item{padding:15px 12px}.schedule-item strong{font-size:13px}.schedule-meta,.agent-label{font-size:11px}.resize{display:none}.window-footer{padding:9px 14px}.window-footer .footer-detail{display:none}.board{grid-template-columns:1fr}.workspace{padding:20px}.prototype-bar{font-size:11px;padding:0 12px}.prototype-bar .bar-hint{display:none}.toast{bottom:18px;width:max-content}.grid-two{gap:10px}.window[data-empty=true] .editor{display:none}.window[data-empty=true] .list{display:block}}
</style>
</head>
<body>
<div class="prototype-bar"><strong>交互原型 · 定时任务总入口</strong><span class="bar-hint">示例数据 · 点击项目 Tab 切换 · 支持拖动与缩放</span><span>HTML 预览</span></div>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">w</span>WorkStep</div>
    <nav class="nav" aria-label="主菜单">
      <button class="ghost" id="statistics-nav"><i data-icon="chart"></i>数据统计</button>
      <button class="active" id="schedule-nav"><i data-icon="clock"></i>定时任务<span class="count" id="global-count">5</span></button>
      <button class="ghost" id="add-project-nav"><i data-icon="plus"></i>添加项目</button>
    </nav>
    <div class="section-label">项目</div>
    <div class="project-link current">▾　产品研发<small>默认研发流程</small></div>
    <div class="project-link">▸　内容运营</div><div class="project-link">▸　个人工具箱</div><div class="project-link">▸　新项目</div>
    <div class="nav nav-bottom"><button class="ghost" id="settings-nav"><i data-icon="settings"></i>设置</button></div>
  </aside>
  <main class="workspace">
    <div class="workspace-header"><h1>产品研发</h1><div class="row"><button id="project-entry"><i data-icon="clock"></i>定时任务 <span id="project-count">3</span></button><button class="primary" id="new-task-demo">＋ 新建任务</button></div></div>
    <div class="workflow-tabs">默认研发流程</div>
    <div class="board"><div class="board-col">待处理<div class="board-card">梳理下一版本需求<small>今天创建 · 默认研发流程</small></div></div><div class="board-col">进行中<div class="board-card">优化任务详情体验<small>步骤 2 / 4 · 正在执行</small></div></div><div class="board-col">已完成<div class="board-card">更新项目依赖<small>已完成 · 昨天</small></div></div></div>
  </main>
</div>
<div class="backdrop" id="overlay">
  <section class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="window-title">
    <header class="window-header" id="drag"><i class="title-icon" data-icon="clock"></i><h1 id="window-title">定时任务</h1><span class="tag" id="window-tag">跨项目入口</span><div class="spacer"></div><button class="icon" id="close" aria-label="关闭定时任务"><i data-icon="x"></i></button></header>
    <div class="project-tabs" id="project-tabs" role="tablist" aria-label="选择项目"></div>
    <div id="project-panel" role="tabpanel" class="project-context"><button class="icon mobile-back" id="back" aria-label="返回定时任务列表"><i data-icon="back"></i></button><i data-icon="folder"></i><strong id="project-name"></strong><span class="scope-hint">此项目的定时任务</span><div class="spacer"></div><button class="primary" id="new"><i data-icon="plus"></i>新建定时任务</button></div>
    <div class="columns" id="columns">
      <aside class="list" id="list" aria-label="定时任务列表"></aside>
      <div class="separator" data-column="left" role="separator" aria-label="调整列表宽度" aria-orientation="vertical" tabindex="0"></div>
      <main class="editor" id="editor"></main>
      <div class="separator" data-column="right" role="separator" aria-label="调整执行记录宽度" aria-orientation="vertical" tabindex="0"></div>
      <section class="runs" id="runs" aria-label="执行记录"></section>
    </div>
    <footer class="window-footer"><i data-icon="folder"></i><span id="footer-project"></span><span>·</span><span id="footer-count"></span><div class="spacer"></div><span class="footer-detail">切换项目仅更新此窗口　·　</span><span>Asia/Shanghai</span></footer>
  </section>
</div>
<div class="confirm-backdrop" id="confirm-overlay" hidden><section class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">放弃未保存的修改？</h2><p id="confirm-message">当前定时任务有未保存的修改，离开后将丢失。</p><div class="confirm-actions"><button id="confirm-cancel">继续编辑</button><button class="primary" id="confirm-ok">放弃修改</button></div></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);
const paths={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 4v16h16M8 16v-5m5 5V6m5 10v-7"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/>',back:'<path d="m14 6-6 6 6 6"/>',settings:'<path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.clock)+'</svg>'}
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=[{id:'product',name:'产品研发',tasks:[{id:1,title:'每日代码巡检',description:'检查最近 24 小时的代码变更，运行关键测试，整理潜在问题与改进建议。',workflow:'代码审查流程',cycle:'每天',time:'09:00',status:'active',mode:'static'},{id:2,title:'每周依赖更新',description:'检查项目依赖版本，整理可更新项并生成变更建议。',workflow:'默认研发流程',cycle:'每周',time:'10:00',status:'active',mode:'static'},{id:3,title:'自动整理待办',description:'阅读项目内的待办与近期提交，整理本周优先事项并选择合适的流程创建任务。',workflow:'默认研发流程',cycle:'每天',time:'18:00',status:'paused',mode:'agent'}]},{id:'content',name:'内容运营',tasks:[{id:4,title:'工作日内容选题',description:'结合近期产品更新，生成 3 个内容选题，给出标题、目标读者与大纲。',workflow:'内容创作流程',cycle:'每周',time:'09:30',status:'active',mode:'agent'},{id:5,title:'每周运营复盘',description:'汇总本周已完成的内容任务，整理下周的内容计划。',workflow:'运营复盘流程',cycle:'每周',time:'17:00',status:'active',mode:'static'}]},{id:'tools',name:'个人工具箱',tasks:[]},{id:'new-project',name:'新项目',tasks:[]}];
let projectIndex=0,selectedId=1,creating=false,dirty=false,mode='global',innerTab='content',frequency='cycle',runFilter='all',pending=null,toastTimer;
const selection=new Map(),drafts=new Map();
function project(){return projects[projectIndex]}
function selected(){return creating?drafts.get(project().id):project().tasks.find(t=>t.id===selectedId)}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
function guard(action){if(!dirty){action();return}pending=action;$('confirm-overlay').hidden=false;$('confirm-cancel').focus()}
$('confirm-cancel').onclick=()=>{$('confirm-overlay').hidden=true;pending=null};
$('confirm-ok').onclick=()=>{$('confirm-overlay').hidden=true;dirty=false;const action=pending;pending=null;action?.()};
function updateCounts(){$('global-count').textContent=projects.reduce((n,p)=>n+p.tasks.length,0);$('project-count').textContent=projects[0].tasks.length}
function renderTabs(){$('project-tabs').hidden=mode==='project';$('window-tag').textContent=mode==='project'?'项目入口':'跨项目入口';$('project-tabs').innerHTML=projects.map((p,i)=>`<button role="tab" id="tab-${p.id}" aria-controls="project-panel" aria-selected="${i===projectIndex}" tabindex="${i===projectIndex?0:-1}" data-project="${i}">${esc(p.name)}<span class="tab-count">${p.tasks.length}</span></button>`).join('');$('project-panel').setAttribute('aria-labelledby',`tab-${project().id}`);$('project-name').textContent=project().name;$('footer-project').textContent=project().name;$('footer-count').textContent=`${project().tasks.length} 个定时任务`;updateCounts()}
function renderList(){const p=project();$('window').dataset.empty=p.tasks.length===0&&!creating;$('list').innerHTML=p.tasks.length?`<div class="list-label"><span>定时任务</span><span>${p.tasks.length} 项</span></div>`+p.tasks.map(t=>`<button class="schedule-item ${!creating&&t.id===selectedId?'selected':''}" data-task="${t.id}" aria-pressed="${!creating&&t.id===selectedId}"><div class="row"><strong>${esc(t.title)}</strong><span class="status ${t.status==='paused'?'paused':''}">${t.status==='paused'?'已暂停':'已启用'}</span></div><div class="schedule-meta"><span>${t.status==='paused'?'下次执行 —':'10/15 '+esc(t.time)}</span><span>${esc(t.cycle)} ${esc(t.time)}</span></div>${t.mode==='agent'?'<div class="agent-label">智能生成 · 自动选择流程</div>':''}</button>`).join(''):`<div class="empty">${icon('clock')}<h2>还没有定时任务</h2><p>为「${esc(p.name)}」创建第一个定时任务，让重复工作自动开始。</p><button class="primary" data-create>＋ 新建定时任务</button></div>`;}
function renderEditor(){const t=selected();if(!t){$('editor').innerHTML='<div class="blank-panel">选择定时任务，查看配置</div>';$('runs').innerHTML='<div class="blank-panel">执行记录将在这里显示</div>';return}
innerTab='content';frequency='cycle';
$('editor').innerHTML=`<div class="editor-title"><h2>${creating?'新建定时任务':'编辑定时任务'}</h2><div class="spacer"></div>${creating?'':`<button class="ghost" id="pause">${t.status==='paused'?'恢复':'暂停'}</button><button class="ghost delete" id="delete">删除</button>`}</div>
<div class="inner-tabs"><button class="active" data-inner="content">任务内容</button><button data-inner="review">审核配置</button></div>
<div id="content-fields"><label class="field"><span>任务生成方式</span><select id="generation"><option value="static" ${t.mode==='static'?'selected':''}>固定任务模板</option><option value="agent" ${t.mode==='agent'?'selected':''}>智能生成任务</option></select></label>
<div class="grid-two" id="workflow-fields" ${t.mode==='agent'?'hidden':''}><label class="field"><span>工作流</span><select id="workflow"><option>${esc(t.workflow)}</option><option>默认研发流程</option></select></label><label class="field"><span>起始步骤</span><select><option>从第一个步骤开始</option><option>开发</option><option>审核</option></select></label></div>
<label class="field"><span>任务标题</span><input id="task-title" value="${esc(t.title)}" placeholder="例如：每日代码巡检"></label><label class="field"><span id="description-label">${t.mode==='agent'?'生成指令':'任务描述'}</span><textarea id="description">${esc(t.description)}</textarea></label><div id="agent-hint" class="preview" ${t.mode==='agent'?'':'hidden'}>候选流程：此项目的全部流程<br>每次触发时根据指令生成任务，并选择合适流程。</div></div>
<div id="review-fields" hidden><p class="muted">使用所选流程的审核设置，可按步骤调整。</p><div class="review-row">需求分析<select><option>沿用流程</option><option>人工审核</option><option>自动审核</option><option>跳过</option></select></div><div class="review-row">开发实现<select><option>沿用流程</option><option>人工审核</option><option>自动审核</option><option>跳过</option></select></div></div>
<div class="frequency-title">执行频率</div><div class="segments"><button class="active" data-frequency="cycle">周期</button><button data-frequency="interval">间隔</button><button data-frequency="once">单次</button></div>
<div id="frequency-cycle"><div class="grid-two"><label class="field"><select id="cycle" aria-label="执行周期"><option ${t.cycle==='每天'?'selected':''}>每天</option><option ${t.cycle==='每周'?'selected':''}>每周</option><option>每月</option></select></label><label class="field"><input id="clock" type="time" value="${esc(t.time)}" aria-label="执行时间"></label></div><div class="weekdays" id="weekdays" ${t.cycle==='每周'?'':'hidden'}>${['一','二','三','四','五','六','日'].map((d,i)=>`<button class="${i<5?'active':''}" aria-pressed="${i<5}" data-day="${i}">周${d}</button>`).join('')}</div></div>
<div id="frequency-interval" hidden><label class="field"><span>间隔（小时）</span><input type="number" id="interval" min="1" max="24" value="2"></label></div><div id="frequency-once" hidden><label class="field"><span>执行时间</span><input id="once" type="datetime-local" value="2026-10-15T09:00"></label></div>
<div id="range-fields"><label class="field"><span>生效日期 <small>（留空则不限制）</small></span><div class="grid-two"><input type="date" aria-label="开始日期"><input type="date" aria-label="结束日期"></div></label></div><div class="grid-two"><label class="field"><span>执行方式</span><select><option>跟随工作流设置</option><option>立即执行</option><option>手动开始</option></select></label><label class="field"><span>重复触发</span><select><option>跳过本次</option><option>排队执行</option><option>并行执行</option></select></label></div>
<div class="preview" id="next-preview"></div><div class="editor-footer"><small id="save-hint">配置仅作用于当前项目</small><button class="primary" id="save">${creating?'创建定时任务':'保存'}</button></div>`;
updatePreview();$('generation').onchange=e=>{const agent=e.target.value==='agent';$('workflow-fields').hidden=agent;$('agent-hint').hidden=!agent;$('description-label').textContent=agent?'生成指令':'任务描述';validate()};$('cycle').onchange=()=>{$('weekdays').hidden=$('cycle').value!=='每周';updatePreview()};$('clock').oninput=updatePreview;$('save').onclick=save;$('pause')?.addEventListener('click',()=>guard(()=>{t.status=t.status==='paused'?'active':'paused';render();notify(t.status==='paused'?'已暂停（原型演示）':'已恢复（原型演示）')}));$('delete')?.addEventListener('click',()=>{pending=()=>{project().tasks=project().tasks.filter(x=>x.id!==t.id);selectedId=project().tasks[0]?.id??null;render();notify('已从示例数据中删除')};$('confirm-title').textContent='删除此定时任务？';$('confirm-message').textContent='仅删除原型中的示例数据。';$('confirm-ok').textContent='删除';$('confirm-overlay').hidden=false});
renderRuns();validate();}
function validate(){if(!$('save'))return;$('save').disabled=!$('task-title').value.trim()||!$('description').value.trim()}
function updatePreview(){if(!$('next-preview'))return;const time=$('clock').value||'09:00';$('next-preview').innerHTML=frequency==='once'?`<strong>单次执行</strong><br>${esc(($('once').value||'2026-10-15T09:00').replace('T',' '))}`:frequency==='interval'?`<strong>接下来执行（示例）</strong><br>每 ${esc($('interval').value)} 小时执行一次`:`<strong>接下来执行（示例）</strong><br>10/15 ${time}　·　10/16 ${time}　·　10/17 ${time}`}
function renderRuns(){const t=selected();if(!t)return;const records=creating?[]:[{status:'succeeded',time:'10/14 '+t.time,note:'任务已完成，所有步骤执行成功。'},{status:'succeeded',time:'10/13 '+t.time,note:'任务已完成，所有步骤执行成功。'},{status:'failed',time:'10/12 '+t.time,note:'引擎连接超时，本次执行失败。'}];const visible=records.filter(r=>runFilter==='all'||r.status===runFilter);$('runs').innerHTML=`<div class="runs-header"><h2>执行记录</h2><select id="run-filter" aria-label="筛选执行记录"><option value="all">全部状态</option><option value="succeeded">已完成</option><option value="failed">失败</option></select></div>${visible.length?visible.map(r=>`<article class="run-card"><div class="row"><span class="run-status ${r.status==='failed'?'failed':''}">${r.status==='failed'?'失败':'已完成'}</span><div class="spacer"></div><time>${r.time}</time></div><p>${r.note}</p><button data-open-task>查看任务 ↗</button></article>`).join(''):'<div class="empty"><p>暂无执行记录<br>定时任务触发后，记录将在这里显示。</p></div>'}`;$('run-filter').value=runFilter;$('run-filter').onchange=e=>{runFilter=e.target.value;renderRuns()}}
function render(){renderTabs();renderList();renderEditor()}
function switchProject(index){guard(()=>{selection.set(project().id,selectedId);projectIndex=index;creating=false;dirty=false;selectedId=selection.get(project().id)??project().tasks[0]?.id??null;runFilter='all';$('window').dataset.mobileDetail=false;render();$(`tab-${project().id}`).focus()})}
function startCreate(){guard(()=>{creating=true;dirty=false;drafts.set(project().id,{id:Date.now(),title:'',description:'',workflow:project().id==='content'?'内容创作流程':'默认研发流程',cycle:'每天',time:'09:00',status:'active',mode:'static'});$('window').dataset.mobileDetail=true;render();$('task-title').focus()})}
function save(){if($('save').disabled)return;const t=selected();Object.assign(t,{title:$('task-title').value.trim(),description:$('description').value.trim(),mode:$('generation').value,cycle:frequency==='cycle'?$('cycle').value:frequency==='once'?'单次':'每 '+$('interval').value+' 小时',time:$('clock').value});if(creating){project().tasks.push(t);selectedId=t.id;creating=false}dirty=false;renderTabs();renderList();$('save-hint').textContent='已保存（原型演示）';notify(`已保存到「${project().name}」（仅原型示例数据）`)}
function openWindow(nextMode){guard(()=>{mode=nextMode;if(mode==='project')projectIndex=0;creating=false;dirty=false;selectedId=selection.get(project().id)??project().tasks[0]?.id??null;$('overlay').hidden=false;render();$('close').focus()})}
function closeWindow(){guard(()=>{$('overlay').hidden=true;creating=false;dirty=false;$('schedule-nav').focus()})}
$('schedule-nav').onclick=()=>openWindow('global');$('project-entry').onclick=()=>openWindow('project');$('close').onclick=closeWindow;$('new').onclick=startCreate;$('back').onclick=()=>guard(()=>{$('window').dataset.mobileDetail=false;creating=false;selectedId=project().tasks[0]?.id??null;render()});
$('statistics-nav').onclick=()=>notify('原型演示：数据统计入口');$('add-project-nav').onclick=()=>notify('原型演示：添加项目入口');$('settings-nav').onclick=()=>notify('原型演示：设置入口');$('new-task-demo').onclick=()=>notify('原型演示：新建普通任务入口');
$('project-tabs').onclick=e=>{const b=e.target.closest('[data-project]');if(b)switchProject(Number(b.dataset.project))};$('project-tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=e.key==='Home'?0:e.key==='End'?projects.length-1:(projectIndex+(e.key==='ArrowRight'?1:-1)+projects.length)%projects.length;switchProject(i)};
$('list').onclick=e=>{if(e.target.closest('[data-create]')){startCreate();return}const b=e.target.closest('[data-task]');if(b)guard(()=>{selectedId=Number(b.dataset.task);creating=false;dirty=false;runFilter='all';$('window').dataset.mobileDetail=true;render()})};
$('editor').addEventListener('input',()=>{dirty=true;validate();updatePreview()});$('editor').addEventListener('change',()=>{dirty=true;validate()});$('editor').onclick=e=>{const tab=e.target.closest('[data-inner]');if(tab){innerTab=tab.dataset.inner;$('content-fields').hidden=innerTab!=='content';$('review-fields').hidden=innerTab!=='review';document.querySelectorAll('[data-inner]').forEach(b=>b.classList.toggle('active',b===tab))}const f=e.target.closest('[data-frequency]');if(f){frequency=f.dataset.frequency;document.querySelectorAll('[data-frequency]').forEach(b=>b.classList.toggle('active',b===f));['cycle','interval','once'].forEach(n=>$('frequency-'+n).hidden=n!==frequency);$('range-fields').hidden=frequency==='once';dirty=true;updatePreview()}const day=e.target.closest('[data-day]');if(day){day.classList.toggle('active');day.setAttribute('aria-pressed',day.classList.contains('active'));dirty=true}};
$('runs').onclick=e=>{if(e.target.closest('[data-open-task]'))notify('原型演示：打开这次执行生成的任务详情')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('confirm-overlay').hidden){$('confirm-cancel').click();return}if(!$('overlay').hidden)closeWindow()}if(e.key==='Tab'&&!$('overlay').hidden){const root=$('confirm-overlay').hidden?$('window'):$('confirm-overlay');const focusable=[...root.querySelectorAll('button:not(:disabled),input,select,textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!root.contains(document.activeElement))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&(document.activeElement===last||!root.contains(document.activeElement))){e.preventDefault();first?.focus()}}});
function pointerDrag(handle,move){handle.onpointerdown=e=>{if(innerWidth<=1023||e.target.closest('button'))return;e.preventDefault();const r=$('window').getBoundingClientRect(),x=e.clientX,y=e.clientY;handle.setPointerCapture(e.pointerId);handle.onpointermove=ev=>move(ev.clientX-x,ev.clientY-y,r);handle.onpointerup=()=>{handle.onpointermove=null};handle.onpointercancel=()=>{handle.onpointermove=null}}}
function setRect(l,t,w,h){Object.assign($('window').style,{position:'fixed',left:l+'px',top:t+'px',width:w+'px',height:h+'px',maxWidth:'none'})}
pointerDrag($('drag'),(dx,dy,r)=>setRect(Math.max(8,Math.min(innerWidth-r.width-8,r.left+dx)),Math.max(40,Math.min(innerHeight-r.height-8,r.top+dy)),r.width,r.height));
for(const dir of ['n','s','e','w','ne','nw','se','sw']){const h=document.createElement('div');h.className='resize '+dir;$('window').append(h);pointerDrag(h,(dx,dy,r)=>{let l=r.left,t=r.top,right=r.right,bottom=r.bottom;if(dir.includes('e'))right=Math.max(l+720,Math.min(innerWidth-8,right+dx));if(dir.includes('w'))l=Math.max(8,Math.min(right-720,l+dx));if(dir.includes('s'))bottom=Math.max(t+450,Math.min(innerHeight-8,bottom+dy));if(dir.includes('n'))t=Math.max(40,Math.min(bottom-450,t+dy));setRect(l,t,right-l,bottom-t)})}
document.querySelectorAll('.separator').forEach(h=>{const change=(delta)=>{const left=$('list').getBoundingClientRect().width,right=$('runs').getBoundingClientRect().width,total=$('columns').clientWidth;if(h.dataset.column==='left')$('columns').style.gridTemplateColumns=`${Math.max(160,Math.min(total-right-288,left+delta))}px 4px minmax(280px,1fr) 4px ${right}px`;else $('columns').style.gridTemplateColumns=`${left}px 4px minmax(280px,1fr) 4px ${Math.max(180,Math.min(total-left-288,right-delta))}px`};h.onpointerdown=e=>{if(innerWidth<=1023)return;let prev=e.clientX;h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{change(ev.clientX-prev);prev=ev.clientX};h.onpointerup=()=>{h.onpointermove=null}};h.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(e.key==='ArrowLeft'?-16:16)}}});
window.addEventListener('resize',()=>{if(innerWidth<=1023){$('window').removeAttribute('style');$('columns').removeAttribute('style')}else{const r=$('window').getBoundingClientRect();if(r.width>innerWidth-16||r.height>innerHeight-48||r.right>innerWidth||r.bottom>innerHeight)$('window').removeAttribute('style')}});
const confirmDefaults=()=>{$('confirm-title').textContent='放弃未保存的修改？';$('confirm-message').textContent='当前定时任务有未保存的修改，离开后将丢失。';$('confirm-ok').textContent='放弃修改'};
const originalGuard=guard;guard=function(action){confirmDefaults();originalGuard(action)};
render();$('close').focus();
</script>
</body>
</html>
