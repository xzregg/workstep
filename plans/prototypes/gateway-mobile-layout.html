<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WorkStep 网关移动端原型</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #0071e3;outline-offset:2px}.intro{max-width:1040px;margin:24px auto;padding:0 24px}.intro h1{font-size:22px;margin:0 0 8px}.intro p{font-size:14px;color:#6e6e73;margin:0}.phone{position:relative;max-width:390px;height:780px;margin:24px auto;border:1px solid #e8e8ed;border-radius:24px;overflow:hidden;background:white;display:flex;flex-direction:column;box-shadow:0 16px 48px #0000000a}.header{height:56px;display:flex;align-items:center;gap:10px;padding:0 8px;border-bottom:1px solid #e8e8ed;flex-shrink:0}.brand{font-size:18px;font-weight:650;flex:1}.brand span{color:#0071e3;margin-right:7px}.icon{border:0;background:transparent;width:44px;height:44px;min-width:44px;padding:0;border-radius:10px;display:grid;place-items:center;color:#424245}.icon:hover{background:#f5f5f7}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tabs{display:flex;gap:6px;padding:8px;overflow:auto;background:#f5f5f7;border-bottom:1px solid #e8e8ed;flex-shrink:0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.device{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 12px;height:32px;border-radius:8px;border:1px solid transparent;color:#6e6e73;background:transparent}.device[aria-selected=true]{background:white;border-color:#e8e8ed;color:#0071e3;font-weight:600}.dot{width:6px;height:6px;background:#16a34a;border-radius:50%}.offline .dot{background:#86868b}.offline{opacity:.7}.content{flex:1;min-height:0;overflow:auto;padding:20px 16px}.content h2{font-size:20px;margin:0 0 8px}.connection{font-size:12px;color:#16a34a;margin:0 0 26px}.secondary,.primary{min-height:32px;border-radius:10px;padding:8px 14px;border:1px solid #e8e8ed;background:#f5f5f7;color:#1d1d1f}.primary{background:#0071e3;color:white;border-color:transparent}.choose{width:100%;text-align:left;height:44px}.welcome{padding:36px 8px}.welcome h3{font-size:18px;margin:0 0 14px}.welcome p{color:#6e6e73;font-size:14px;line-height:1.65;margin-bottom:22px}.project-heading{display:flex;align-items:center;gap:8px}.project-heading h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;margin:0}.sections{display:flex;gap:6px;margin:14px 0 20px}.sections button{flex:1;height:32px;border:0;border-radius:8px;background:white;color:#424245}.sections button[aria-selected=true]{color:#0071e3;background:#eaf3ff;font-weight:600}.search{width:100%;height:32px;padding:0 10px;border:1px solid #e8e8ed;border-radius:8px;background:#f5f5f7;font-size:13px}.cards{display:grid;gap:12px;margin-top:16px}.card{border:1px solid #e8e8ed;border-radius:14px;padding:16px}.card h3{font-size:15px;margin:0 0 14px}.meta{display:flex;justify-content:space-between;font-size:12px;color:#86868b}.running{color:#0071e3}.done{color:#16a34a}.overlay{position:absolute;inset:105px 0 0;background:#0003;z-index:3;display:flex}.drawer{width:min(328px,86%);height:100%;background:white;display:flex;flex-direction:column;padding:12px 16px;box-shadow:8px 0 28px #0000000a}.drawer-head{display:flex;align-items:center;margin-bottom:14px}.drawer-head strong{font-size:18px;flex:1}.drawer .nav{display:flex;align-items:center;gap:10px;height:44px;text-align:left;border:0;background:transparent;border-radius:10px;padding:0 12px;color:#424245;width:100%}.drawer .nav:hover{background:#f5f5f7}.drawer .nav[aria-current=page]{background:#eaf3ff;color:#0071e3;font-weight:600}.drawer .nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}.nav-actions{margin:16px 0}.label{font-size:12px;color:#86868b;margin:8px 12px}.project-list{flex:1;overflow:auto}.settings{margin-top:12px!important;background:#f5f5f7!important}.menu-cover{position:absolute;inset:0;z-index:4}.menu{position:absolute;right:8px;top:50px;width:190px;background:white;border:1px solid #e8e8ed;box-shadow:0 10px 32px #0002;border-radius:14px;padding:8px}.menu .user{padding:10px;font-size:12px;color:#86868b;border-bottom:1px solid #e8e8ed;margin-bottom:4px}.menu button{width:100%;border:0;background:white;padding:10px;border-radius:8px;text-align:left;font-size:14px}.menu button:hover{background:#f5f5f7}.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:white;padding:10px 16px;border-radius:12px;font-size:13px;z-index:6;white-space:nowrap}.hint{max-width:600px;margin:20px auto 32px;padding:0 24px;font-size:13px;color:#6e6e73;line-height:1.6}[hidden]{display:none!important}@media(max-width:600px){body{background:white}.intro,.hint{display:none}.phone{width:100%;max-width:none;height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.overlay{top:calc(105px + env(safe-area-inset-top))}}

.header{height:44px;gap:4px;padding:0 6px}.header>.icon{width:32px;height:32px;min-width:32px}.device-switch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 6px;border:0;background:transparent;color:#424245;font-size:13px;text-align:left}.device-switch #current-device{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chevron{color:#86868b}.platform-return{flex-shrink:0;height:32px;padding:0 8px;border:0;background:transparent;color:#0071e3;font-size:12px}.header>#open-menu{display:none}.device-cover{position:absolute;inset:44px 0 0;background:#0003;z-index:5}.tabs{position:absolute;top:6px;left:12px;right:12px;background:white;display:flex;flex-direction:column;padding:8px;border:1px solid #e8e8ed;border-radius:14px;box-shadow:0 8px 28px #0002}.device-title{font-size:13px;padding:8px 12px;color:#6e6e73}.tabs .device{height:44px;border-radius:8px;font-size:14px}.tabs .device[aria-selected=true]{background:#eaf3ff;border-color:transparent}.overlay{inset:0;background:#0005}.drawer{width:min(340px,calc(100% - 48px));padding:12px 12px}.drawer-head{min-height:44px;margin:0 -12px 12px;padding:0 10px 12px;border-bottom:1px solid #e8e8ed}.drawer-brand{font-size:17px!important;white-space:nowrap}.drawer-brand span{color:#0071e3}.intro-link{font-size:13px;color:#424245;background:transparent;border:0;padding:0 8px;height:32px}.drawer-head .icon{width:32px;height:32px;min-width:32px}.nav-actions .nav{border:1px solid #d2d2d7;margin-bottom:10px;height:36px}.drawer .settings{border:1px solid #d2d2d7;background:white!important;height:36px}.project-list .nav{height:44px}.drawer .search{display:none}.label{margin:8px 10px 14px}.project-nested{padding:8px 16px 12px 30px;color:#6e6e73;font-size:13px}.project-nested h4{font-size:14px;color:#424245;margin:12px 0}.project-nested p{margin:0;padding:11px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{padding-top:16px}@media(max-width:600px){.device-cover{top:calc(44px + env(safe-area-inset-top))}.overlay{top:0}.drawer{padding-top:max(12px,env(safe-area-inset-top))}}
</style></head><body><div class="intro"><h1>WorkStep 网关 · 移动端交互原型</h1><p>头部压缩为一行：项目菜单、切换设备、返回平台。项目抽屉沿用 Web 移动端结构。</p></div><main class="phone"><header class="header"><button class="icon" id="open-drawer" aria-label="打开项目菜单" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="device-switch" id="device-switch" aria-label="切换设备" aria-expanded="false"><span class="dot"></span><span id="current-device">沙箱 1</span><span class="chevron">⌄</span></button><button class="platform-return" data-action="platform">返回平台</button><button class="icon" id="open-menu" aria-label="更多选项" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></header><div class="device-cover" id="device-cover" hidden><div class="tabs" role="dialog" aria-label="切换设备"><strong class="device-title">切换设备</strong><button class="device" role="tab" aria-selected="true" data-device="沙箱 1"><span class="dot"></span>沙箱 1</button><button class="device" role="tab" aria-selected="false" data-device="办公电脑"><span class="dot"></span>办公电脑</button><button class="device offline" role="tab" aria-selected="false" data-device="家用机" aria-disabled="true"><span class="dot"></span>家用机 · 离线</button><button class="device" role="tab" aria-selected="false" data-device="测试设备"><span class="dot"></span>测试设备</button></div></div><section class="content" id="content"></section><div class="overlay" id="overlay" hidden><aside class="drawer" role="dialog" aria-modal="true" aria-label="项目菜单"><div class="drawer-head"><strong class="drawer-brand"><span>▧</span> WorkStep</strong><button class="intro-link" data-action="intro">介绍</button><button class="icon" id="close-drawer" aria-label="关闭项目菜单"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><input class="search" id="project-search" placeholder="搜索项目" aria-label="搜索项目"><div class="nav-actions"><button class="nav" data-action="stats">▥　数据统计</button><button class="nav" data-action="add">＋　添加项目</button></div><p class="label" id="device-label">沙箱 1 的项目</p><div class="project-list" id="project-list"></div><button class="nav settings" data-action="settings">⚙　设置</button></aside></div><div class="menu-cover" id="menu-cover" hidden><div class="menu" role="menu"><div class="user">演示用户 · 已登录</div><button role="menuitem" data-action="home">我的 WorkStep</button><button role="menuitem" data-action="refresh">刷新设备</button><button role="menuitem" data-action="platform">返回平台</button><button role="menuitem" data-action="account">个人账号</button><button role="menuitem" data-action="logout">退出登录</button></div></div><div class="toast" id="toast" role="status" hidden></div></main><p class="hint">这是布局原型，所有设备、项目和任务均为模拟数据。头部没有额外设备 Tab 行；设备列表点开才显示。通知按钮暂不占主顶栏。</p><script>
const $=s=>document.querySelector(s);let device='沙箱 1',project='',section='任务',timer;const projects={'沙箱 1':['操作手册演示','示例项目'],'办公电脑':['产品需求','日常开发'],'测试设备':['回归测试']};
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2200)}
function drawer(open){$('#overlay').hidden=!open;$('#open-drawer').setAttribute('aria-expanded',open);if(open){list();$('#close-drawer').focus()}else $('#open-drawer').focus()}
function menu(open){$('#menu-cover').hidden=!open;$('#open-menu').setAttribute('aria-expanded',open);if(open)$('#menu-cover button').focus()}
function list(){const q=$('#project-search').value.trim();$('#device-label').textContent=device+' 的项目';$('#project-list').replaceChildren();projects[device].filter(p=>p.includes(q)).forEach(p=>{const b=document.createElement('button');b.className='nav';b.textContent='▱　'+p;if(p===project)b.setAttribute('aria-current','page');b.onclick=()=>{project=p;section='任务';drawer(false);render()};$('#project-list').append(b);if(p===project){const nested=document.createElement('div');nested.className='project-nested';nested.innerHTML='<h4>▱ 流程 <span style="float:right">＋</span></h4><p>研发展示流程　　8步</p><p>简单流程　　2步</p><h4>▱ 对话 <span style="color:#0071e3">普通</span> <span style="float:right">＋</span></h4><p>需求讨论　　刚刚</p><p>实现方案　　1小时前</p><p>检查构建结果　　昨天</p>';$('#project-list').append(nested)}})}
function render(){if(!project){$('#content').innerHTML='<h2>我的 WorkStep</h2><p class="connection">'+device+' · 已连接</p><button class="secondary choose" id="choose">☰　选择项目</button><div class="welcome"><h3>从项目开始工作</h3><p>打开左上角菜单，选择或创建项目。<br>切换设备后，显示对应设备的工作台。</p><button class="primary" data-action="add">＋ 添加项目</button></div>';$('#choose').onclick=()=>drawer(true)}else{$('#content').innerHTML='<div class="project-heading"><h2>'+project+'</h2><button class="icon" data-action="new" aria-label="新建">＋</button></div><div class="sections" role="tablist" aria-label="项目区域">'+['任务','会话','流程'].map(s=>'<button role="tab" aria-selected="'+(section===s)+'" data-section="'+s+'">'+s+'</button>').join('')+'</div><input class="search" id="item-search" placeholder="搜索'+section+'" aria-label="搜索'+section+'"><div class="cards" id="cards"></div>';const rows=section==='任务'?[['整理项目需求','进行中','running'],['检查构建结果','已完成','done'],['补充测试用例','待开始','']]:section==='会话'?[['需求讨论','项目会话',''],['实现方案','项目会话','']]:[['研发流程','3 个步骤',''],['审核流程','2 个步骤','']];const draw=()=>{$('#cards').innerHTML=rows.filter(r=>r[0].includes($('#item-search').value)).map(r=>'<article class="card"><h3>'+r[0]+'</h3><div class="meta"><span class="'+r[2]+'">'+r[1]+'</span><span>示例数据</span></div></article>').join('')};$('#item-search').oninput=draw;draw();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()})}}
$('#open-drawer').onclick=()=>drawer(true);$('#close-drawer').onclick=()=>drawer(false);$('#overlay').onclick=e=>{if(e.target===$('#overlay'))drawer(false)};$('#project-search').oninput=list;$('#open-menu').onclick=()=>menu(true);$('#menu-cover').onclick=e=>{if(e.target===$('#menu-cover'))menu(false)};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-disabled')==='true'){toast('设备离线，暂时无法打开');return}device=b.dataset.device;$('#current-device').textContent=device;$('#device-cover').hidden=true;$('#device-switch').setAttribute('aria-expanded','false');project='';document.querySelectorAll('[data-device]').forEach(t=>t.setAttribute('aria-selected',t===b));$('#project-search').value='';render()});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;menu(false);const a=b.dataset.action;if(a==='home'){project='';render()}else if(a==='refresh')toast('设备列表已刷新（模拟）');else toast(({stats:'数据统计',add:'添加项目',intro:'介绍',settings:'设置',platform:'平台首页',account:'个人账号',logout:'退出登录',new:'新建'+section})[a]+'：原型仅演示入口')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer(false);menu(false)}if(e.key==='Tab'&&!$('#overlay').hidden){const items=[...$('.drawer').querySelectorAll('button,input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('#device-switch').onclick=()=>{$('#device-cover').hidden=false;$('#device-switch').setAttribute('aria-expanded','true')};$('#device-cover').onclick=e=>{if(e.target===$('#device-cover')){$('#device-cover').hidden=true;$('#device-switch').setAttribute('aria-expanded','false')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#device-cover').hidden=true;$('#device-switch').setAttribute('aria-expanded','false')}});project='操作手册演示';render();
</script></body></html>
