<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>步骤产物模板 · 原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer;background:white;color:#6e6e73;border:1px solid #d2d2d7;border-radius:6px;padding:5px 10px;height:30px}button:hover{background:#f5f5f7}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0071e3;outline-offset:2px}input,select{height:32px;border:1px solid #d2d2d7;border-radius:5px;background:white;padding:5px 8px;min-width:0;color:#1d1d1f}input{width:100%}input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:#0071e3}header{height:56px;border-bottom:1px solid #eeeef0;display:flex;align-items:center;padding:0 24px;gap:16px}.brand{font-weight:650;font-size:16px}.sep{color:#d2d2d7}.muted{color:#86868b}.spacer{flex:1}.primary{background:#0071e3;border-color:#0071e3;color:#fff}.primary:hover{background:#0077ed}.ghost{border-color:transparent;background:transparent}.link{color:#0071e3;border:0;background:transparent}.icon{width:26px;padding:0;border:0;background:transparent;font-size:16px}.danger{color:#d64b4b}.workspace{display:flex;height:calc(100vh - 56px)}.canvas{flex:1;position:relative;background-color:#fafafa;background-image:radial-gradient(#ddd 1px,transparent 1px);background-size:18px 18px;overflow:hidden}.canvasbar{position:absolute;top:18px;left:20px;display:flex;gap:8px}.node{position:absolute;width:220px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;box-shadow:0 3px 12px #00000006;left:calc(50% - 110px);padding:16px}.node.one{top:145px}.node.two{top:330px;border-color:#0071e3;box-shadow:0 0 0 3px #0071e312}.node.three{top:535px}.nodehead{display:flex;align-items:center;gap:9px;font-weight:600}.badge{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#0071e315;color:#0071e3;border-radius:6px}.node p{font-size:12px;color:#86868b;margin:14px 0 0}.wire{position:absolute;left:50%;width:1px;background:#c6c6cc}.wire.a{top:243px;height:87px}.wire.b{top:429px;height:106px}.zoom{position:absolute;bottom:20px;left:20px;background:white;border:1px solid #eeeef0;padding:8px 14px;border-radius:6px;color:#6e6e73}.panel{width:50vw;min-width:440px;border-left:1px solid #eeeef0;padding:20px 24px;overflow-y:auto}.row{display:flex;align-items:center;gap:8px}.panelhead{margin-bottom:24px}.panelhead strong{font-size:13px}.delete{height:25px;border-color:#d64b4b;padding:2px 8px;margin-left:8px}.section+.section{border-top:1px solid #eeeef0;margin-top:20px;padding-top:20px}.title{font-size:15px;font-weight:600;margin:0 0 12px}.field{flex:1}.field label{display:block;margin-bottom:4px;color:#6e6e73;font-weight:500}.colors{width:116px;flex:none}.swatch{height:32px;width:42px;padding:4px;border:1px solid #d2d2d7;border-radius:5px}.swatch:after{content:'';display:block;background:#0071e3;height:22px;border-radius:2px}.key{margin-top:10px}.check{white-space:nowrap;display:flex;align-items:center;gap:6px;color:#6e6e73}.help{font-size:11px;color:#86868b;line-height:1.5;margin-top:5px}.reuse{margin-top:12px}.md{border:1px solid #d2d2d7;border-radius:6px;background:white;overflow:hidden}.toolbar{display:flex;align-items:center;gap:2px;padding:4px 7px;border-bottom:1px solid #eeeef0;height:35px}.toolbar button{font-size:12px;height:26px;border:0;background:transparent;padding:3px 8px}.toolbar .active{background:#f0f0f3;color:#1d1d1f}.toolbar .markdown{font-size:11px;color:#86868b;padding-right:4px}textarea{display:block;resize:vertical;width:100%;border:0;outline:none;padding:12px;line-height:1.8;color:#1d1d1f;background:white}.prompt{height:84px}.inputgroup{background:#f5f5f7;border:1px solid #eeeef0;border-radius:6px;padding:8px}.inputgroup select{width:80px}.outputs{margin:6px 0 0 14px}.output{display:flex;gap:4px;align-items:center;margin-top:5px}.output input{flex:1;width:100px}.arrow{color:#86868b}.template{font-size:12px;padding:0 7px;flex-shrink:0;border:0;background:transparent;color:#6e6e73}.template.selected{background:#eeeef0}.template.has.selected{background:#e6f0ff}.template.has{color:#0071e3}.editor{margin:8px 26px 10px 18px}.editor[hidden]{display:none}.template-text{height:254px;font-family:ui-monospace,SFMono-Regular,"PingFang SC",monospace;font-size:12px}.editorfoot{display:flex;align-items:center;gap:8px;margin-top:7px}.editorfoot .help{margin:0;flex:1}.preview{padding:12px;min-height:254px;line-height:1.7;white-space:pre-wrap}.preview h1{font-size:19px}.preview h2{font-size:15px}.preview p{color:#6e6e73}.add{height:26px;padding:2px 0;font-size:12px}.below{margin-top:7px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:white;padding:9px 18px;border-radius:8px;display:none}.prototype{font-size:11px;color:#86868b}@media(max-width:760px){.canvas{display:none}.panel{width:100%;min-width:0;padding:16px}header{padding:0 16px}.editor{margin-right:0}.prototype{display:none}}

/* Shared columns keep input and output fields aligned. */
.inputgroup{padding:10px}.inputgroup>.row,.output{display:grid;grid-template-columns:14px minmax(120px,1fr) 42px 72px 24px;gap:6px}.inputgroup>.row>input{grid-column:2}.inputgroup>.row>select{grid-column:4}.inputgroup>.row>.icon{grid-column:5}.inputgroup select{width:100%}.inputgroup input,.inputgroup select{height:28px}.outputs{margin:6px 0 0}.output{margin-top:6px}.output input{width:100%}.template{padding:0;height:28px;width:42px}.icon{width:24px}.editor{margin:6px 30px 10px 20px}.template-text{height:112px;min-height:80px;resize:vertical}.preview{min-height:112px;max-height:180px;overflow:auto}.editorfoot{display:none}.editor .toolbar .expand{width:26px;padding:0;font-size:16px}.editor.large .template-text{height:360px;max-height:55vh}.editor.large .preview{min-height:300px;max-height:55vh}.outputs>.add{margin-left:20px}
@media(max-width:760px){.inputgroup>.row,.output{grid-template-columns:10px minmax(70px,1fr) 38px 58px 22px;gap:4px}.editor{margin-left:14px;margin-right:26px}.template{width:38px}}

.template-dialog{width:760px;height:560px;min-width:360px;min-height:280px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);border:1px solid #d2d2d7;border-radius:12px;padding:0;box-shadow:0 20px 70px #0003;overflow:visible;color:#1d1d1f}.template-dialog::backdrop{background:#0004}.dialog-layout{height:100%;display:flex;flex-direction:column;padding:18px 20px;gap:14px}.dialog-head{display:flex;align-items:center;gap:10px;cursor:move;user-select:none}.dialog-head strong{font-size:15px}.dialog-head .muted{font-size:12px}.dialog-editor{flex:1;min-height:0;display:flex;flex-direction:column}.dialog-editor textarea{flex:1;min-height:0;resize:none;font-family:ui-monospace,SFMono-Regular,"PingFang SC",monospace;font-size:13px}.dialog-editor .preview{flex:1;min-height:0;max-height:none;overflow:auto}.dialog-footer{display:flex;justify-content:flex-end;gap:8px}.resize{position:absolute;z-index:5}.resize.n,.resize.s{height:8px;left:8px;right:8px;cursor:ns-resize}.resize.n{top:-4px}.resize.s{bottom:-4px}.resize.e,.resize.w{width:8px;top:8px;bottom:8px;cursor:ew-resize}.resize.e{right:-4px}.resize.w{left:-4px}.resize.ne,.resize.nw,.resize.se,.resize.sw{width:14px;height:14px}.resize.ne{top:-4px;right:-4px;cursor:nesw-resize}.resize.nw{top:-4px;left:-4px;cursor:nwse-resize}.resize.se{bottom:-4px;right:-4px;cursor:nwse-resize}.resize.sw{bottom:-4px;left:-4px;cursor:nesw-resize}.discard-dialog{border:1px solid #d2d2d7;border-radius:12px;padding:22px;width:320px}.discard-dialog::backdrop{background:#0003}.discard-dialog p{margin:0 0 20px}.dialog-editor [hidden]{display:none}
@media(max-width:760px){.template-dialog{width:calc(100vw - 24px);min-width:0;height:80vh}.resize{display:none}.dialog-head{cursor:default}}
</style>
<header><span class="brand">WorkStep</span><span class="sep">/</span><span>研发流程</span><span class="spacer"></span><span class="prototype">交互原型</span><button class="primary" id="saveflow">保存</button></header>
<main class="workspace"><div class="canvas"><div class="canvasbar"><button>＋ 步骤</button><button>整理画布</button></div><div class="wire a"></div><div class="wire b"></div><div class="node one"><div class="nodehead"><span class="badge">需</span>需求分析</div><p>输出　需求文档</p></div><div class="node two"><div class="nodehead"><span class="badge">实</span>实现功能</div><p>输出　变更说明、测试报告</p></div><div class="node three"><div class="nodehead"><span class="badge">审</span>审核</div><p>检查实现与验证结果</p></div><div class="zoom">−　　100%　　＋</div></div>
<aside class="panel"><div class="row panelhead"><span class="badge">实</span><strong>实现功能</strong><button class="delete danger">删除</button><span class="spacer"></span><button class="primary" id="stash">暂存</button><button class="icon" aria-label="关闭">×</button></div>
<section class="section"><h2 class="title">基本信息</h2><div class="row"><div class="field"><label>名称</label><input value="实现功能"></div><div class="field colors"><label>颜色</label><div class="row"><div class="swatch"></div><button>随机</button></div></div></div><div class="field key"><label>步骤标识 <span class="danger">*</span></label><div class="row"><input value="implement"><label class="check"><input type="checkbox" checked>自动开始</label></div><div class="help">用于步骤引用，如 @implement</div></div><div class="reuse check"><input type="checkbox">成功后复用</div></section>
<section class="section"><h2 class="title">提示词</h2><div class="md"><div class="toolbar"><button class="active">编辑</button><button>预览</button><span class="spacer"></span><span class="markdown">Markdown</span></div><textarea class="prompt">根据需求完成实现，并执行必要的验证。</textarea></div></section>
<section class="section"><h2 class="title">输入产物</h2><div class="inputgroup"><div class="row"><input value="需求文档"><select aria-label="输入格式"><option>md</option></select><button class="icon danger" aria-label="删除输入">×</button></div><div class="outputs"><div class="output"><span class="arrow">↳</span><input value="变更说明"><button class="template has" data-template="0" aria-expanded="false">模板</button><select aria-label="产物格式"><option>md</option></select><button class="icon danger" aria-label="删除变更说明">×</button></div><div class="editor" data-editor="0" hidden></div><div class="output"><span class="arrow">↳</span><input value="测试报告"><button class="template" data-template="1" aria-expanded="false">模板</button><select aria-label="产物格式"><option>md</option></select><button class="icon danger" aria-label="删除测试报告">×</button></div><div class="editor" data-editor="1" hidden></div><button class="link add">＋ 输出产物</button></div></div><button class="link add below">＋ 输入产物</button></section>
<section class="section"><h2 class="title">执行配置</h2><div class="row"><div class="field"><label>引擎</label><select><option>Codex SDK</option></select></div><div class="field"><label>模型</label><select><option>默认</option></select></div></div></section>
</aside></main><div class="toast" role="status"></div>
<dialog class="template-dialog" aria-labelledby="template-title"><div class="dialog-layout"><div class="dialog-head"><strong id="template-title">模板</strong><span class="muted" id="artifact-name"></span><span class="spacer"></span><button class="icon close-template" aria-label="关闭">×</button></div><div class="md dialog-editor"><div class="toolbar"><button class="active" data-dialog-mode="edit">编辑</button><button data-dialog-mode="preview">预览</button><span class="spacer"></span><span class="markdown">Markdown</span></div><textarea aria-label="模板" placeholder="填写产物结构和要求"></textarea><div class="preview" hidden></div></div><div class="dialog-footer"><button class="close-template">取消</button><button class="primary" id="save-template">保存</button></div></div></dialog>
<dialog class="discard-dialog"><p>放弃未保存的修改？</p><div class="dialog-footer"><button id="keep-editing">继续编辑</button><button id="discard">放弃修改</button></div></dialog>
<script>
const values=['# {{任务名称}} · 变更说明\n\n## 修改内容\n[最多 3 条，每条不超过 30 字]\n\n## 验证结果\n[一句话说明验证及结果]\n\n## 遗留问题\n[没有则写“无”]',''];
const dialog=document.querySelector('.template-dialog'),discardDialog=document.querySelector('.discard-dialog'),text=dialog.querySelector('textarea'),preview=dialog.querySelector('.preview');let current=0;
function mode(value){const show=value==='preview';text.hidden=show;preview.hidden=!show;preview.replaceChildren();if(show)text.value.split('\n').forEach(line=>{const child=document.createElement(line.startsWith('## ')?'h2':line.startsWith('# ')?'h1':'p');child.textContent=line.replace(/^#{1,2} /,'');preview.append(child)});dialog.querySelectorAll('[data-dialog-mode]').forEach(b=>b.classList.toggle('active',b.dataset.dialogMode===value))}
function openTemplate(i){current=i;text.value=values[i];document.querySelector('#artifact-name').textContent=document.querySelector('[data-template="'+i+'"]').parentElement.querySelector('input').value;mode('edit');dialog.showModal();text.focus()}
function closeTemplate(){if(text.value!==values[current])discardDialog.showModal();else dialog.close()}
document.querySelectorAll('[data-template]').forEach(btn=>{btn.removeAttribute('aria-expanded');btn.setAttribute('aria-haspopup','dialog');btn.onclick=()=>openTemplate(Number(btn.dataset.template))});
dialog.querySelectorAll('[data-dialog-mode]').forEach(btn=>btn.onclick=()=>mode(btn.dataset.dialogMode));dialog.querySelectorAll('.close-template').forEach(btn=>btn.onclick=closeTemplate);dialog.addEventListener('cancel',e=>{e.preventDefault();closeTemplate()});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeTemplate()}});
document.querySelector('#save-template').onclick=()=>{values[current]=text.value;document.querySelector('[data-template="'+current+'"]').classList.toggle('has',!!text.value.trim());dialog.close()};document.querySelector('#keep-editing').onclick=()=>discardDialog.close();document.querySelector('#discard').onclick=()=>{discardDialog.close();dialog.close()};
function drag(e,edge){if(innerWidth<=760||e.target.closest('button'))return;e.preventDefault();const r=dialog.getBoundingClientRect(),x=e.clientX,y=e.clientY;dialog.style.margin='0';dialog.style.left=r.left+'px';dialog.style.top=r.top+'px';dialog.style.width=r.width+'px';dialog.style.height=r.height+'px';function move(ev){let left=r.left,top=r.top,width=r.width,height=r.height,dx=ev.clientX-x,dy=ev.clientY-y;if(!edge){left=Math.max(8,Math.min(innerWidth-width-8,left+dx));top=Math.max(8,Math.min(innerHeight-height-8,top+dy))}else{if(edge.includes('e'))width=Math.max(360,Math.min(innerWidth-left-8,width+dx));if(edge.includes('s'))height=Math.max(280,Math.min(innerHeight-top-8,height+dy));if(edge.includes('w')){left=Math.max(8,Math.min(r.right-360,r.left+dx));width=r.right-left}if(edge.includes('n')){top=Math.max(8,Math.min(r.bottom-280,r.top+dy));height=r.bottom-top}}Object.assign(dialog.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'})}function end(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end)}document.addEventListener('pointermove',move);document.addEventListener('pointerup',end)}
for(const edge of ['n','s','e','w','ne','nw','se','sw']){const handle=document.createElement('div');handle.className='resize '+edge;handle.onpointerdown=e=>drag(e,edge);dialog.append(handle)}dialog.querySelector('.dialog-head').onpointerdown=e=>drag(e,'');
function toast(){const t=document.querySelector('.toast');t.textContent='已暂存（原型）';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}document.querySelector('#stash').onclick=toast;document.querySelector('#saveflow').onclick=toast;
if(location.hash==='#modal')openTemplate(0);
</script>
</html>
