version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/daemon
    schedule: { interval: weekly, day: monday }
    groups:
      python-runtime: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    groups:
      web-runtime: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/landing
    schedule: { interval: weekly, day: monday }
    groups:
      landing-runtime: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    open-pull-requests-limit: 5
