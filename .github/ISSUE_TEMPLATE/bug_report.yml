name: Bug report
description: Report a reproducible WorkStep defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Desktop, Web UI, Daemon/API, Workflow engine, Remote sharing, Documentation]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: WorkStep version, placeholder: "v0.1.0 or commit SHA" }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, placeholder: "macOS 15 arm64, Windows 11 x64, Ubuntu 24.04 x64" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps, description: Provide the smallest repeatable example. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior and sanitized logs }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, personal paths, and private project data.
          required: true
