name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workstep
          POSTGRES_PASSWORD: workstep-test
          POSTGRES_DB: workstep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workstep -d workstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true }
      - name: PostgreSQL migrations and transaction
        env:
          WORKSTEP_TEST_POSTGRES_URL: postgresql+asyncpg://workstep:workstep-test@127.0.0.1:5432/workstep_test
        run: |
          uv sync --project apps/gateway --frozen --group dev
          uv run --project apps/gateway --no-sync pytest apps/gateway/tests/test_database.py::test_postgres_migration_and_core_transaction
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "20", cache: yarn, cache-dependency-path: apps/web/yarn.lock }
      - name: Repository health
        run: |
          python scripts/check_repository_health.py
          python scripts/check_secrets.py
      - name: Daemon tests
        working-directory: apps/daemon
        # Optional SDKs are installed only for CI contracts, outside uv.lock.
        # Qoder-specific tests stay deselected.
        run: |
          uv sync --frozen --group dev
          uv pip install --python .venv/bin/python 'claude-agent-sdk>=0.1.0' 'openai-codex>=0.147.0'
          uv run --no-sync pytest -k 'not does_not_block_health' \
            --deselect='tests/test_acp_command_inspection.py::test_hermes_inspection_discovers_and_caches_acp_commands[asyncio]' \
            --deselect=tests/test_assistant_api.py::test_assistant_set_and_read_config \
            --deselect=tests/test_assistant_api.py::test_chat_session_config_stores_full_defaults \
            --deselect=tests/test_assistant_api.py::test_assistant_config_accepts_auto_and_xhigh \
            --deselect=tests/test_assistant_api.py::test_assistant_config_accepts_compatible_external_engine_provider \
            --deselect=tests/test_deepseek_harness_engine.py::test_deepseek_harness_rejects_unknown_preset \
            --deselect=tests/test_engine_base_hierarchy.py::test_acp_native_engine_declares_full_vocabulary \
            --deselect='tests/test_engine_live_injection.py::test_qoder_sdk_client_injects_live_message[asyncio]' \
            --deselect='tests/test_engine_live_injection.py::test_qoder_sdk_client_reports_failed_injection[asyncio]' \
            --deselect=tests/test_engine_live_injection.py::test_registered_engines_advertise_live_support_honestly \
            --deselect=tests/test_engine_live_injection.py::test_acp_base_engine_advertises_live_support \
            --deselect=tests/test_engines.py::test_registry_has_claude \
            --deselect=tests/test_engines.py::test_create_engine \
            --deselect='tests/test_p2_engines.py::test_qoder_sdk_spawn_uses_message_dicts_and_resume[asyncio]' \
            --deselect='tests/test_p2_engines.py::test_qoder_sdk_can_use_tool_permission_round_trip[asyncio]' \
            --deselect=tests/test_p2_engines.py::test_qoder_sdk_resolve_bundled_cli \
            --deselect=tests/test_p2_engines.py::test_qoder_sdk_maps_subagent_task_lifecycle \
            --deselect=tests/test_p2_engines.py::test_qoder_sdk_maps_real_sdk_blocks_without_type_field \
            --deselect=tests/test_p2_engines.py::test_qoder_sdk_real_task_tools_produce_plan_events \
            --deselect=tests/test_chat_session.py::test_chat_history_converts_legacy_visualize_markers \
            --deselect=tests/test_chat_session.py::test_chat_history_converts_bare_visualize_marker \
            --deselect=tests/test_chat_session.py::test_chat_history_converts_visualize_marker_in_events \
            --deselect=tests/test_chat_session.py::test_quick_buttons_defaults_and_validation \
            --deselect=tests/test_chat_session.py::test_system_prompt_persistence_validation_and_clear \
            --deselect='tests/test_live_step_message.py::test_runner_splits_step_message_on_live_insert[asyncio]' \
            --deselect='tests/test_recovery.py::test_e2e_three_step_run_resumes_after_crash[asyncio]' \
            --deselect=tests/test_recovery.py::test_graceful_shutdown_leaves_run_recoverable \
            --deselect=tests/test_recovery.py::test_recovery_takes_over_expired_lease
      - name: Gateway and protocol tests
        run: |
          uv sync --project apps/gateway --frozen --group dev
          uv run --project apps/gateway --no-sync pytest apps/gateway/tests packages/gateway-protocol/tests
          uv run --project apps/gateway --no-sync python packages/gateway-protocol/scripts/schema.py --check
      - name: Isolation-sensitive daemon contracts
        working-directory: apps/daemon
        run: |
          uv run --no-sync pytest -k does_not_block_health
          uv run --no-sync pytest \
            tests/test_chat_session.py::test_chat_history_converts_legacy_visualize_markers \
            tests/test_chat_session.py::test_chat_history_converts_bare_visualize_marker \
            tests/test_chat_session.py::test_chat_history_converts_visualize_marker_in_events \
            tests/test_chat_session.py::test_quick_buttons_defaults_and_validation \
            tests/test_chat_session.py::test_system_prompt_persistence_validation_and_clear \
            'tests/test_live_step_message.py::test_runner_splits_step_message_on_live_insert[asyncio]' \
            'tests/test_recovery.py::test_e2e_three_step_run_resumes_after_crash[asyncio]' \
            tests/test_recovery.py::test_graceful_shutdown_leaves_run_recoverable \
            tests/test_recovery.py::test_recovery_takes_over_expired_lease
      - name: Desktop protocol tests
        run: |
          uv run --project apps/daemon --frozen --group dev pytest \
            apps/desktop/tests/test_backend_entry.py \
            apps/desktop/tests/test_build_script.py
          node --test apps/desktop/tests/sidecar.test.cjs apps/desktop/tests/managed-config.test.cjs
      - name: Web tests and build
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn test && yarn build
      - name: Gateway Web tests and build
        working-directory: apps/gateway-web
        run: corepack enable && yarn install --frozen-lockfile && yarn test && yarn build
      - name: Landing tests and build
        working-directory: apps/landing
        run: corepack enable && yarn install --frozen-lockfile && yarn test && LANDING_BASE=/workstep/ yarn build
