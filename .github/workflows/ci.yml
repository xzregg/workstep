name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with: { enable-cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Repository health
        run: python scripts/check_repository_health.py
      - name: Daemon tests
        working-directory: apps/daemon
        run: uv run --frozen --group dev pytest
      - name: Desktop protocol tests
        working-directory: apps/daemon
        run: uv run --frozen --group dev pytest ../desktop/tests
      - name: Web tests and build
        working-directory: apps/web
        run: npm ci && npm test && npm run build
      - name: Landing tests and build
        working-directory: apps/landing
        run: corepack enable && yarn install --frozen-lockfile && yarn test && LANDING_BASE=/workstep/ yarn build
