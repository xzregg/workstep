name: Desktop package smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: main
      acceptance_tag:
        description: Published release to install and verify on Windows (empty builds all platforms)
        required: false
        default: ""
      previous_tag:
        description: Published upgrade baseline for Windows acceptance
        required: false
        default: v1.0.10
      windows_only:
        description: Build and verify only Windows from source, without publishing
        type: boolean
        required: false
        default: false
      acceptance_run:
        description: Reuse a source-built Windows installer artifact from this repository's Actions run
        required: false
        default: ""

concurrency:
  group: desktop-package-smoke-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  windows-acceptance:
    if: ${{ inputs.acceptance_tag != '' || inputs.acceptance_run != '' }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "22" }
      - name: Install acceptance tooling
        working-directory: apps/desktop
        run: corepack enable && yarn install --frozen-lockfile
      - name: Download original published installers and checksum manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_TAG: ${{ inputs.acceptance_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
        run: |
          if ($env:ACCEPTANCE_TAG -and $env:ACCEPTANCE_RUN) { throw "Choose a release tag OR a build run" }
          $tags = @($env:PREVIOUS_TAG)
          if ($env:ACCEPTANCE_TAG) { $tags += $env:ACCEPTANCE_TAG }
          foreach ($tag in $tags) {
            if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag" }
            $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
            if ($LASTEXITCODE -ne 0 -or $draft -ne "false") { throw "Release must already be published" }
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/current", "$env:RUNNER_TEMP/previous" | Out-Null
          if ($env:ACCEPTANCE_RUN) {
            if ($env:ACCEPTANCE_RUN -notmatch '^[0-9]+$') { throw "Invalid build run ID" }
            gh run download $env:ACCEPTANCE_RUN --repo $env:GITHUB_REPOSITORY --name desktop-smoke-windows-x64 --dir "$env:RUNNER_TEMP/current"
          } else {
            gh release download $env:ACCEPTANCE_TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/current" --pattern WorkStep-windows-x64.exe --pattern SHA256SUMS.txt
          }
          if ($LASTEXITCODE -ne 0) { throw "Target download failed" }
          gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/previous" --pattern WorkStep-windows-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Baseline download failed" }
      - name: Verify installed Windows desktop and upgrade
        shell: pwsh
        env:
          ACCEPTANCE_TAG: ${{ inputs.acceptance_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
        run: |
          $version = $env:ACCEPTANCE_TAG
          $checksumArgs = @('--checksums', "$env:RUNNER_TEMP/current/SHA256SUMS.txt")
          if ($env:ACCEPTANCE_RUN) {
            $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
            $checksumArgs = @()
          }
          node scripts/windows-desktop-acceptance.cjs --installer "$env:RUNNER_TEMP/current/WorkStep-windows-x64.exe" --version $version @checksumArgs --previous-installer "$env:RUNNER_TEMP/previous/WorkStep-windows-x64.exe" --previous-version $env:PREVIOUS_TAG --previous-checksums "$env:RUNNER_TEMP/previous/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Windows acceptance failed" }
          $report = Get-Content "$env:RUNNER_TEMP/windows-acceptance-report/report.json" -Raw | ConvertFrom-Json
          if ($report.success -ne $true) { throw "Windows acceptance did not complete" }
      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-acceptance-evidence
          path: ${{ runner.temp }}/windows-acceptance-report
          if-no-files-found: warn
          retention-days: 14

  macos:
    if: ${{ inputs.acceptance_tag == '' && inputs.acceptance_run == '' && !inputs.windows_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: mac
          WORKSTEP_BUILD_VERSION: smoke-${{ github.sha }}
        run: ./apps/desktop/build-backend.sh
      - name: Build unsigned macOS package
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: mac
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          ./inject-backend.sh
          yarn electron-builder --mac dmg zip --arm64 --publish never --config.mac.notarize=false
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          test -n "$(find dist -name 'WorkStep*.app' -type d -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-macos-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  windows:
    if: ${{ inputs.acceptance_tag == '' && inputs.acceptance_run == '' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify native Windows socket isolation
        shell: pwsh
        run: |
          uv run --no-project --with pytest==9.1.1 python -m pytest apps/desktop/tests/test_backend_entry.py -k 'socket or occupied or port or loopback or windows_reserves' -q
          if ($LASTEXITCODE -ne 0) { throw "Windows listener isolation failed" }
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        shell: pwsh
        run: ./apps/desktop/build-backend.ps1
      - name: Build unsigned Windows installer
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          ./inject-backend.ps1
          yarn electron-builder --win nsis --x64 --publish never --config.win.forceCodeSigning=false
          if (-not (Test-Path "resources-placeholder/backend/python/python.exe")) { throw "Bundled Python missing" }
          if (-not (Test-Path "resources-placeholder/backend/legal/sbom.cdx.json")) { throw "SBOM missing" }
          if (-not (Test-Path "dist/WorkStep-windows-x64.exe")) { throw "Windows installer missing" }
      - name: Download published Windows upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if ($env:PREVIOUS_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid baseline tag" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/previous" | Out-Null
          gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/previous" --pattern WorkStep-windows-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Baseline download failed" }
      - name: Verify source-built Windows installer and upgrade
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          node scripts/windows-desktop-acceptance.cjs --installer apps/desktop/dist/WorkStep-windows-x64.exe --version $version --previous-installer "$env:RUNNER_TEMP/previous/WorkStep-windows-x64.exe" --previous-version $env:PREVIOUS_TAG --previous-checksums "$env:RUNNER_TEMP/previous/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Windows acceptance failed" }
          $report = Get-Content "$env:RUNNER_TEMP/windows-acceptance-report/report.json" -Raw | ConvertFrom-Json
          if ($report.success -ne $true) { throw "Windows acceptance did not complete" }
      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-acceptance-evidence
          path: ${{ runner.temp }}/windows-acceptance-report
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  linux:
    if: ${{ inputs.acceptance_tag == '' && inputs.acceptance_run == '' && !inputs.windows_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: linux
          WORKSTEP_BUILD_VERSION: smoke-${{ github.sha }}
        run: ./apps/desktop/build-backend.sh
      - name: Build Linux AppImage
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: linux
        run: |
          corepack enable
          yarn install --frozen-lockfile
          ./inject-backend.sh
          yarn electron-builder --linux AppImage --x64 --publish never
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          test -f dist/WorkStep-linux-x64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error
