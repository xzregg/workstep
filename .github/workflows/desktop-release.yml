name: Desktop release

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: mac
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build macOS package and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: mac
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.publish.channel=latest-${{ matrix.arch }}
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          app_path="$(find dist -name 'WorkStep*.app' -type d -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          spctl -a -t exec -vv "$app_path"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        shell: pwsh
        env:
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.ps1
      - name: Build Windows installer and update metadata
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          corepack enable
          yarn install --frozen-lockfile
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
          ./inject-backend.ps1
          yarn electron-builder --win nsis --x64 --publish never
          if (-not (Test-Path "resources-placeholder/backend/python/python.exe")) { throw "Bundled Python missing" }
          if (-not (Test-Path "resources-placeholder/backend/legal/sbom.cdx.json")) { throw "SBOM missing" }
          $installer = Get-Item "dist/WorkStep-windows-x64.exe"
          if (-not $installer) { throw "Windows installer missing" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Windows signature: $($signature.Status)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: linux
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build AppImage and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: linux
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --linux AppImage --x64 --publish never
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          cp resources-placeholder/backend/legal/sbom.cdx.json "dist/WorkStep-${version}-sbom.cdx.json"
          test -f dist/WorkStep-linux-x64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
            apps/desktop/dist/*-sbom.cdx.json
          if-no-files-found: error

  publish-draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: desktop-*, merge-multiple: true, path: release }
      - name: Create checksums
        working-directory: release
        run: |
          sha256sum WorkStep-* > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/WorkStep-*
            release/SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
