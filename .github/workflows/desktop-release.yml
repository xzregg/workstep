name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package
        required: true

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build Nuitka backend
        env: { BUILD_PLATFORM: mac }
        run: ./apps/desktop/build-backend.sh
      - name: Build macOS package and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: mac
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.publish.channel=latest-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build Nuitka backend
        shell: pwsh
        run: ./apps/desktop/build-backend.ps1
      - name: Build Windows installer and update metadata
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          corepack enable
          yarn install --frozen-lockfile
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
          ./inject-backend.ps1
          yarn electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build Nuitka backend
        env: { BUILD_PLATFORM: linux }
        run: ./apps/desktop/build-backend.sh
      - name: Build AppImage and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: linux
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  publish-draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: desktop-*, merge-multiple: true, path: release }
      - name: Create checksums
        working-directory: release
        run: sha256sum WorkStep-* > SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
