name: Desktop release

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: mac
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build unsigned macOS package and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: mac
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.notarize=false --config.publish.channel=latest-${{ matrix.arch }}
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          app_path="$(find dist -name 'WorkStep*.app' -type d -print -quit)"
          test -n "$app_path"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-*-mac.yml
          if-no-files-found: error

  windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x86_64
          - arch: ia32
            python_arch: x86
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        shell: pwsh
        env:
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
          WORKSTEP_WINDOWS_PYTHON_ARCH: ${{ matrix.python_arch }}
        run: ./apps/desktop/build-backend.ps1
      - name: Build unsigned Windows installer and update metadata
        shell: pwsh
        working-directory: apps/desktop
        run: |
          corepack enable
          yarn install --frozen-lockfile
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
          ./inject-backend.ps1
          yarn electron-builder --win nsis --${{ matrix.arch }} --publish never --config.win.forceCodeSigning=false --config.publish.channel=latest-${{ matrix.arch }}
          if (-not (Test-Path "resources-placeholder/backend/python/python.exe")) { throw "Bundled Python missing" }
          if (-not (Test-Path "resources-placeholder/backend/legal/sbom.cdx.json")) { throw "SBOM missing" }
          $installer = Get-Item "dist/WorkStep-windows-${{ matrix.arch }}.exe"
          if (-not $installer) { throw "Windows installer missing" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-${{ matrix.arch }}.yml
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: linux
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build AppImage and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: linux
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --linux AppImage --x64 --publish never
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          cp resources-placeholder/backend/legal/sbom.cdx.json "dist/WorkStep-${version}-sbom.cdx.json"
          test -f dist/WorkStep-linux-x64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-linux.yml
            apps/desktop/dist/*-sbom.cdx.json
          if-no-files-found: error

  publish-draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: desktop-*, merge-multiple: true, path: release }
      - name: Create checksums
        working-directory: release
        run: |
          sha256sum WorkStep-* > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          existing_release="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || printf missing)"
          if [ "$existing_release" = "true" ]; then
            gh release delete-asset "$RELEASE_TAG" builder-debug.yml --yes 2>/dev/null || true
            gh release upload "$RELEASE_TAG" release/* --clobber
          elif [ "$existing_release" = "false" ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
