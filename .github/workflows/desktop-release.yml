name: Desktop release

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package
        required: true

permissions:
  contents: read

jobs:
  sandbox-image:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish immutable sandbox image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          repository="${IMAGE_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Persist browser and application build layers across fresh CI runners.
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --cache-from "type=registry,ref=$repository:buildcache" \
            --cache-to "type=registry,ref=$repository:buildcache,mode=max" \
            --tag "$repository:$RELEASE_TAG" --tag "$repository:latest" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" .
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/image-metadata.json")
          docker logout ghcr.io
          # Refuse to ship a desktop that cannot anonymously fetch its image.
          docker buildx imagetools inspect "$repository@$digest" > /dev/null
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

  macos:
    needs: [validate, sandbox-image]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Pin sandbox image to this desktop release
        working-directory: apps/desktop
        env:
          SANDBOX_IMAGE: ${{ needs.sandbox-image.outputs.image }}
        run: node scripts/write-sandbox-release.cjs
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: mac
          WORKSTEP_MACOS_ARCH: ${{ matrix.machine }}
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build unsigned macOS package and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: mac
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          # The bundled SDK tree can exceed macOS runner descriptor defaults.
          WORKSTEP_NOFILE_LIMIT=65536 source ../../scripts/file-limits.sh
          # Apply EMFILE backpressure before the signer loads its fs helpers.
          node -e 'require("graceful-fs").gracefulify(require("fs")); process.argv.splice(1, 0, require.resolve("electron-builder/cli.js")); require("electron-builder/cli.js")' -- --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false --config.publish.channel=latest-${{ matrix.arch }}
          codesign --verify --deep --strict --verbose=2 "$(find dist -maxdepth 2 -type d -name WorkStep.app -print -quit)"
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          app_path="$(find dist -name 'WorkStep*.app' -type d -print -quit)"
          test -n "$app_path"
          test "$(lipo -archs "$app_path/Contents/MacOS/WorkStep")" = "${{ matrix.machine }}"
          test "$(resources-placeholder/backend/python/bin/python3 -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
      - name: Verify installed macOS DMG before publishing
        run: node scripts/macos-desktop-acceptance.cjs --installer apps/desktop/dist/WorkStep-macos-${{ matrix.arch }}.dmg --version "${{ inputs.tag || github.ref_name }}" --arch ${{ matrix.arch }}
      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-acceptance-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-acceptance-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-*-mac.yml
          if-no-files-found: error

  windows:
    needs: [validate, sandbox-image]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pin sandbox image to this desktop release
        working-directory: apps/desktop
        env:
          SANDBOX_IMAGE: ${{ needs.sandbox-image.outputs.image }}
        run: node scripts/write-sandbox-release.cjs
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        shell: pwsh
        env:
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
          WORKSTEP_WINDOWS_PYTHON_ARCH: x86_64
        run: ./apps/desktop/build-backend.ps1
      - name: Verify native Windows CLI credential isolation
        shell: pwsh
        run: |
          uv run --no-project --python 3.12 --with pytest==9.1.1 python -m pytest apps/desktop/tests/test_local_cli_windows.py -q
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI credential isolation failed" }
      - name: Build unsigned Windows installer and update metadata
        shell: pwsh
        working-directory: apps/desktop
        run: |
          corepack enable
          yarn install --frozen-lockfile
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
          ./inject-backend.ps1
          yarn electron-builder --win nsis --x64 --publish never --config.win.forceCodeSigning=false --config.publish.channel=latest-x64
          if (-not (Test-Path "resources-placeholder/backend/python/python.exe")) { throw "Bundled Python missing" }
          if (-not (Test-Path "resources-placeholder/backend/legal/sbom.cdx.json")) { throw "SBOM missing" }
          $installer = Get-Item "dist/WorkStep-windows-x64.exe"
          if (-not $installer) { throw "Windows installer missing" }
      - name: Download published Windows upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Published upgrade baseline missing" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/previous" | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/previous" --pattern WorkStep-windows-x64.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Baseline download failed" }
          "WORKSTEP_PREVIOUS_RELEASE=$tag" >> $env:GITHUB_ENV
      - name: Verify installed Windows desktop before publishing
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          node scripts/windows-desktop-acceptance.cjs --installer apps/desktop/dist/WorkStep-windows-x64.exe --version $version --previous-installer "$env:RUNNER_TEMP/previous/WorkStep-windows-x64.exe" --previous-version $env:WORKSTEP_PREVIOUS_RELEASE --previous-checksums "$env:RUNNER_TEMP/previous/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Windows acceptance failed; release is blocked" }
          $report = Get-Content "$env:RUNNER_TEMP/windows-acceptance-report/report.json" -Raw | ConvertFrom-Json
          if ($report.success -ne $true) { throw "Windows acceptance did not complete; release is blocked" }
      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-acceptance-evidence
          path: ${{ runner.temp }}/windows-acceptance-report
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-x64.yml
          if-no-files-found: error

  linux:
    needs: [validate, sandbox-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/web/yarn.lock
            apps/desktop/yarn.lock
      - name: Pin sandbox image to this desktop release
        working-directory: apps/desktop
        env:
          SANDBOX_IMAGE: ${{ needs.sandbox-image.outputs.image }}
        run: node scripts/write-sandbox-release.cjs
      - name: Build React application
        working-directory: apps/web
        run: corepack enable && yarn install --frozen-lockfile && yarn build
      - name: Build bundled backend
        env:
          BUILD_PLATFORM: linux
          WORKSTEP_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./apps/desktop/build-backend.sh
      - name: Build AppImage and update metadata
        working-directory: apps/desktop
        env:
          BUILD_PLATFORM: linux
        run: |
          corepack enable
          yarn install --frozen-lockfile
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
          ./inject-backend.sh
          yarn electron-builder --linux AppImage --x64 --publish never
          test -x resources-placeholder/backend/python/bin/python3
          test -f resources-placeholder/backend/legal/LICENSE
          test -f resources-placeholder/backend/legal/NOTICE
          test -f resources-placeholder/backend/legal/THIRD_PARTY_NOTICES.md
          test -f resources-placeholder/backend/legal/sbom.cdx.json
          cp resources-placeholder/backend/legal/sbom.cdx.json "dist/WorkStep-${version}-sbom.cdx.json"
          test -f dist/WorkStep-linux-x64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-linux.yml
            apps/desktop/dist/*-sbom.cdx.json
          if-no-files-found: error

  publish-draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: desktop-*, merge-multiple: true, path: release }
      - name: Create checksums
        working-directory: release
        run: |
          sha256sum WorkStep-* > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          existing_release="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || printf missing)"
          if [ "$existing_release" = "true" ]; then
            gh release delete-asset "$RELEASE_TAG" builder-debug.yml --yes 2>/dev/null || true
            gh release upload "$RELEASE_TAG" release/* --clobber
          elif [ "$existing_release" = "false" ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
