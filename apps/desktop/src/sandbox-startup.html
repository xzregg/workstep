<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkStep 沙箱启动</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #f5f5f7; }
    body { margin: 0; min-height: 100vh; box-sizing: border-box; display: grid; place-items: start center; padding: 48px 0; overflow-y: auto; }
    main { width: min(430px, calc(100vw - 64px)); }
    .brand { display: flex; align-items: center; gap: 10px; color: #0071e3; font-weight: 700; font-size: 16px; }
    .mark { width: 26px; height: 26px; border-radius: 12px; background: linear-gradient(135deg, #0071e3, #7c3aed); }
    h1 { margin: 28px 0 10px; font-size: 24px; }
    p { color: #6e6e73; line-height: 1.6; }
    .progress-meta { display: flex; justify-content: space-between; gap: 16px; color: #424245; }
    .progress-meta strong { color: #1d1d1f; }
    .track { height: 6px; overflow: hidden; border-radius: 12px; background: #e8e8ed; margin: 26px 0 16px; }
    .bar { height: 100%; width: 36%; border-radius: inherit; background: #0071e3; animation: moving 1.2s ease-in-out infinite alternate; }
    .track[data-value] .bar { animation: none; width: var(--progress); transition: width .2s ease; }
    .detail { margin-top: 18px; padding: 14px 16px; white-space: pre-wrap; border-radius: 12px; background: #fbfbfd; color: #dc2626; display: none; }
    .failed .detail { display: block; }
    .failed .bar { width: 100%; animation: none; background: #dc2626; }
    .startup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .image-picker { display: none; margin-top: 12px; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; background: #fbfbfd; }
    .image-picker.visible { display: block; }
    .image-picker select { width: 100%; min-height: 38px; margin-bottom: 10px; border: 1px solid #d2d2d7; border-radius: 10px; background: white; padding: 0 10px; font: inherit; }
    .image-picker-actions { display: flex; gap: 10px; }
    button { min-height: 36px; padding: 0 14px; border: 1px solid #d2d2d7; border-radius: 12px; background: #fbfbfd; color: #1d1d1f; font: inherit; cursor: pointer; }
    button.primary { border-color: #0071e3; background: #0071e3; color: #ffffff; }
    .logs { display: none; max-height: 180px; margin-top: 12px; padding: 12px; overflow: auto; border: 1px solid #d2d2d7; border-radius: 12px; background: #fbfbfd; color: #424245; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .logs.visible { display: block; }
    @keyframes moving { from { transform: translateX(-80%); } to { transform: translateX(250%); } }
  </style>
</head>
<body><main id="app"><div class="brand"><span class="mark"></span>WorkStep</div><h1>正在启动沙箱</h1><div class="progress-meta"><strong id="status">正在检查沙箱配置</strong><span id="percent">5%</span></div><div class="track" id="track" data-value><div class="bar" style="--progress: 5%"></div></div><p>首次启动 Podman 虚拟机和容器可能需要一些时间。这里会持续显示当前阶段。</p><div class="detail" id="error"></div><div class="startup-actions"><button class="primary" id="change-image">更换镜像</button><button id="view-logs">查看日志</button><button id="copy-logs">复制日志</button><button id="open-logs">打开日志目录</button></div><div class="image-picker" id="image-picker"><select id="image-select"><option value="">正在扫描本地 Docker…</option></select><div class="image-picker-actions"><button class="primary" id="confirm-image" disabled>使用所选镜像</button><button id="cancel-image">取消</button></div></div><pre class="logs" id="logs"></pre></main>
</body></html>
