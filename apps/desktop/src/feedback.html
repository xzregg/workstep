<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一键反馈</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <header><h1>一键反馈</h1><p>复制简短运行信息和最近 5 类错误摘要，粘贴给开发者。</p></header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
    <section id="consent" hidden>
      <h2>是否附当前页面截图？</h2>
      <p>仅截取 WorkStep 当前页面。截图可能包含对话、项目名称等敏感信息，请预览后确认。</p>
      <p>请先粘贴诊断文字，复制截图会替换剪贴板中的文字。</p>
      <button id="capture">附当前页面截图</button>
    </section>
    <section id="preview" hidden>
      <h2>检查截图中的敏感信息</h2>
      <div class="image-preview" id="image-preview"></div>
      <div class="actions"><button id="copy-image">复制截图</button><button id="cancel-image" class="secondary">取消截图</button></div>
    </section>
  </main>
  <footer><button id="retry" class="secondary">重新复制诊断文字</button><button id="done" class="secondary">完成</button></footer>
  <script src="feedback-renderer.js"></script>
</body>
</html>
