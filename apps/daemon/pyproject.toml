[project]
name = "workstep-daemon"
version = "0.1.0"
description = "WorkStep local-first workflow orchestration daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "peewee>=3.17",
    "pydantic-settings>=2.0",
    "agent-client-protocol>=0.11.0",
    "httpx>=0.27",
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "claude-agent-sdk>=0.1.0",
    "openai-codex>=0.144.4",
    "qoder-agent-sdk>=1.0.11",
    "croniter>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]
desktop = [
    "pywebview>=6.0",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
