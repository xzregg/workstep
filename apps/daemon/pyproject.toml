[project]
name = "workstep-daemon"
version = "0.1.0"
description = "WorkStep local-first workflow orchestration daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "peewee>=3.17",
    "pydantic-settings>=2.0",
    "agent-client-protocol>=0.11.0",
    "httpx>=0.27",
    "websockets>=15.0",
    "logfire[fastapi]>=4.0",
    "pydantic-ai-slim[anthropic,logfire,openai,duckduckgo,web-fetch]>=2.33.0",
    "croniter>=6.0",
    "pydantic-ai-harness[skills]==0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]
qoder = [
    "qoder-agent-sdk>=1.0.11",
]
# 可选引擎 SDK：默认不随 daemon 打包安装，由用户在设置页按需安装
# （引擎本身提供“未安装 → 安装按钮”的降级路径）。
sdk-engines = [
    "claude-agent-sdk>=0.1.0",
    "openai-codex>=0.147.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
