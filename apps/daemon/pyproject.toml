[project]
name = "workstep-daemon"
version = "1.0.27"
description = "WorkStep local-first workflow orchestration daemon"
requires-python = ">=3.11.5"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "peewee>=3.17",
    "psutil>=7.2,<8",
    "pydantic-settings>=2.0",
    "agent-client-protocol>=0.11.0",
    "httpx>=0.27",
    "mcp>=1.29,<2",
    "packaging>=24.0",
    "websockets>=15.0",
    "python-socks>=2.0.0",
    "logfire[fastapi]>=4.0",
    "pydantic-ai-slim[anthropic,logfire,openai,duckduckgo,web-fetch]>=2.69.0,<3",
    "croniter>=6.0",
    "tzdata>=2025.2",
    # Includes deduplicated SQLite snapshot messages and WindowsWorkspace.
    "pydantic-ai-harness[coder,skills]==0.69.0",
    "wecom-aibot-python-sdk>=1.0.2",
    "dingtalk-stream>=0.24.3",
    "workstep-gateway-protocol[http]",
    "cryptography>=43.0",
    "pywebpush>=2.5.0",
    "tinycss2>=1.4,<2",
    "lark-oapi>=1.7.5,<1.8",
    "pillow>=13.0,<14",
    "aioice>=0.9",
    "pyopenssl>=24.0",
]

[tool.uv.sources]
workstep-gateway-protocol = { path = "../../packages/gateway-protocol", editable = true }
workstep-webrtc-signal = { path = "../../packages/webrtc-signal", editable = true }

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.4", "anyio>=4.14.2", "certifi>=2026.10.18",
    "pyjwt>=2.15.0", "httpcore2>=2.10.0", "httpx2>=2.12.0",
    "opentelemetry-api>=1.45.2", "soupsieve>=4.0.0", "urllib3>=2.8.0",
    "mcp>=1.30.0",
]

[dependency-groups]
dev = [
    "workstep-webrtc-signal",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]
qoder = [
    "qoder-agent-sdk>=1.0.11",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
