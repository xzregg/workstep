<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WorkStep 是面向个人开发者与小团队的 AI 开发工作台。连接 Codex、Claude Code，按步骤分析需求、实现代码、运行测试与审查，查看结果并审核返工。"
    />
    <meta property="og:title" content="WorkStep — 让 AI 按步骤开发，关键结果由你把关" />
    <meta
      property="og:description"
      content="把需求分析、代码实现、测试和审查连接成可复用的流程。步骤结果自动传递，关键步骤可人工审核，不满意就退回重做。"
    />
    <title>WorkStep — 让 AI 按步骤开发，关键结果由你把关</title>
    <script>
      ;(() => {
        let storedTheme = null
        try {
          storedTheme = localStorage.getItem('workstep-landing-theme')
        } catch {}
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
