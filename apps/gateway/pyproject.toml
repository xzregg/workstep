[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstep-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "httpx>=0.27",
    "cryptography>=44",
    "workstep-gateway-protocol",
]

[tool.uv.sources]
workstep-gateway-protocol = { path = "../../packages/gateway-protocol", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
