plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workstep.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.workstep.android'
        minSdk 29
        targetSdk 35
        versionCode 65
        versionName '1.0.64'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}


def runtimeDiagnosticsAssets = tasks.register('copyRuntimeDiagnosticsAssets', Sync) {
    from '../../desktop/src'
    include 'runtime-diagnostics.html', 'runtime-diagnostics.css', 'runtime-diagnostics.js',
            'runtime-diagnostics-view.js', 'runtime-diagnostics-native.js'
    into layout.buildDirectory.dir('generated/runtimeDiagnosticsAssets')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/runtimeDiagnosticsAssets'))
tasks.named('preBuild').configure { dependsOn runtimeDiagnosticsAssets }
