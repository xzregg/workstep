<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkStep</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/mobile.css" />
  <style>
.app-loading {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #6e6e73;
}
.app-loading-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid #d2d2d7;
  border-top-color: #0071e3;
  border-radius: 50%;
  animation: app-loading-spin 1s linear infinite;
}
@keyframes app-loading-spin { to { transform: rotate(360deg); } }
.app-startup-error { flex-direction: column; padding: 24px; box-sizing: border-box; text-align: center; }
.app-startup-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; align-items: center; }
.app-startup-actions button { font: inherit; padding: 10px 18px; cursor: pointer; }
.app-startup-actions a { color: #0071e3; }
</style>
  </head>
  <body>
    <div id="root"><div class="app-loading" role="status"><span class="app-loading-spinner" aria-hidden="true"></span>正在加载 WorkStep…</div></div>
    <script id="workstep-startup-guard">
      // This must run without importing the application: its module may fail to load or evaluate.
      (function () {
        var root = document.getElementById('root');
        function freshReload() {
          var target = new URL(window.location.href);
          target.searchParams.set('_workstep_reload', String(Date.now()));
          window.location.replace(target.href);
        }
        // An open tab can still refer to a chunk removed by an application update.
        window.addEventListener('vite:preloadError', function (event) {
          if (new URL(window.location.href).searchParams.has('_workstep_reload')) {
            showFailure('WorkStep 资源加载失败，请检查网络后重新加载。');
            return;
          }
          event.preventDefault();
          freshReload();
        });
        function waiting() { return !root.firstElementChild || !!root.querySelector('.app-loading'); }
        function cleanup() {
          clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener('error', failed, true);
          window.removeEventListener('unhandledrejection', failed);
        }
        function showFailure(message) {
          if (!waiting()) { cleanup(); return; }
          cleanup();
          var panel = document.createElement('div');
          panel.className = 'app-loading app-startup-error';
          panel.setAttribute('role', 'alert');
          var text = document.createElement('p');
          text.textContent = message;
          var actions = document.createElement('div');
          actions.className = 'app-startup-actions';
          var retry = document.createElement('button');
          retry.textContent = '重新加载';
          retry.onclick = freshReload;
          actions.appendChild(retry);
          if (/^\/workspace\/[^/]+(?:\/|$)/.test(window.location.pathname)) {
            var back = document.createElement('a');
            back.href = '/devices';
            back.textContent = '返回网关平台';
            actions.appendChild(back);
          }
          panel.appendChild(text);
          panel.appendChild(actions);
          root.replaceChildren(panel);
        }
        function failed(event) {
          // Ignore unrelated images/styles; resource errors matter for scripts only.
          if (event.type === 'error' && event.target && event.target.nodeType === 1 && event.target.tagName !== 'SCRIPT') return;
          showFailure('WorkStep 启动失败，请重新加载。若仍失败，可通过安卓悬浮菜单查看排查信息。');
        }
        var observer = new MutationObserver(function () { if (!waiting()) cleanup(); });
        observer.observe(root, { childList: true, subtree: true });
        var timer = window.setTimeout(function () {
          showFailure('WorkStep 启动超时，请检查网络后重新加载，或返回网关平台重新进入。');
        }, 25000);
        window.addEventListener('error', failed, true);
        window.addEventListener('unhandledrejection', failed);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
