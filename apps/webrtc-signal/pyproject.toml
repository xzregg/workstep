[project]
name = "workstep-webrtc-signal-server"
version = "0.1.0"
description = "Standalone zero-database WebRTC signaling and STUN server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "workstep-webrtc-signal",
]

[tool.uv.sources]
workstep-webrtc-signal = { path = "../../packages/webrtc-signal", editable = true }
workstep-gateway-protocol = { path = "../../packages/gateway-protocol", editable = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
